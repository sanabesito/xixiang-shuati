的变化，没有改变我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。选项C“民主政治发展方向”与题意无关，选项D“经济总量世界第二”是已经发生的变化，不属于“没有改变”的范畴。"},{"id":"c4-o-m4","type":"multi","orig":true,"origNo":4,"q":"马克思主义认为，人民群众是历史的创造者。这一原理在新时代的体现包括（ ）。","options":["人民是决定党和国家前途命运的根本力量","一切依靠群众，从群众中来，到群众中去","英雄人物决定历史发展方向，人民群众只是被动追随","尊重人民主体地位，发挥人民首创精神"],"answer":"ABD","explain":"本题考查人民群众的历史地位。选项A、B、D均是对人民群众历史主体地位的准确表述。选项C是历史唯心主义的错误观点，马克思主义认为人民群众是历史的创造者，英雄人物在历史发展中起重要作用，但不能决定历史发展方向。。"},{"id":"c4-o-m5","type":"multi","orig":true,"origNo":5,"q":"下列属于坚持以人民为中心的发展思想的具体体现的有（ ）。","options":["脱贫攻坚战取得全面胜利","全面建成小康社会","推进健康中国建设","实施乡村振兴战略"],"answer":"ABCD","explain":"本题考查以人民为中心在实践中的体现。四个选项都是近年来党和国家坚持以人民为中心、改善民生福祉的重大举措。"},{"id":"c4-o-m6","type":"multi","orig":true,"origNo":6,"q":"习近平总书记强调，党员干部要树立正确的政绩观。下列属于正确政绩观要求的有（ ）。","options":["坚持发展为了人民、发展依靠人民、发展成果由人民共享","追求“短平快”项目，以GDP增速论英雄","多做打基础、利长远的实事","把人民满意不满意、高兴不高兴、答应不答应作为衡量政绩的根本标准"],"answer":"ACD","explain":"本题考查正确政绩观的核心要义。选项A体现了以人民为中心的发展思想；选项C强调了功成不必在我的境界；选项D明确了政绩评价的根本标准。选项B是错误政绩观的典型表现，片面追求短期效益，违背了高质量发展的要求。"},{"id":"c4-o-m7","type":"multi","orig":true,"origNo":7,"q":"共同富裕是全体人民的富裕，是（ ）。","options":["物质生活和精神生活都富裕","消除两极分化的富裕","同步富裕","同等富裕"],"answer":"AB","explain":"本题考查共同富裕的科学内涵。共同富裕是物质和精神都富裕，不是少数人的富裕，也不是整齐划一的平均主义。C和D是错误理解。"},{"id":"c4-o-m8","type":"multi","orig":true,"origNo":8,"q":"发展为了人民、发展依靠人民、发展成果由人民共享，这体现了（ ）。","options":["发展的目的","发展的动力","发展的归宿","发展的路径"],"answer":"ABC","explain":"本题考查“三个发展”的深层含义。“为了人民”是目的，“依靠人民”是动力，“由人民共享”是归宿，三者有机统一。"},{"id":"c4-o-m9","type":"multi","orig":true,"origNo":9,"q":"习近平总书记强调，要“把人民拥护不拥护、赞成不赞成、高兴不高兴、答应不答应作为衡量一切工作得失的根本标准”。这体现了（ ）。","options":["人民是历史的创造者","人民是党的工作的最高裁决者","人民立场是党的根本政治立场","党的群众路线"],"answer":"ABCD","explain":"本题考查对人民标准论的综合理解。这一重要论述深刻体现了历史唯物主义观点、党的根本立场和工作方法。"},{"id":"c4-o-m10","type":"multi","orig":true,"origNo":10,"q":"走好新时代群众路线，需要（ ）。","options":["深入基层调查研究","运用网络了解民意","畅通群众诉求表达渠道","解决群众急难愁盼问题"],"answer":"ABCD","explain":"本题考查新时代群众路线的实践要求。新时代走好群众路线，既要传承优良传统，也要创新方式方法，最终要落实到解决实际问题上来。"},{"id":"c4-o-m11","type":"multi","orig":true,"origNo":11,"q":"在推动共同富裕过程中，要正确处理（ ）等重大关系。","options":["效率和公平","先富和共富","物质富裕和精神富足","城市和乡村"],"answer":"ABCD","explain":"本题考查共同富裕中的辩证关系。这四个方面都是推进共同富裕必须处理好的重要关系。"},{"id":"c4-o-m12","type":"multi","orig":true,"origNo":12,"q":"坚持以人民为中心，要求我们在经济发展中（ ）。","options":["更加注重保障和改善民生","更加注重社会公平正义","更加注重生态环境保护","更加注重人的全面发展"],"answer":"ABCD","explain":"本题考查以人民为中心对经济发展的要求。以人民为中心的发展，必然是民生改善、公平正义、生态良好、促进人的全面发展的发展。"},{"id":"c4-o-m13","type":"multi","orig":true,"origNo":13,"q":"尊重人民首创精神，要求我们在改革发展中（ ）。","options":["鼓励基层大胆探索、先行先试","及时总结推广群众创造的鲜活经验","把顶层设计与问计于民统一起来","完全依靠专家决策，群众只需执行"],"answer":"ABC","explain":"本题考查尊重人民首创精神的具体要求。选项A体现了对基层创新的鼓励；选项B强调了对群众实践经验的重视；选项C说明了顶层设计与群众路线的统一。选项D否认了群众智慧，是脱离群众的错误做法。"},{"id":"c4-o-m14","type":"multi","orig":true,"origNo":14,"q":"从“脱贫攻坚”到“乡村振兴”的战略衔接，体现了（ ）。","options":["党对“三农”工作的高度重视","坚持以人民为中心的发展思想","共同富裕的长期性和艰巨性","党的政策的连续性和稳定性"],"answer":"ABCD","explain":"本题考查对两大战略衔接的全面理解。这一衔接体现了党对农民福祉的持续关注、以人民为中心的理念、共同富裕的艰巨性以及政策的一贯性。"},{"id":"c4-o-m15","type":"multi","orig":true,"origNo":15,"q":"在抗击新冠疫情中，“人民至上、生命至上”的理念要求我们（ ）。","options":["不惜一切代价保护人民生命安全和身体健康","统筹疫情防控和经济社会发展","依靠人民打赢疫情防控阻击战","构建人类卫生健康共同体"],"answer":"ABCD","explain":"本题考查“人民至上、生命至上”理念的实践要求。四个选项分别从保护生命、统筹发展、依靠群众、国际合作等角度体现了这一理念。"},{"id":"c4-o-m16","type":"multi","orig":true,"origNo":16,"q":"坚持人民主体地位，必须（ ）。","options":["保证人民依法实行民主选举","保证人民依法实行民主协商","保证人民依法实行民主决策","保证人民依法实行民主管理、民主监督"],"answer":"ABCD","explain":"本题考查人民当家作主的具体实现形式。民主选举、民主协商、民主决策、民主管理、民主监督构成了完整的全过程人民民主链条。"},{"id":"c4-o-m17","type":"multi","orig":true,"origNo":17,"q":"习近平总书记指出：“中国共产党根基在人民、血脉在人民、力量在人民。”这一论断深刻揭示了（ ）。","options":["党的根本性质","党的力量源泉","党的执政基础","党的奋斗目标"],"answer":"ABCD","explain":"本题考查对党与人民关系的全面理解。这一论断从根基、血脉、力量三个维度，深刻揭示了党的性质、力量来源、执政基础和奋斗目标。"},{"id":"c4-o-m18","type":"multi","orig":true,"origNo":18,"q":"坚持以人民为中心的发展思想，要求我们在推进中国式现代化过程中（ ）。","options":["实现全体人民共同富裕","促进人与自然和谐共生","推动物质文明和精神文明协调发展","走和平发展道路"],"answer":"ABCD","explain":"本题考查中国式现代化与以人民为中心的关系。中国式现代化的五大特征都体现了以人民为中心：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。"},{"id":"c4-o-m19","type":"multi","orig":true,"origNo":19,"q":"在新时代，践行以人民为中心的发展思想，需要（ ）。","options":["不断满足人民日益增长的美好生活需要","着力解决发展不平衡不充分问题","推动高质量发展","扎实推进共同富裕"],"answer":"ABCD","explain":"本题考查新时代践行以人民为中心的主要任务。四个选项分别从需求满足、问题解决、发展方式、最终目标等角度构成了完整的实践路径。"},{"id":"c4-o-m20","type":"multi","orig":true,"origNo":20,"q":"从“全心全意为人民服务”到“以人民为中心”，体现了（ ）。","options":["党的根本宗旨的一脉相承","党对人民主体地位认识的深化","党对发展目的和发展动力的新认识","党的理论创新成果"],"answer":"ABCD","explain":"本题考查党的为民思想的传承与发展。从“为人民服务”到“以人民为中心”，既一脉相承又与时俱进，体现了党的宗旨不变、认识深化、理论创新。"}]},{"id":"c5","title":"第五章 全面深化改革开放","note":"原题来源：第五章练习题.docx（单选30+多选20，答案取自原文件答案区，解析为按教材要点补写）；补充题依据：《中共中央关于进一步全面深化改革、推进中国式现代化的决定》（二十届三中全会）。","questions":[{"id":"c5-o-s1","type":"single","orig":true,"origNo":1,"q":"全面深化改革的总目标是什么？(  )","options":["建设中国特色社会主义制度，推进国家治理体系和治理能力现代化","建设社会主义市场经济体制","发展社会主义民主政治","推进全面依法治国"],"answer":"A","explain":"全面深化改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。"},{"id":"c5-o-s2","type":"single","orig":true,"origNo":2,"q":"统筹推进各领域各方面改革开放，必须以全面深化改革开放总目标为引领，以(  )为主线，以经济体制改革为重点。","options":["制度建设","组织建设","社会建设","现代化建设"],"answer":"A","explain":"进一步全面深化改革以制度建设为主线，以经济体制改革为重点牵引各领域改革。"},{"id":"c5-o-s3","type":"single","orig":true,"origNo":3,"q":"全面深化改革的出发点和落脚点是（ ）。","options":["促进社会公平正义、增进人民福祉","完善社会主义市场经济体制","建设社会主义法治国家","实现中华民族伟大复兴"],"answer":"A","explain":"全面深化改革以促进社会公平正义、增进人民福祉为出发点和落脚点，坚持以人民为中心。"},{"id":"c5-o-s4","type":"single","orig":true,"origNo":4,"q":"关于全面深化改革，下列表述错误的是（ ）。","options":["改革是社会主义制度的自我完善和发展","改革是对原有体制的根本性变革","改革是中国的第二次革命","改革是一个阶级推翻另一个阶级的暴力革命"],"answer":"D","explain":"改革是社会主义制度的自我完善和发展，是中国的第二次革命，是对原有体制的根本性变革，但绝不是阶级推翻阶级的暴力革命。"},{"id":"c5-o-s5","type":"single","orig":true,"origNo":5,"q":"全面深化改革，必须坚持正确处理改革发展稳定关系的方针。其中，（ ）是前提。","options":["改革","发展","稳定","创新"],"answer":"C","explain":"改革是动力，发展是目的，稳定是前提。必须把改革的力度、发展的速度和社会可承受的程度统一起来。"},{"id":"c5-o-s6","type":"single","orig":true,"origNo":6,"q":"全面深化改革的总目标中，完善和发展中国特色社会主义制度是（ ）。","options":["方向","路径","手段","目的"],"answer":"A","explain":"总目标中，完善和发展中国特色社会主义制度是前提和方向，推进国家治理体系和治理能力现代化是目的和落脚点。"},{"id":"c5-o-s7","type":"single","orig":true,"origNo":7,"q":"我国改革开放的实践充分证明，（ ）是决定当代中国命运的关键一招。","options":["党的领导","改革开放","经济建设","科技创新"],"answer":"B","explain":"改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。"},{"id":"c5-o-s8","type":"single","orig":true,"origNo":8,"q":"推进全面深化改革，要把（ ）作为全面深化改革的出发点和落脚点。","options":["实现好、维护好、发展好最广大人民根本利益","完善和发展中国特色社会主义制度","推进国家治理体系和治理能力现代化","解放和发展社会生产力"],"answer":"A","explain":"全面深化改革必须始终把实现好、维护好、发展好最广大人民根本利益作为出发点和落脚点。"},{"id":"c5-o-s9","type":"single","orig":true,"origNo":9,"q":"关于全面深化改革，下列说法正确的是（ ）。","options":["改革是社会主义制度的根本变革","改革是中国的第三次革命","改革是社会主义制度的自我完善和发展","改革的目标是建立资本主义制度"],"answer":"C","explain":"改革是社会主义制度的自我完善和发展，不是对社会主义制度的根本否定，目标是完善和发展中国特色社会主义制度。"},{"id":"c5-o-s10","type":"single","orig":true,"origNo":10,"q":"改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的（ ）。","options":["关键一步","关键一招","必由之路","根本动力"],"answer":"B","explain":"习近平总书记强调，改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。"},{"id":"c5-o-s11","type":"single","orig":true,"origNo":11,"q":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力（ ）。","options":["科学化","民主化","现代化","法治化"],"answer":"C","explain":"全面深化改革总目标即完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。"},{"id":"c5-o-s12","type":"single","orig":true,"origNo":12,"q":"坚持和发展中国特色社会主义，必须不断适应社会生产力发展调整生产关系，不断适应经济基础发展完善上层建筑。这体现了（ ）的基本原理。","options":["生产力决定生产关系","经济基础决定上层建筑","社会基本矛盾运动","人民群众是历史创造者"],"answer":"C","explain":"生产力与生产关系、经济基础与上层建筑的矛盾构成社会基本矛盾。改革就是通过调整生产关系适应生产力、完善上层建筑适应经济基础，体现了社会基本矛盾运动原理。"},{"id":"c5-o-s13","type":"single","orig":true,"origNo":13,"q":"新时代全面深化改革，必须坚持（ ），这是全面深化改革的出发点和落脚点。","options":["以经济建设为中心","以人民为中心","以发展为第一要务","以党的领导为根本保证"],"answer":"B","explain":"全面深化改革坚持以人民为中心，促进社会公平正义、增进人民福祉是改革的出发点和落脚点。"},{"id":"c5-o-s14","type":"single","orig":true,"origNo":14,"q":"全面深化改革，必须坚持和加强党的（ ）。","options":["思想领导","组织领导","政治领导","全面领导"],"answer":"D","explain":"全面深化改革必须坚持和加强党的全面领导，把党的领导贯穿改革全过程各方面。"},{"id":"c5-o-s15","type":"single","orig":true,"origNo":15,"q":"改革、发展、稳定是我国社会主义现代化建设的三个重要支点，其中（ ）是解决一切经济社会问题的关键。","options":["改革","发展","稳定","创新"],"answer":"B","explain":"发展是解决一切经济社会问题的关键，是党执政兴国的第一要务；改革是动力，稳定是前提。"},{"id":"c5-o-s16","type":"single","orig":true,"origNo":16,"q":"全面深化改革的重点是（ ）。","options":["政治体制改革","经济体制改革","文化体制改革","社会体制改革"],"answer":"B","explain":"经济体制改革是全面深化改革的重点，核心问题是处理好政府和市场的关系。"},{"id":"c5-o-s17","type":"single","orig":true,"origNo":17,"q":"国家治理体系是在党领导下管理国家的（ ），包括经济、政治、文化、社会、生态文明和党的建设等各领域体制机制、法律法规安排。","options":["制度体系","组织体系","法规体系","管理体系"],"answer":"A","explain":"国家治理体系是党领导下管理国家的制度体系，是一整套紧密相连、相互协调的国家制度。"},{"id":"c5-o-s18","type":"single","orig":true,"origNo":18,"q":"国家治理能力是运用国家制度管理社会各方面事务的能力，包括（ ）等各个方面。","options":["改革发展稳定、内政外交国防、治党治国治军","经济建设、政治建设、文化建设、社会建设、生态文明建设","党的领导、人民当家作主、依法治国","决策、执行、监督"],"answer":"A","explain":"国家治理能力是运用国家制度管理社会各方面事务的能力，包括改革发展稳定、内政外交国防、治党治国治军等各个方面。"},{"id":"c5-o-s19","type":"single","orig":true,"origNo":19,"q":"新时代坚持和发展中国特色社会主义，根本动力仍然是（ ）。","options":["科技创新","全面深化改革","对外开放","发展生产力"],"answer":"B","explain":"改革开放是当代中国发展进步的活力之源，新时代坚持和发展中国特色社会主义的根本动力仍然是全面深化改革。"},{"id":"c5-o-s20","type":"single","orig":true,"origNo":20,"q":"开放型世界经济的建设，要推动经济全球化朝着更加开放、包容、普惠、平衡、（ ）的方向发展。","options":["共赢","公平","可持续","创新"],"answer":"A","explain":"推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展，是中国推动建设开放型世界经济的重要主张。"},{"id":"c5-o-s21","type":"single","orig":true,"origNo":21,"q":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。其中，后者的核心是（ ）。","options":["党的领导","依法治国","人民当家作主","制度现代化"],"answer":"D","explain":"推进国家治理体系和治理能力现代化的核心是制度现代化，即实现国家治理的制度化、规范化、程序化。"},{"id":"c5-o-s22","type":"single","orig":true,"origNo":22,"q":"经济体制改革的核心问题是处理好（ ）的关系。","options":["政府和企业","计划和市场","政府和市场","宏观和微观"],"answer":"C","explain":"经济体制改革的核心问题是处理好政府和市场的关系，使市场在资源配置中起决定性作用，更好发挥政府作用。"},{"id":"c5-o-s23","type":"single","orig":true,"origNo":23,"q":"（ ）是开启改革开放事业的思想前提，也是新时代全面深化改革开放的思想前提。","options":["解放思想","实事求是","开拓创新","求真务实"],"answer":"A","explain":"解放思想是开启改革开放事业的思想前提。改革开放每前进一步，都以解放思想为先导。"},{"id":"c5-o-s24","type":"single","orig":true,"origNo":24,"q":"改革开放的鲜明特征和首要任务是（ ）。","options":["经济改革","社会改革","解放和发展社会生产力","增强综合国力"],"answer":"C","explain":"解放和发展社会生产力是改革开放的鲜明特征和首要任务。"},{"id":"c5-o-s25","type":"single","orig":true,"origNo":25,"q":"全面深化改革关键所在是（ ）。","options":["解放和增强社会活力","实现共同富裕","完善社会制度","深化经济体制改革"],"answer":"A","explain":"解放和增强社会活力是全面深化改革的关键所在，是改革的目的之一和重要条件。"},{"id":"c5-o-s26","type":"single","orig":true,"origNo":26,"q":"全面深化改革，要更加注重改革的（ ），增强改革的系统性、整体性、协同性。","options":["全面性","深刻性","创新性","系统性、整体性、协同性"],"answer":"D","explain":"全面深化改革要更加注重改革的系统性、整体性、协同性，统筹推进各领域改革。"},{"id":"c5-o-s27","type":"single","orig":true,"origNo":27,"q":"开放带来进步，封闭必然落后。中国坚持（ ）的基本国策。","options":["互利共赢","对外开放","独立自主","和平发展"],"answer":"B","explain":"对外开放是我国的基本国策，开放带来进步，封闭必然落后。"},{"id":"c5-o-s28","type":"single","orig":true,"origNo":28,"q":"全面深化改革，必须坚持的出发点和落脚点是促进社会公平正义、（ ）。","options":["增进人民福祉","实现共同富裕","维护社会稳定","完善市场经济"],"answer":"A","explain":"全面深化改革以促进社会公平正义、增进人民福祉为出发点和落脚点。"},{"id":"c5-o-s29","type":"single","orig":true,"origNo":29,"q":"坚持和完善社会主义基本经济制度，要充分发挥市场在资源配置中的（ ）性作用。","options":["基础","决定","主导","辅助"],"answer":"B","explain":"市场在资源配置中起决定性作用，同时更好发挥政府作用。"},{"id":"c5-o-s30","type":"single","orig":true,"origNo":30,"q":"治理国家，（ ）是起根本性、全局性、长远性作用的。","options":["方向","路径","制度","目的"],"answer":"C","explain":"制度是起根本性、全局性、长远性作用的，必须坚持和完善中国特色社会主义制度。"},{"id":"c5-o-m1","type":"multi","orig":true,"origNo":1,"q":"全面深化改革的总目标包括（ ）。","options":["完善和发展中国特色社会主义制度","推进国家治理体系和治理能力现代化","建设社会主义现代化强国","实现中华民族伟大复兴"],"answer":"AB","explain":"全面深化改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。C、D项是更宏观的目标而非总目标本身。"},{"id":"c5-o-m2","type":"multi","orig":true,"origNo":2,"q":"全面深化改革必须坚持的正确方向包括（ ）。","options":["坚持社会主义市场经济改革方向","坚持中国特色社会主义政治发展道路","坚持党对改革的集中统一领导","坚持四项基本原则"],"answer":"ABCD","explain":"全面深化改革必须坚持社会主义市场经济改革方向，坚持中国特色社会主义政治发展道路，坚持党对改革的集中统一领导，坚持四项基本原则。"},{"id":"c5-o-m3","type":"multi","orig":true,"origNo":3,"q":"经济体制改革的核心问题是处理好政府和市场的关系，使市场在资源配置中起决定性作用和更好发挥政府作用。这要求（ ）。","options":["政府减少对微观经济活动的干预","政府加强宏观调控","政府主要发挥经济调节、市场监管、社会管理、公共服务、生态环境保护等职能","政府完全退出市场"],"answer":"ABC","explain":"处理好政府和市场关系，要求政府减少对微观经济活动的干预、加强宏观调控、更好发挥自身职能，但政府不能完全退出市场，市场失灵时政府必须补位。"},{"id":"c5-o-m4","type":"multi","orig":true,"origNo":4,"q":"全面深化改革，要处理好（ ）的关系。","options":["解放思想和实事求是","整体推进和重点突破","顶层设计和摸着石头过河","改革发展稳定"],"answer":"ABCD","explain":"全面深化改革要处理好解放思想和实事求是、整体推进和重点突破、顶层设计和摸着石头过河、改革发展稳定等重大关系。"},{"id":"c5-o-m5","type":"multi","orig":true,"origNo":5,"q":"新时代全面深化改革具有哪些鲜明特点（ ）。","options":["全面性","系统性","整体性","协调性"],"answer":"ABC","explain":"新时代全面深化改革呈现全面发力、多点突破、蹄疾步稳、纵深推进的态势，具有全面性、系统性、整体性等特点。"},{"id":"c5-o-m6","type":"multi","orig":true,"origNo":6,"q":"全面深化改革，必须坚持和完善我国社会主义基本经济制度，包括（ ）。","options":["公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","社会主义市场经济体制","政府宏观调控体系"],"answer":"ABC","explain":"社会主义基本经济制度包括公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制。"},{"id":"c5-o-m7","type":"multi","orig":true,"origNo":7,"q":"坚持全面深化改革，必须坚持和加强党的全面领导。这是因为（ ）。","options":["党的领导是中国特色社会主义最本质的特征","党是最高政治领导力量","改革任务越繁重，越要加强和改善党的领导","党的领导是改革开放成功的根本保证"],"answer":"ABCD","explain":"党的领导是中国特色社会主义最本质的特征，党是最高政治领导力量，改革任务越繁重越要加强和改善党的领导，党的领导是改革开放成功的根本保证。"},{"id":"c5-o-m8","type":"multi","orig":true,"origNo":8,"q":"全面深化改革，必须坚持正确处理改革发展稳定关系的方针。其中（ ）。","options":["改革是动力","发展是目的","稳定是前提","稳定是目的"],"answer":"ABC","explain":"正确处理改革发展稳定关系：改革是动力，发展是目的，稳定是前提，把改革的力度、发展的速度和社会可承受的程度统一起来。"},{"id":"c5-o-m9","type":"multi","orig":true,"origNo":9,"q":"我国改革开放的宝贵经验包括（ ）。","options":["必须坚持党对改革的集中统一领导","必须坚持和发展中国特色社会主义","必须坚持以人民为中心","必须坚持摸着石头过河和加强顶层设计相结合"],"answer":"ABCD","explain":"改革开放宝贵经验包括坚持党的集中统一领导、坚持和发展中国特色社会主义、坚持以人民为中心、坚持摸着石头过河和加强顶层设计相结合等。"},{"id":"c5-o-m10","type":"multi","orig":true,"origNo":10,"q":"推动建设开放型世界经济，我国倡导的全球治理观是（ ）。","options":["共商","共建","共享","共赢"],"answer":"ABC","explain":"我国倡导共商共建共享的全球治理观，推动建设开放型世界经济。"},{"id":"c5-o-m11","type":"multi","orig":true,"origNo":11,"q":"全面深化改革，要坚持以（ ）的勇气和决心，坚决破除一切不合时宜的思想观念和体制机制弊端。","options":["自我革命","刮骨疗毒","壮士断腕","循序渐进"],"answer":"ABC","explain":"全面深化改革要以自我革命、刮骨疗毒、壮士断腕的勇气和决心，敢于啃硬骨头、涉险滩。"},{"id":"c5-o-m12","type":"multi","orig":true,"origNo":12,"q":"全面深化改革要敢于啃硬骨头、涉险滩。当前改革进入攻坚期和深水区，面临的矛盾和问题包括（ ）。","options":["发展不平衡不充分问题依然突出","体制机制障碍尚未完全破除","利益固化藩篱需要打破","思想观念的束缚需要突破"],"answer":"ABCD","explain":"改革进入攻坚期和深水区，发展不平衡不充分问题突出，体制机制障碍、利益固化藩篱、思想观念束缚都需要攻坚突破。"},{"id":"c5-o-m13","type":"multi","orig":true,"origNo":13,"q":"全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。以下关于该总目标的理解，正确的有（ ）。","options":["完善和发展中国特色社会主义制度是前提和方向","推进国家治理体系和治理能力现代化是目的和落脚点","两者是统一的整体，不可偏废","国家治理体系和治理能力是一个国家的制度和制度执行能力的集中体现"],"answer":"ABCD","explain":"总目标包含“完善和发展中国特色社会主义制度”与“推进国家治理体系和治理能力现代化”两个层面，前者是前提和方向，后者是目的和落脚点，二者统一不可偏废。"},{"id":"c5-o-m14","type":"multi","orig":true,"origNo":14,"q":"关于全面深化改革，下列表述正确的有（ ）。","options":["全面深化改革是“四个全面”战略布局的重要组成部分","全面深化改革是关系党和国家事业发展全局的重大战略部署","全面深化改革只有进行时，没有完成时","全面深化改革的任务已经完成"],"answer":"ABC","explain":"全面深化改革是“四个全面”战略布局的重要组成部分，是关系党和国家事业发展全局的重大战略部署，只有进行时、没有完成时。D项表述错误。"},{"id":"c5-o-m15","type":"multi","orig":true,"origNo":15,"q":"全面深化改革开放，需要把握哪些正确方向（ ）。","options":["必须坚持和改善党的全面领导","必须坚持以人民为中心","必须坚持有利于进一步解放思想、进一步解放和发展生产力、进一步增强社会活力","必须坚持党的全面领导"],"answer":"ABC","explain":"全面深化改革开放必须坚持和改善党的全面领导，坚持以人民为中心，坚持“三个进一步解放”（进一步解放思想、进一步解放和发展生产力、进一步增强社会活力）。"},{"id":"c5-o-m16","type":"multi","orig":true,"origNo":16,"q":"全面深化改革必须坚持正确的方法论。以下属于全面深化改革方法论的有（ ）。","options":["增强顶层设计和摸着石头过河相结合","统筹改革发展稳定","胆子要大步子要稳","坚持重大改革于法有据"],"answer":"ACD","explain":"全面深化改革方法论包括增强顶层设计和摸着石头过河相结合、胆子要大、步子要稳、坚持重大改革于法有据等（本题按原题答案选A、C、D；统筹改革发展稳定属于正确处理改革发展稳定关系的方针）。"},{"id":"c5-o-m17","type":"multi","orig":true,"origNo":17,"q":"习总书记指出：“这三个进一步解放，既是改革的目的，又是改革的条件”，其中“三个进一步解放”指的是（ ）。","options":["进一步解放思想","进一步对外开放","进一步解放和发展生产力","进一步增强社会活力"],"answer":"ACD","explain":"“三个进一步解放”指进一步解放思想、进一步解放和发展生产力、进一步增强社会活力，既是改革的目的，又是改革的条件。"},{"id":"c5-o-m18","type":"multi","orig":true,"origNo":18,"q":"全面深化改革开放必须坚持正确的方法论。其中，加强顶层设计和摸着石头过河相结合，体现了（ ）。","options":["实践探索与理论指导的统一","渐进式改革与系统性改革的统一","尊重客观规律与发挥主观能动性的统一","局部突破与整体推进的统一"],"answer":"ABCD","explain":"加强顶层设计和摸着石头过河相结合，体现了实践探索与理论指导、渐进式改革与系统性改革、尊重客观规律与发挥主观能动性、局部突破与整体推进的统一。"},{"id":"c5-o-m19","type":"multi","orig":true,"origNo":19,"q":"新时代全面深化改革，必须坚持以人民为中心。这是因为（ ）。","options":["人民是历史的创造者，是改革开放的主体","全面深化改革的出发点和落脚点是促进社会公平正义、增进人民福祉","改革成效最终要由人民来评判","必须尊重人民首创精神，鼓励基层探索"],"answer":"ABCD","explain":"坚持以人民为中心，是因为人民是历史的创造者、是改革开放的主体，改革出发点和落脚点是促进公平正义、增进人民福祉，改革成效由人民评判，必须尊重人民首创精神。"},{"id":"c5-o-m20","type":"multi","orig":true,"origNo":20,"q":"国家治理能力是运用国家制度管理社会各方面事务的能力，包括（ ）等各个方面。","options":["改革发展稳定","内政外交国防","治党治国治军","经济发展与社会治理"],"answer":"ABC","explain":"国家治理能力包括改革发展稳定、内政外交国防、治党治国治军等各个方面，是制度执行能力的集中体现。"},{"id":"c5-a-s1","type":"single","orig":false,"origNo":null,"q":"党的二十届三中全会审议通过的《中共中央关于进一步全面深化改革、推进中国式现代化的决定》指出，进一步全面深化改革的总目标是（ ）。","options":["继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化","全面建成社会主义现代化强国","实现中华民族伟大复兴","建成高水平社会主义市场经济体制"],"answer":"A","explain":"进一步全面深化改革的总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。到2035年全面建成高水平社会主义市场经济体制，到本世纪中叶全面建成社会主义现代化强国。"},{"id":"c5-a-s2","type":"single","orig":false,"origNo":null,"q":"进一步全面深化改革，必须以（ ）为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点。","options":["经济体制改革","政治体制改革","文化体制改革","生态文明体制改革"],"answer":"A","explain":"《决定》强调，以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点。"},{"id":"c5-a-s3","type":"single","orig":false,"origNo":null,"q":"开放是中国式现代化的（ ）。","options":["鲜明标识","根本保证","内在要求","基本前提"],"answer":"A","explain":"党的二十届三中全会提出，开放是中国式现代化的鲜明标识，必须坚持对外开放基本国策，以开放促改革。"},{"id":"c5-a-s4","type":"single","orig":false,"origNo":null,"q":"法治是中国式现代化的（ ）。","options":["重要保障","根本目标","动力源泉","制度基础"],"answer":"A","explain":"党的二十届三中全会提出，法治是中国式现代化的重要保障，必须全面贯彻实施宪法，协同推进立法、执法、司法、守法各环节改革。"},{"id":"c5-a-s5","type":"single","orig":false,"origNo":null,"q":"国家安全是中国式现代化行稳致远的（ ）。","options":["重要基础","根本前提","战略支撑","制度保障"],"answer":"A","explain":"党的二十届三中全会提出，国家安全是中国式现代化行稳致远的必由之路的重要基础，必须全面贯彻总体国家安全观。"},{"id":"c5-a-s6","type":"single","orig":false,"origNo":null,"q":"发展全过程人民民主是中国式现代化的（ ）。","options":["本质要求","重要保障","鲜明标识","根本动力"],"answer":"A","explain":"党的二十届三中全会提出，发展全过程人民民主是中国式现代化的本质要求。"},{"id":"c5-a-s7","type":"single","orig":false,"origNo":null,"q":"在发展中保障和改善民生是中国式现代化的（ ）。","options":["重大任务","根本目标","首要前提","物质基础"],"answer":"A","explain":"党的二十届三中全会提出，在发展中保障和改善民生是中国式现代化的重大任务，必须坚持尽力而为、量力而行。"},{"id":"c5-a-s8","type":"single","orig":false,"origNo":null,"q":"党的领导是进一步全面深化改革、推进中国式现代化的（ ）。","options":["根本保证","基本要求","重要条件","制度保障"],"answer":"A","explain":"党的二十届三中全会强调，党的领导是进一步全面深化改革、推进中国式现代化的根本保证。"},{"id":"c5-a-s9","type":"single","orig":false,"origNo":null,"q":"构建高水平社会主义市场经济体制，要求既“放得活”又“管得住”，更好维护市场秩序、弥补（ ）。","options":["市场失灵","政府缺位","制度漏洞","监管空白"],"answer":"A","explain":"《决定》提出，更好发挥市场机制作用，实现资源配置效率最优化和效益最大化，既“放得活”又“管得住”，更好维护市场秩序、弥补市场失灵。"},{"id":"c5-a-s10","type":"single","orig":false,"origNo":null,"q":"国防和军队现代化是中国式现代化的（ ）。","options":["重要组成部分","根本保证","战略支撑","基础条件"],"answer":"A","explain":"党的二十届三中全会提出，国防和军队现代化是中国式现代化的重要组成部分，必须坚持党对人民军队的绝对领导。"},{"id":"c5-a-m1","type":"multi","orig":false,"origNo":null,"q":"进一步全面深化改革，必须贯彻的原则包括（ ）。","options":["坚持党的全面领导","坚持以人民为中心，坚持守正创新","坚持以制度建设为主线","坚持全面依法治国，坚持系统观念"],"answer":"ABCD","explain":"进一步全面深化改革必须贯彻“六个坚持”原则：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。"},{"id":"c5-a-m2","type":"multi","orig":false,"origNo":null,"q":"《中共中央关于进一步全面深化改革、推进中国式现代化的决定》提出的“七个聚焦”包括（ ）。","options":["聚焦构建高水平社会主义市场经济体制，聚焦发展全过程人民民主","聚焦建设社会主义文化强国，聚焦提高人民生活品质","聚焦建设美丽中国，聚焦建设更高水平平安中国","聚焦提高党的领导水平和长期执政能力"],"answer":"ABCD","explain":"“七个聚焦”覆盖经济、政治、文化、民生、生态、安全、党建七大领域，是进一步全面深化改革的主攻方向。"},{"id":"c5-a-m3","type":"multi","orig":false,"origNo":null,"q":"《决定》强调，要毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济（ ）。","options":["依法平等使用生产要素","公平参与市场竞争","同等受到法律保护","优势互补、共同发展"],"answer":"ABCD","explain":"《决定》提出“两个毫不动摇”，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进优势互补、共同发展。"},{"id":"c5-a-m4","type":"multi","orig":false,"origNo":null,"q":"党的二十届三中全会强调，进一步全面深化改革要统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局，坚持（ ）。","options":["解放思想、实事求是、与时俱进、求真务实","进一步解放和发展社会生产力、激发和增强社会活力","以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点","更加注重系统集成、更加注重突出重点、更加注重改革实效"],"answer":"ABCD","explain":"《决定》明确了进一步全面深化改革的指导思想、工作基调、总体思路和方法要求，以上各项均为其重要内容。"},{"id":"c5-a-m5","type":"multi","orig":false,"origNo":null,"q":"关于进一步全面深化改革的战略目标，下列说法正确的有（ ）。","options":["到2029年中华人民共和国成立八十周年时，完成《决定》提出的改革任务","到2035年，全面建成高水平社会主义市场经济体制","到本世纪中叶，全面建成社会主义现代化强国","到2035年基本实现社会主义现代化"],"answer":"ABCD","explain":"进一步全面深化改革分阶段推进：到2029年完成《决定》提出的改革任务；到2035年全面建成高水平社会主义市场经济体制，基本实现社会主义现代化；到本世纪中叶全面建成社会主义现代化强国。"},{"id":"c5-a-f1","type":"fill","orig":false,"origNo":null,"q":"党的二十届三中全会于____年7月在北京举行，审议通过了《中共中央关于____的决定》。","options":[],"answer":["2024；进一步全面深化改革、推进中国式现代化"],"explain":"二十届三中全会于2024年7月15日至18日在北京举行。"},{"id":"c5-a-f2","type":"fill","orig":false,"origNo":null,"q":"进一步全面深化改革的总目标是继续完善和发展____制度，推进____现代化。","options":[],"answer":["中国特色社会主义；国家治理体系和治理能力"],"explain":"进一步全面深化改革总目标。"},{"id":"c5-a-f3","type":"fill","orig":false,"origNo":null,"q":"进一步全面深化改革以____为牵引，以促进社会公平正义、____为出发点和落脚点。","options":[],"answer":["经济体制改革；增进人民福祉"],"explain":"《决定》明确的改革牵引和出发落脚点。"},{"id":"c5-a-f4","type":"fill","orig":false,"origNo":null,"q":"进一步全面深化改革必须贯彻“六个坚持”原则：坚持____、坚持以人民为中心、坚持____、坚持以制度建设为主线、坚持____、坚持系统观念。","options":[],"answer":["党的全面领导；守正创新；全面依法治国"],"explain":"“六个坚持”原则。"},{"id":"c5-a-f5","type":"fill","orig":false,"origNo":null,"q":"开放是中国式现代化的____，法治是中国式现代化的____，国家安全是中国式现代化行稳致远的____，党的领导是进一步全面深化改革、推进中国式现代化的____。","options":[],"answer":["鲜明标识；重要保障；重要基础；根本保证"],"explain":"二十届三中全会对各要素的定位。"},{"id":"c5-a-f6","type":"fill","orig":false,"origNo":null,"q":"发展全过程人民民主是中国式现代化的____；在发展中保障和改善民生是中国式现代化的____；国防和军队现代化是中国式现代化的____。","options":[],"answer":["本质要求；重大任务；重要组成部分"],"explain":"二十届三中全会重要论断。"}]},{"id":"z1","title":"专题一 党的二十大新观点新论断新思想","note":"本专题题目依据《二十大新观点新论断新思想》PPT 编写。","questions":[{"id":"z1-s1","type":"single","orig":false,"origNo":1,"q":"党的二十大报告指出，中国共产党已走过百年奋斗历程，全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必（ ）。","options":["敢于斗争、善于斗争","自力更生、发愤图强","解放思想、实事求是","与时俱进、求真务实"],"answer":"A","explain":"党的二十大报告提出“三个务必”：务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。"},{"id":"z1-s2","type":"single","orig":false,"origNo":2,"q":"经过不懈努力，党找到了跳出治乱兴衰历史周期率的第二个答案，这就是（ ）。","options":["自我革命","民主监督","全面从严治党","群众路线"],"answer":"A","explain":"党的二十大报告指出，党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。"},{"id":"z1-s3","type":"single","orig":false,"origNo":3,"q":"党的二十大报告指出，中国共产党为什么能，中国特色社会主义为什么好，归根到底是（ ）。","options":["马克思主义行，是中国化时代化的马克思主义行","中国共产党领导好","社会主义制度好","中国人民团结奋斗"],"answer":"A","explain":"归根到底是马克思主义行，是中国化时代化的马克思主义行。拥有马克思主义科学理论指导是我们党坚定信仰信念、把握历史主动的根本所在。"},{"id":"z1-s4","type":"single","orig":false,"origNo":4,"q":"党的二十大报告指出，从现在起，中国共产党的中心任务是（ ）。","options":["团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴","全面建成小康社会","基本实现社会主义现代化","实现全体人民共同富裕"],"answer":"A","explain":"从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"id":"z1-s5","type":"single","orig":false,"origNo":5,"q":"全面建设社会主义现代化国家的首要任务是（ ）。","options":["高质量发展","创新驱动发展","乡村振兴","共同富裕"],"answer":"A","explain":"高质量发展是全面建设社会主义现代化国家的首要任务，发展是党执政兴国的第一要务。"},{"id":"z1-s6","type":"single","orig":false,"origNo":6,"q":"人民民主是社会主义的生命，是全面建设社会主义现代化国家的（ ）。","options":["应有之义","本质要求","内在要求","根本保证"],"answer":"A","explain":"人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义；全过程人民民主是社会主义民主政治的本质属性。"},{"id":"z1-s7","type":"single","orig":false,"origNo":7,"q":"全过程人民民主是社会主义民主政治的本质属性，是（ ）的民主。","options":["最广泛、最真实、最管用","最直接、最全面、最有效","最彻底、最完备、最科学","最民主、最自由、最公正"],"answer":"A","explain":"全过程人民民主是最广泛、最真实、最管用的民主，是社会主义民主政治的本质属性。"},{"id":"z1-s8","type":"single","orig":false,"origNo":8,"q":"为民造福是立党为公、执政为民的（ ）。","options":["本质要求","根本宗旨","核心价值","最高追求"],"answer":"A","explain":"江山就是人民，人民就是江山。为民造福是立党为公、执政为民的本质要求。"},{"id":"z1-s9","type":"single","orig":false,"origNo":9,"q":"尊重自然、顺应自然、保护自然，是全面建设社会主义现代化国家的（ ）。","options":["内在要求","基本方略","重要保障","战略支撑"],"answer":"A","explain":"必须牢固树立和践行绿水青山就是金山银山的理念，站在人与自然和谐共生的高度谋划发展，尊重自然、顺应自然、保护自然是全面建设社会主义现代化国家的内在要求。"},{"id":"z1-s10","type":"single","orig":false,"origNo":10,"q":"国家安全是民族复兴的（ ），社会稳定是国家强盛的（ ）。","options":["根基；前提","基础；保障","保障；根基","前提；基础"],"answer":"A","explain":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提。必须坚定不移贯彻总体国家安全观。"},{"id":"z1-s11","type":"single","orig":false,"origNo":11,"q":"如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的（ ）。","options":["战略要求","根本任务","重要保障","基础工程"],"answer":"A","explain":"如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。"},{"id":"z1-s12","type":"single","orig":false,"origNo":12,"q":"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的（ ）。","options":["最佳制度安排","唯一制度安排","基本制度安排","临时制度安排"],"answer":"A","explain":"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排，必须长期坚持。"},{"id":"z1-s13","type":"single","orig":false,"origNo":13,"q":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在（ ）。","options":["党","人民","法治","科技"],"answer":"A","explain":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党，必须深入推进新时代党的建设新的伟大工程。"},{"id":"z1-s14","type":"single","orig":false,"origNo":14,"q":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；团结奋斗是中国人民创造历史伟业的必由之路；贯彻新发展理念是新时代我国发展壮大的必由之路；（ ）是党永葆生机活力、走好新的赶考之路的必由之路。","options":["全面从严治党","全面依法治国","全面深化改革","全过程人民民主"],"answer":"A","explain":"五个“必由之路”之一：全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。"},{"id":"z1-s15","type":"single","orig":false,"origNo":15,"q":"科技是第一生产力、人才是第一资源、（ ）是第一动力。","options":["创新","改革","教育","开放"],"answer":"A","explain":"党的二十大报告强调，必须坚持科技是第一生产力、人才是第一资源、创新是第一动力，深入实施科教兴国战略、人才强国战略、创新驱动发展战略。"},{"id":"z1-m1","type":"multi","orig":false,"origNo":1,"q":"党的二十大报告提出的“三个务必”包括（ ）。","options":["务必不忘初心、牢记使命","务必谦虚谨慎、艰苦奋斗","务必敢于斗争、善于斗争","务必自信自强、守正创新"],"answer":"ABC","explain":"“三个务必”即务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。"},{"id":"z1-m2","type":"multi","orig":false,"origNo":2,"q":"十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事，包括（ ）。","options":["迎来中国共产党成立一百周年","中国特色社会主义进入新时代","完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标","基本实现社会主义现代化"],"answer":"ABC","explain":"三件大事：迎来中国共产党成立一百周年；中国特色社会主义进入新时代；完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。"},{"id":"z1-m3","type":"multi","orig":false,"origNo":3,"q":"党的二十大报告指出，前进道路上必须牢牢把握的重大原则包括（ ）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放、坚持发扬斗争精神"],"answer":"ABCD","explain":"五项重大原则即坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。"},{"id":"z1-m4","type":"multi","orig":false,"origNo":4,"q":"党的二十大报告强调的五个“必由之路”包括（ ）。","options":["坚持党的全面领导是坚持和发展中国特色社会主义的必由之路","中国特色社会主义是实现中华民族伟大复兴的必由之路，团结奋斗是中国人民创造历史伟业的必由之路","贯彻新发展理念是新时代我国发展壮大的必由之路","全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路"],"answer":"ABCD","explain":"五个“必由之路”是我们在长期实践中得出的至关紧要的规律性认识，必须倍加珍惜、始终坚持。"},{"id":"z1-m5","type":"multi","orig":false,"origNo":5,"q":"全面建设社会主义现代化国家的基础性、战略性支撑是（ ）。","options":["教育","科技","人才","法治"],"answer":"ABC","explain":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑，必须坚持科技是第一生产力、人才是第一资源、创新是第一动力。"},{"id":"z1-m6","type":"multi","orig":false,"origNo":6,"q":"党的二十大报告指出，必须坚持中国特色社会主义文化发展道路，围绕（ ）建设社会主义文化强国。","options":["举旗帜","聚民心、育新人","兴文化","展形象"],"answer":"ABCD","explain":"围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国，激发全民族文化创新创造活力。"},{"id":"z1-f1","type":"fill","orig":false,"origNo":1,"q":"党的二十大报告提出“三个务必”：务必____、牢记使命，务必谦虚谨慎、____，务必敢于斗争、善于斗争。","options":[],"answer":["不忘初心；艰苦奋斗"],"explain":"“三个务必”。"},{"id":"z1-f2","type":"fill","orig":false,"origNo":2,"q":"党找到了____这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、____。","options":[],"answer":["自我革命；不变味"],"explain":"自我革命是跳出历史周期率的第二个答案。"},{"id":"z1-f3","type":"fill","orig":false,"origNo":3,"q":"从现在起，中国共产党的中心任务是团结带领全国各族人民全面建成____强国、实现____奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","options":[],"answer":["社会主义现代化；第二个百年"],"explain":"党的中心任务。"},{"id":"z1-f4","type":"fill","orig":false,"origNo":4,"q":"高质量发展是全面建设社会主义现代化国家的____任务。","options":[],"answer":["首要"],"explain":"高质量发展是首要任务。"},{"id":"z1-f5","type":"fill","orig":false,"origNo":5,"q":"____是社会主义民主政治的本质属性，是____、最真实、最管用的民主。","options":[],"answer":["全过程人民民主；最广泛"],"explain":"全过程人民民主。"},{"id":"z1-f6","type":"fill","orig":false,"origNo":6,"q":"国家安全是民族复兴的____，社会稳定是国家强盛的____。","options":[],"answer":["根基；前提"],"explain":"国家安全与社会稳定的定位。"},{"id":"z1-f7","type":"fill","orig":false,"origNo":7,"q":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在____。","options":[],"answer":["党"],"explain":"关键在党。"},{"id":"z1-f8","type":"fill","orig":false,"origNo":8,"q":"五个“必由之路”：坚持____是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；____是中国人民创造历史伟业的必由之路；贯彻____是新时代我国发展壮大的必由之路；全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","options":[],"answer":["党的全面领导；团结奋斗；新发展理念"],"explain":"五个“必由之路”。"}]},{"id":"z2","title":"专题二 党的二十届三中全会精神","note":"本专题题目依据《党的二十届三中全会公报要点学习》PPT 编写。","questions":[{"id":"z2-s1","type":"single","orig":false,"origNo":1,"q":"中国共产党第二十届中央委员会第三次全体会议于（ ）在北京举行。","options":["2024年7月15日至18日","2023年10月15日至18日","2025年7月15日至18日","2024年10月15日至18日"],"answer":"A","explain":"党的二十届三中全会于2024年7月15日至18日在北京举行。"},{"id":"z2-s2","type":"single","orig":false,"origNo":2,"q":"党的二十届三中全会审议通过了（ ）。","options":["《中共中央关于进一步全面深化改革、推进中国式现代化的决定》","《中共中央关于坚持和完善中国特色社会主义制度的决定》","《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","《中共中央关于全面推进依法治国若干重大问题的决定》"],"answer":"A","explain":"全会审议通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。"},{"id":"z2-s3","type":"single","orig":false,"origNo":3,"q":"全会认为，当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的（ ）。","options":["关键时期","起步阶段","攻坚阶段","决胜阶段"],"answer":"A","explain":"全会认为，当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。"},{"id":"z2-s4","type":"single","orig":false,"origNo":4,"q":"中国式现代化是在（ ）中不断推进的，也必将在（ ）中开辟广阔前景。","options":["改革开放；改革开放","实践探索；实践探索","自我革命；自我革命","创新驱动；创新驱动"],"answer":"A","explain":"中国式现代化是在改革开放中不断推进的，也必将在改革开放中开辟广阔前景。必须自觉把改革摆在更加突出位置。"},{"id":"z2-s5","type":"single","orig":false,"origNo":5,"q":"进一步全面深化改革，必须以（ ）为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点。","options":["经济体制改革","政治体制改革","文化体制改革","生态文明体制改革"],"answer":"A","explain":"全会强调，以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点，为中国式现代化提供强大动力和制度保障。"},{"id":"z2-s6","type":"single","orig":false,"origNo":6,"q":"全会提出，必须更好发挥市场机制作用，实现资源配置效率最优化和效益最大化，既“放得活”又“（ ）”。","options":["管得住","管得严","放得开","控得住"],"answer":"A","explain":"既“放得活”又“管得住”，更好维护市场秩序、弥补市场失灵，畅通国民经济循环。"},{"id":"z2-s7","type":"single","orig":false,"origNo":7,"q":"全会提出，必须以（ ）引领改革，立足新发展阶段，深化供给侧结构性改革。","options":["新发展理念","高质量发展","新质生产力","科技创新"],"answer":"A","explain":"必须以新发展理念引领改革，健全因地制宜发展新质生产力体制机制。"},{"id":"z2-s8","type":"single","orig":false,"origNo":8,"q":"全会提出，开放是中国式现代化的（ ）。","options":["鲜明标识","根本保证","本质要求","重要基础"],"answer":"A","explain":"开放是中国式现代化的鲜明标识，必须坚持对外开放基本国策，坚持以开放促改革。"},{"id":"z2-s9","type":"single","orig":false,"origNo":9,"q":"全会提出，发展全过程人民民主是中国式现代化的（ ）。","options":["本质要求","重要保障","鲜明标识","战略支撑"],"answer":"A","explain":"发展全过程人民民主是中国式现代化的本质要求，必须加强人民当家作主制度建设。"},{"id":"z2-s10","type":"single","orig":false,"origNo":10,"q":"全会提出，法治是中国式现代化的（ ）。","options":["重要保障","根本要求","内在动力","制度基础"],"answer":"A","explain":"法治是中国式现代化的重要保障，必须全面贯彻实施宪法，协同推进立法、执法、司法、守法各环节改革。"},{"id":"z2-s11","type":"single","orig":false,"origNo":11,"q":"全会提出，在发展中保障和改善民生是中国式现代化的（ ）。","options":["重大任务","根本目标","首要前提","基本要求"],"answer":"A","explain":"在发展中保障和改善民生是中国式现代化的重大任务，必须坚持尽力而为、量力而行。"},{"id":"z2-s12","type":"single","orig":false,"origNo":12,"q":"全会提出，国家安全是中国式现代化行稳致远的（ ）。","options":["重要基础","根本保障","战略前提","核心支撑"],"answer":"A","explain":"国家安全是中国式现代化行稳致远的重要基础，必须全面贯彻总体国家安全观。"},{"id":"z2-s13","type":"single","orig":false,"origNo":13,"q":"全会提出，国防和军队现代化是中国式现代化的（ ）。","options":["重要组成部分","根本保证","战略要求","基础条件"],"answer":"A","explain":"国防和军队现代化是中国式现代化的重要组成部分，必须坚持党对人民军队的绝对领导。"},{"id":"z2-s14","type":"single","orig":false,"origNo":14,"q":"全会强调，（ ）是进一步全面深化改革、推进中国式现代化的根本保证。","options":["党的领导","人民民主","依法治国","制度完善"],"answer":"A","explain":"党的领导是进一步全面深化改革、推进中国式现代化的根本保证，必须深刻领悟“两个确立”的决定性意义。"},{"id":"z2-s15","type":"single","orig":false,"origNo":15,"q":"全会提出，中国式现代化是走和平发展道路的现代化，必须坚定奉行独立自主的和平外交政策，推动构建（ ）。","options":["人类命运共同体","新型国际关系","开放型世界经济","全球治理体系"],"answer":"A","explain":"必须坚定奉行独立自主的和平外交政策，推动构建人类命运共同体，践行全人类共同价值，落实全球发展倡议、全球安全倡议、全球文明倡议。"},{"id":"z2-m1","type":"multi","orig":false,"origNo":1,"q":"进一步全面深化改革，必须贯彻的原则包括（ ）。","options":["坚持党的全面领导","坚持以人民为中心，坚持守正创新","坚持以制度建设为主线","坚持全面依法治国，坚持系统观念"],"answer":"ABCD","explain":"进一步全面深化改革必须贯彻“六个坚持”原则：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。"},{"id":"z2-m2","type":"multi","orig":false,"origNo":2,"q":"全会提出，要毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济（ ）。","options":["依法平等使用生产要素","公平参与市场竞争","同等受到法律保护","优势互补、共同发展"],"answer":"ABCD","explain":"“两个毫不动摇”是构建高水平社会主义市场经济体制的重要要求。"},{"id":"z2-m3","type":"multi","orig":false,"origNo":3,"q":"全会提出，要构建全国统一大市场，完善市场经济基础制度，包括（ ）等改革部署。","options":["健全因地制宜发展新质生产力体制机制","健全促进实体经济和数字经济深度融合制度","健全提升产业链供应链韧性和安全水平制度","完善实施区域协调发展战略机制"],"answer":"ABCD","explain":"《决定》围绕构建高水平社会主义市场经济体制、推动高质量发展作出一系列体制机制改革部署。"},{"id":"z2-m4","type":"multi","orig":false,"origNo":4,"q":"全会提出，要统筹推进教育科技人才体制机制一体改革，包括（ ）。","options":["深化教育综合改革","深化科技体制改革","深化人才发展体制机制改革","健全新型举国体制，提升国家创新体系整体效能"],"answer":"ABCD","explain":"必须深入实施科教兴国战略、人才强国战略、创新驱动发展战略，统筹推进教育科技人才体制机制一体改革。"},{"id":"z2-m5","type":"multi","orig":false,"origNo":5,"q":"全会强调，学习好贯彻好全会精神，要深刻领会和把握进一步全面深化改革的（ ）。","options":["主题","重大原则","重大举措","根本保证"],"answer":"ABCD","explain":"要深刻领会和把握进一步全面深化改革的主题、重大原则、重大举措、根本保证，把改革战略部署转化为推进中国式现代化的强大力量。"},{"id":"z2-m6","type":"multi","orig":false,"origNo":6,"q":"全会强调，必须坚持党中央对进一步全面深化改革的集中统一领导，深化党的建设制度改革，深入推进党风廉政建设和反腐败斗争，以钉钉子精神抓好改革落实，不断推进党的（ ）。","options":["自我净化","自我完善","自我革新","自我提高"],"answer":"ABCD","explain":"坚持用改革精神和严的标准管党治党，完善党的自我革命制度规范体系，不断推进党的自我净化、自我完善、自我革新、自我提高。"},{"id":"z2-f1","type":"fill","orig":false,"origNo":1,"q":"党的二十届三中全会于____年7月15日至18日在北京举行，审议通过了《中共中央关于____的决定》。","options":[],"answer":["2024；进一步全面深化改革、推进中国式现代化"],"explain":"二十届三中全会基本情况。"},{"id":"z2-f2","type":"fill","orig":false,"origNo":2,"q":"进一步全面深化改革的总目标是继续完善和发展____制度，推进____现代化。","options":[],"answer":["中国特色社会主义；国家治理体系和治理能力"],"explain":"进一步全面深化改革总目标。"},{"id":"z2-f3","type":"fill","orig":false,"origNo":3,"q":"进一步全面深化改革以____为牵引，以促进社会公平正义、____为出发点和落脚点。","options":[],"answer":["经济体制改革；增进人民福祉"],"explain":"《决定》总体思路。"},{"id":"z2-f4","type":"fill","orig":false,"origNo":4,"q":"全会提出，开放是中国式现代化的____，法治是中国式现代化的____，国家安全是中国式现代化行稳致远的____，党的领导是进一步全面深化改革、推进中国式现代化的____。","options":[],"answer":["鲜明标识；重要保障；重要基础；根本保证"],"explain":"二十届三中全会重要论断。"},{"id":"z2-f5","type":"fill","orig":false,"origNo":5,"q":"全会提出，发展全过程人民民主是中国式现代化的____，在发展中保障和改善民生是中国式现代化的____，国防和军队现代化是中国式现代化的____。","options":[],"answer":["本质要求；重大任务；重要组成部分"],"explain":"二十届三中全会重要论断。"},{"id":"z2-f6","type":"fill","orig":false,"origNo":6,"q":"进一步全面深化改革必须贯彻的“六个坚持”原则：坚持党的全面领导、坚持以人民为中心、坚持____、坚持以制度建设为主线、坚持全面依法治国、坚持____。","options":[],"answer":["守正创新；系统观念"],"explain":"“六个坚持”原则。"},{"id":"z2-f7","type":"fill","orig":false,"origNo":7,"q":"《决定》提出“七个聚焦”：聚焦构建____市场经济体制、聚焦发展____、聚焦建设社会主义文化强国、聚焦提高人民生活品质、聚焦建设美丽中国、聚焦建设更高水平____、聚焦提高党的领导水平和长期执政能力。","options":[],"answer":["高水平社会主义；全过程人民民主；平安中国"],"explain":"“七个聚焦”。"}]}]};
const OUTLINE = [{"title":"第一章 新时代坚持和发展中国特色社会主义","groups":[["一、新时代的历史方位",["中国特色社会主义进入新时代，这是我国发展新的历史方位。","“三个意味着”：意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；意味着科学社会主义在二十一世纪的中国焕发出强大生机活力；意味着中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案。"]],["二、社会主要矛盾（变与不变）",["新时代我国社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾（党的十九大论断）。","“两个没有变”：我国仍处于并将长期处于社会主义初级阶段的基本国情没有变；我国是世界最大发展中国家的国际地位没有变。","主要矛盾变化是关系全局的历史性变化，但属于初级阶段内部的阶段性变化。"]],["三、总任务与总依据",["总任务：实现社会主义现代化和中华民族伟大复兴。","总依据：社会主义初级阶段。","总布局：统筹推进“五位一体”总体布局。","战略布局：协调推进“四个全面”战略布局（全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党）。"]],["四、党的基本路线",["核心内容“一个中心、两个基本点”：以经济建设为中心，坚持四项基本原则（立国之本）、坚持改革开放（强国之路）。","基本路线是党和国家的生命线、人民的幸福线；奋斗目标是把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。"]],["五、科学体系“四个层次”",["“十个明确”：核心内容，回答坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题。","“十四个坚持”：基本方略。","“十三个方面成就”：实践成果。","“六个必须坚持”：世界观和方法论（人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下）。","“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。"]],["六、政治要求",["“两个确立”：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。","“两个维护”：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","“四个意识”：政治意识、大局意识、核心意识、看齐意识。","“四个自信”：道路自信、理论自信、制度自信、文化自信。"]],["七、记忆口诀",["一个中心、两个基本点，基本路线生命线；五位一体总布局（经济根本、政治保证、文化灵魂、社会条件、生态基础）；四个全面施工图（目标、动力、保障、保证）；两个确立护核心，两个维护不动摇。"]]]},{"title":"第二章 以中国式现代化全面推进中华民族伟大复兴","groups":[["一、中国梦",["本质：国家富强、民族振兴、人民幸福。","实现路径：走中国道路（中国特色社会主义道路）、弘扬中国精神（民族精神＋时代精神）、凝聚中国力量。","中国梦是国家的梦、民族的梦，也是每一个中国人的梦；归根到底是人民的梦。"]],["二、“两步走”战略安排",["到 2035 年：基本实现社会主义现代化。","到本世纪中叶：建成富强民主文明和谐美丽的社会主义现代化强国。","全面建成小康社会实现第一个百年奋斗目标后，开启全面建设社会主义现代化国家新征程（从解决“有没有”转向解决“好不好”）。"]],["三、中国式现代化",["定性：中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。","五个特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。","本质要求（九条）：坚持中国共产党领导、坚持中国特色社会主义、实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生、推动构建人类命运共同体、创造人类文明新形态。","首要任务：高质量发展。","发展过程：“并联式”（四化叠加）而非“串联式”。"]],["四、推进中国式现代化的保障",["五个重大原则：坚持和加强党的全面领导（首位）、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","六对重大关系：顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放。","创造人类文明新形态：五大文明协调发展，打破“现代化＝西方化”迷思，为发展中国家提供全新选择。"]],["五、“四个伟大”",["伟大梦想（目标）、伟大斗争（手段）、伟大事业（路径）、伟大工程（保证，起决定性作用，指党的建设新的伟大工程）。"]],["六、记忆口诀",["中国梦三本质（国家富强、民族振兴、人民幸福）；两步走到 2035 基本现代化、本世纪中叶成强国；五特九要六关系；并联式发展提质量。"]]]},{"title":"第三章 习近平党建思想","groups":[["一、时代课题与总要求、总目标",["时代课题：建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","总要求：“5＋2”总体布局——政治、思想、组织、作风、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争；核心是提高党的建设质量。","总目标：始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。"]],["二、党的建设各项建设定位",["根本原则：坚持和加强党的全面领导。","政治建设是根本性建设（统领，决定方向和效果）；全面从严治党首先要从政治上看。","思想建设是基础性建设；首要任务：坚定理想信念（共产党人精神上的“钙”）。","组织路线重点：以组织体系建设为重点，培养忠诚干净担当的高素质干部队伍。","作风建设核心问题：保持党同人民群众的血肉联系；反对“四风”（形式主义、官僚主义、享乐主义、奢靡之风）。","纪律建设：政治纪律是最根本、最重要的纪律；重点强化政治纪律和组织纪律。","党章是党的根本大法；抓住领导干部这个“关键少数”。"]],["三、全面从严治党",["核心：加强党的领导；基础在全面，关键在严，要害在治。","“真管真严、敢管敢严、长管长严”。","反腐败：坚持无禁区、全覆盖、零容忍；重遏制、强高压、长震慑；一体推进不敢腐、不能腐、不想腐。"]],["四、风险考验与自我革命",["“四大考验”：执政考验、改革开放考验、市场经济考验、外部环境考验。","“四种危险”：精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险。","跳出历史周期率的两个答案：第一个（毛泽东）——“让人民来监督政府”；第二个（新时代）——自我革命，确保党永远不变质、不变色、不变味。","全面从严治党永远在路上，党的自我革命永远在路上；以党的自我革命引领社会革命。"]],["五、记忆口诀",["党建 5＋2，政治是统领、思想是基础、作风连群众、纪律守政治；四个意识四个自信两个维护；四大考验四种危险要牢记；第二个答案叫自我革命。"]]]},{"title":"第四章 坚持以人民为中心","groups":[["一、人民的历史地位与根本立场",["人民是历史的创造者，是决定党和国家前途命运的根本力量；人民立场是中国共产党的根本政治立场，是马克思主义政党区别于其他政党的显著标志。","为什么人的问题，是检验一个政党、一个政权性质的试金石。","党的一切工作必须以最广大人民根本利益为最高标准；人民是党的工作的最高裁决者和最终评判者（“人民是阅卷人”）。"]],["二、坚持人民主体地位",["人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。","全过程人民民主是社会主义民主政治的本质属性，涵盖民主选举、民主协商、民主决策、民主管理、民主监督五大环节。","“江山就是人民，人民就是江山”：党与人民生死与共、休戚与共，党的执政基础在人民。"]],["三、以人民为中心的发展思想",["发展为了人民（目的）、发展依靠人民（动力）、发展成果由人民共享（归宿），“三个发展”有机统一。","首先要回答“发展为了谁、依靠谁、成果由谁共享”这一根本问题；衡量发展成效的最终标准是人民生活是否改善。","“我将无我，不负人民”体现全心全意为人民服务的根本宗旨；保障和改善民生坚持尽力而为、量力而行。","建设平安中国是坚持以人民为中心在国家安全领域的生动体现；“人民至上、生命至上”是其价值追求。"]],["四、共同富裕",["共同富裕是中国特色社会主义的本质要求，是物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义（不是同步富裕、同等富裕）。","推进共同富裕要处理好效率与公平、先富与共富、物质富裕与精神富足、城市与乡村等重大关系。","从“脱贫攻坚”到“乡村振兴”的战略衔接，体现党始终把解决好“三农”问题作为全党工作重中之重。"]],["五、群众路线",["群众路线是党的生命线和根本工作路线：一切为了群众、一切依靠群众，从群众中来、到群众中去。","走好新时代群众路线：深入基层调查研究，运用网络了解民意，畅通群众诉求表达渠道，解决群众急难愁盼问题。","尊重人民首创精神：鼓励基层大胆探索、先行先试，及时总结推广群众创造的鲜活经验，把顶层设计与问计于民统一起来。"]],["六、社会主要矛盾与高质量发展",["新时代我国社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；从“物质文化需要”到“美好生活需要”，反映需求层次跃升和党对人民需求认识的深化。","以人民为中心要求推动高质量发展中更加注重共同富裕，促进人与自然和谐共生，实现人的全面发展。"]],["七、记忆口诀",["人民立场是根本，试金石上看为谁；人民主体不动摇，人大制度是根基。","发展三问（为了谁、依靠谁、共享谁），成果人民来评判；共同富裕非平均，物质精神都要富。","群众路线是生命，一切为了依靠群众，从群众中来、到群众中去；人民至上记心间，江山就是人民、人民就是江山。"]]]},{"title":"第五章 全面深化改革开放","groups":[["一、改革开放的地位",["关键一招：改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。","性质：社会主义制度的自我完善和发展；是中国的第二次革命，不是暴力革命。","鲜明特征和首要任务：解放和发展社会生产力。"]],["二、全面深化改革总目标",["总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","两个层面：前者是前提和方向，后者是目的和落脚点（核心是制度现代化）。","国家治理体系：党领导下管理国家的制度体系；国家治理能力：运用国家制度管理社会各方面事务的能力（改革发展稳定、内政外交国防、治党治国治军）。"]],["三、重点与核心问题",["重点：经济体制改革。","核心问题：处理好政府和市场的关系——市场在资源配置中起决定性作用，更好发挥政府作用。","社会主义基本经济制度：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。"]],["四、立场与方法",["出发点和落脚点：促进社会公平正义、增进人民福祉。","“三个进一步解放”：进一步解放思想、进一步解放和发展生产力、进一步增强社会活力（既是改革目的又是改革条件）。","方法论：顶层设计和摸着石头过河相结合、胆子要大步子要稳、坚持重大改革于法有据、统筹改革发展稳定（改革是动力、发展是目的、稳定是前提）。","思想前提：解放思想；根本保证：党的领导。"]],["五、进一步全面深化改革（二十届三中全会）",["主题：进一步全面深化改革、推进中国式现代化。","总目标：继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","以经济体制改革为牵引；以促进社会公平正义、增进人民福祉为出发点和落脚点；更加注重系统集成、突出重点、改革实效。","“六个坚持”原则：党的全面领导、以人民为中心、守正创新、以制度建设为主线、全面依法治国、系统观念。","“七个聚焦”：高水平社会主义市场经济体制、全过程人民民主、社会主义文化强国、人民生活品质、美丽中国、更高水平平安中国、党的领导水平和长期执政能力。"]],["六、记忆口诀",["总目标两句话（完善制度＋治理现代化）；重点经济体制、核心政市关系；出发落脚点公平正义惠民生；三个进一步解放；动力改革、目的发展、前提稳定。"]]]},{"title":"专题一 党的二十大新观点新论断新思想","groups":[["一、报告核心论断",["大会主题：高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。","三个务必：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。","三件大事：迎来中国共产党成立一百周年；中国特色社会主义进入新时代；完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。","两个“行”：中国共产党为什么能、中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行。"]],["二、中心任务与布局",["党的中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","首要任务：高质量发展。","基础性、战略性支撑：教育、科技、人才（科技是第一生产力、人才是第一资源、创新是第一动力）。","应有之义：人民民主（全过程人民民主是最广泛、最真实、最管用的民主）。","内在要求：尊重自然、顺应自然、保护自然。"]],["三、安全、强军与治理",["国家安全是民族复兴的根基，社会稳定是国家强盛的前提。","强军：如期实现建军一百年奋斗目标，把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。","“一国两制”是香港、澳门回归后保持长期繁荣稳定的最佳制度安排。","全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。"]],["四、五个“必由之路”",["坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。","中国特色社会主义是实现中华民族伟大复兴的必由之路。","团结奋斗是中国人民创造历史伟业的必由之路。","贯彻新发展理念是新时代我国发展壮大的必由之路。","全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。"]],["五、记忆口诀",["三个务必记心间，三件大事铭史册，两个行字是关键；中心任务现代化、首要任务高质量；五个必由之路要背熟。"]]]},{"title":"专题二 党的二十届三中全会精神","groups":[["一、全会概况",["时间地点：2024 年 7 月 15 日至 18 日在北京举行。","审议通过：《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","历史定位：当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。"]],["二、总体思路与目标",["主题：进一步全面深化改革、推进中国式现代化。","总目标：继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","阶段目标：到 2029 年完成《决定》提出的改革任务；到 2035 年全面建成高水平社会主义市场经济体制；到本世纪中叶全面建成社会主义现代化强国。","以经济体制改革为牵引；以促进社会公平正义、增进人民福祉为出发点和落脚点；更加注重系统集成、突出重点、改革实效。"]],["三、重要论断（定位速记）",["开放是中国式现代化的鲜明标识。","发展全过程人民民主是中国式现代化的本质要求。","法治是中国式现代化的重要保障。","在发展中保障和改善民生是中国式现代化的重大任务。","国家安全是中国式现代化行稳致远的重要基础。","国防和军队现代化是中国式现代化的重要组成部分。","党的领导是进一步全面深化改革、推进中国式现代化的根本保证。"]],["四、“六个坚持”与“七个聚焦”",["六个坚持：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。","七个聚焦：构建高水平社会主义市场经济体制、发展全过程人民民主、建设社会主义文化强国、提高人民生活品质、建设美丽中国、建设更高水平平安中国、提高党的领导水平和长期执政能力。"]],["五、记忆口诀",["三中全会定改革：主题现代化、总目标两句话；六个坚持七聚焦；开放是标识、民主是本质、法治是保障、民生是任务、安全是基础、国防是组成、党是根本保证。"]]]},{"title":"教材全书 2023版（导论＋17章＋结语）","groups":[["导论 习近平新时代中国特色社会主义思想是党和国家必须长期坚持的指导思想",["创立背景：在世界百年未有之大变局加速演进、我国社会主要矛盾发生历史性变化、中华民族伟大复兴进入关键时期、党推进全面从严治党的时代条件下创立并不断丰富发展。","确立过程：党的十九大把这一思想确立为党必须长期坚持的指导思想并写入党章；十三届全国人大一次会议通过宪法修正案将其载入宪法。","历史地位：是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。","主要内容：“十个明确”是最为核心关键的组成部分、构成“四梁八柱”；“十四个坚持”是新时代治国理政的基本方略；“十三个方面成就”是实践成果；三者内在贯通、有机统一。","三大时代课题：新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，是开辟马克思主义中国化时代化新境界的根本途径。","“六个必须坚持”（精髓与活的灵魂、“总钥匙”）：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","政治要求：深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”。"]],["第一章 新时代坚持和发展中国特色社会主义",["中国特色社会主义是历史和人民的选择，是社会主义而不是其他什么主义；坚定道路自信、理论自信、制度自信、文化自信。","中国特色社会主义进入新时代，这是我国发展新的历史方位；新时代伟大变革具有里程碑意义。","“三个意味着”：中华民族迎来从站起来、富起来到强起来的伟大飞跃；科学社会主义在二十一世纪的中国焕发出强大生机活力；中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径。","社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；是关系全局的历史性变化，但“两个没有变”——社会主义初级阶段的基本国情没有变，世界最大发展中国家的国际地位没有变。","基本路线核心“一个中心、两个基本点”：以经济建设为中心，坚持四项基本原则（立国之本）、坚持改革开放（强国之路）。","统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局（全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党）。"]],["第二章 以中国式现代化全面推进中华民族伟大复兴",["中国梦本质：国家富强、民族振兴、人民幸福；实现路径：走中国道路、弘扬中国精神、凝聚中国力量。","在中华大地上全面建成小康社会、实现第一个百年奋斗目标后，开启全面建设社会主义现代化国家新征程。","“两步走”：到2035年基本实现社会主义现代化；到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。","定性：中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。","五个中国特色：人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。","本质要求（九条）：坚持中国共产党领导、坚持中国特色社会主义、实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生、推动构建人类命运共同体、创造人类文明新形态。","五个重大原则（坚持和加强党的全面领导为首位）、六对重大关系（顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放）。","世界意义：创造人类文明新形态，打破“现代化＝西方化”迷思，为发展中国家走向现代化提供全新选择。"]],["第三章 坚持党的全面领导",["中国最大的国情就是中国共产党的领导；中国共产党领导是中国特色社会主义最本质的特征、中国特色社会主义制度的最大优势。","党的领导是党和国家事业不断发展的“定海神针”；没有中国共产党就没有新中国，就没有中华民族伟大复兴。","中国共产党是最高政治领导力量；党政军民学、东西南北中，党是领导一切的。","党的领导是全面的、系统的、整体的，要体现到治国理政各领域各方面各环节。","维护党中央权威和集中统一领导是最高政治原则；“两个维护”是最重要的政治纪律和政治规矩。","党的领导制度是我国的根本领导制度；健全党中央对重大工作的领导体制，把党的领导落实到国家治理各领域各方面各环节。"]],["第四章 坚持以人民为中心",["江山就是人民，人民就是江山；打江山、守江山，守的是人民的心。","人民立场是中国共产党的根本政治立场；党除了人民利益没有任何自己的特殊利益。","人民对美好生活的向往就是党的奋斗目标；人民是党的工作的最高裁决者和最终评判者。","群众路线是党的生命线和根本工作路线：一切为了群众、一切依靠群众，从群众中来、到群众中去。","发展为了人民、发展依靠人民、发展成果由人民共享；在发展中保障和改善民生，尽力而为、量力而行。","共同富裕是社会主义的本质要求、中国式现代化的重要特征；推动全体人民共同富裕取得更为明显的实质性进展。"]],["第五章 全面深化改革开放",["改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。","性质：社会主义制度的自我完善和发展，是“中国的第二次革命”；鲜明特征和首要任务是解放和发展社会生产力。","全面深化改革总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","国家治理体系是党领导下管理国家的制度体系；国家治理能力是运用国家制度管理各方面事务的能力，制度现代化是核心。","改革重点：经济体制改革；核心问题：处理好政府和市场的关系——市场在资源配置中起决定性作用，更好发挥政府作用。","出发点和落脚点：促进社会公平正义、增进人民福祉；“三个进一步解放”：解放思想、解放和发展社会生产力、解放和增强社会活力。","方法论：顶层设计和摸着石头过河相结合、胆子要大步子要稳、重大改革于法有据；改革是动力、发展是目的、稳定是前提。","更高水平开放：建设更高水平开放型经济新体制，实行更大范围、更宽领域、更深层次的对外开放，以开放促改革、促发展、促创新。"]],["第六章 推动高质量发展",["高质量发展是全面建设社会主义现代化国家的首要任务，是新时代的“硬道理”；发展是党执政兴国的第一要务。","新发展理念：创新、协调、绿色、开放、共享，是管全局、管根本、管长远的导向，具有战略性、纲领性、引领性。","新发展格局：以国内大循环为主体、国内国际双循环相互促进；是开放的双循环，要增强国内大循环内生动力和可靠性。","战略基点：坚持扩大内需，把实施扩大内需战略同深化供给侧结构性改革有机结合起来。","现代化产业体系是现代化国家的物质技术基础，具有完整性、先进性、安全性；坚持把发展经济的着力点放在实体经济上，推进新型工业化。","高水平科技自立自强：发挥新型举国体制优势，攻关关键核心技术，以发展新质生产力为重要着力点。","乡村振兴总要求：产业兴旺、生态宜居、乡风文明、治理有效、生活富裕；路径是产业、人才、文化、生态、组织“五个振兴”。","区域协调：深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略。"]],["第七章 社会主义现代化建设的教育、科技、人才战略",["教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。","“三个第一”：科技是第一生产力、人才是第一资源、创新是第一动力。","三大战略：科教兴国战略、人才强国战略、创新驱动发展战略；坚持教育优先发展、科技自立自强、人才引领驱动。","内在关系：科技创新靠人才、人才培养靠教育；教育强国、科技强国、人才强国具有内在一致性和相互支撑性，一体统筹推进。","教育是国之大计、党之大计；落实立德树人根本任务；到2035年建成教育强国。","党的二十大报告首次将教育、科技、人才作为专章一体部署；统筹推进教育科技人才体制机制一体改革。"]],["第八章 发展全过程人民民主",["人民民主是社会主义的生命；人民当家作主是社会主义民主政治的本质和核心。","全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。","全过程人民民主是全链条、全方位、全覆盖的民主，实现过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一。","五大环节：民主选举、民主协商、民主决策、民主管理、民主监督，各环节紧密联系、相互贯通，形成有效闭环。","人民代表大会制度是根本政治制度，是人民当家作主的重要途径和最高实现形式、实现全过程人民民主的重要制度载体。","基本政治制度：中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度；巩固和发展最广泛的爱国统一战线。","协商民主是社会主义民主政治的特有形式和独特优势；人民政协是专门协商机构；基层民主是全过程人民民主最直接、最广泛、最生动的体现。"]],["第九章 全面依法治国",["总目标：建设中国特色社会主义法治体系、建设社会主义法治国家；建设中国特色社会主义法治体系是总抓手，即在党的领导下形成“五个体系”——完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系。","中国特色社会主义法治道路是建设社会主义法治国家的唯一正确道路；核心要义是坚持党的领导、坚持中国特色社会主义制度、贯彻中国特色社会主义法治理论。","党的领导是社会主义法治之魂，是我国法治同西方资本主义国家法治最大的区别；决不走西方“宪政”“三权鼎立”“司法独立”的路子。","依宪治国、依宪执政：宪法是国家的根本法；坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。","工作布局：依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；法治政府建设是重点任务和主体工程。","十六字方针：科学立法、严格执法、公正司法、全民守法；公正司法是维护社会公平正义的最后一道防线。","全面依法治国是国家治理的一场深刻革命；在法治轨道上全面建设社会主义现代化国家；到2035年法治国家、法治政府、法治社会基本建成。"]],["第十章 建设社会主义文化强国",["文化是一个国家、一个民族的灵魂；文化兴则国运兴，文化强则民族强。","文化自信是更基础、更广泛、更深厚的自信；中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明。","坚持马克思主义在意识形态领域指导地位的根本制度；意识形态工作是为国家立心、为民族立魂的工作。","社会主义核心价值观：国家层面富强、民主、文明、和谐，社会层面自由、平等、公正、法治，公民层面爱国、敬业、诚信、友善。","中国特色社会主义文化源自中华优秀传统文化，熔铸于革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。","“两个结合”与“双创”：推动中华优秀传统文化创造性转化、创新性发展，古为今用、推陈出新。","繁荣发展文化事业和文化产业，推进文化和科技、文化和旅游深度融合；讲好中国故事，构建中国话语和中国叙事体系，提升国家文化软实力和中华文化影响力。","习近平文化思想的正式提出具有里程碑意义，标志着党对社会主义文化建设规律的认识达到新高度。"]],["第十一章 以保障和改善民生为重点加强社会建设",["江山就是人民，人民就是江山；为民造福是立党为公、执政为民的本质要求；让人民生活幸福是“国之大者”。","坚持在发展中保障和改善民生、在发展中增进民生福祉，尽力而为、量力而行。","收入分配是民生之源、促进共同富裕的基础性制度；规范收入分配秩序，保护合法收入、调节过高收入、取缔非法收入。","就业是最基本的民生；实施就业优先战略，把高质量充分就业作为经济社会发展的优先目标。","社会保障是民生保障安全网、收入分配调节器、经济运行减震器；健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。","健康中国：把保障人民健康放在优先发展的战略位置，坚持预防为主，促进优质医疗资源扩容和区域均衡布局。","社会治理：健全共建共治共享的社会治理制度，建设人人有责、人人尽责、人人享有的社会治理共同体。","新时代“枫桥经验”：坚持就地化解矛盾，把矛盾纠纷化解在基层、化解在萌芽状态；2022年首次写入党代会报告。"]],["第十二章 建设社会主义生态文明",["生态文明建设是关系中华民族永续发展的根本大计；“生态兴则文明兴”。","核心理念：坚持人与自然和谐共生；中国式现代化是人与自然和谐共生的现代化，绿色发展是中国式现代化的鲜明底色。","“两山”理论：绿水青山就是金山银山；保护生态环境就是保护生产力，改善生态环境就是发展生产力。","“双碳”目标：2020年9月习近平主席在第七十五届联合国大会一般性辩论上宣布，中国力争2030年前实现碳达峰、2060年前实现碳中和。","工作方针：精准治污、科学治污、依法治污；协同推进降碳、减污、扩绿、增长，深入打好蓝天、碧水、净土保卫战。","坚持山水林田湖草沙一体化保护和系统治理；实施长江十年禁渔，打好“三北”工程攻坚战。","建立以国家公园为主体的自然保护地体系，划定并严守生态保护红线；用最严格制度最严密法治保护生态环境，生态文明已载入党章和宪法。","全球贡献：共谋全球生态文明建设之路，共建清洁美丽世界；推动《巴黎协定》实施，推动达成“昆明—蒙特利尔全球生物多样性框架”。"]],["第十三章 维护和塑造国家安全",["国家安全是民族复兴的根基，社会稳定是国家强盛的前提。","总体国家安全观核心要义集中体现为“十个坚持”；首要的是坚持党对国家安全工作的绝对领导，坚持中国特色国家安全道路。","五大要素：以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。","坚持统筹发展和安全，统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，以新安全格局保障新发展格局。","把维护政治安全放在首要位置；统筹维护政治、军事、国土、经济、金融、文化、社会、科技、网络、粮食、生态等重点领域安全。","增强忧患意识、居安思危，提高防范化解重大风险能力；推进国家安全体系和能力现代化，建设更高水平的平安中国。"]],["第十四章 建设巩固国防和强大人民军队",["党在新时代的强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队；强国必须强军，军强才能国安。","国防和军队现代化新“三步走”：到2027年实现建军一百年奋斗目标；到2035年基本实现国防和军队现代化；到本世纪中叶把人民军队全面建成世界一流军队。","坚持党对人民军队的绝对领导是人民军队的建军之本、强军之魂，最高实现形式是军委主席负责制。","全面推进政治建军、改革强军、科技强军、人才强军、依法治军，加快军事理论、军队组织形态、军事人员、武器装备现代化。","军队是要准备打仗的，一切工作向能打仗、打胜仗聚焦；全面加强练兵备战，紧盯科技之变、战争之变、对手之变。","巩固提高一体化国家战略体系和能力，实现富国和强军相统一；国防和军队现代化进程必须同国家现代化进程相适应。"]],["第十五章 坚持“一国两制”和推进祖国完全统一",["“一国两制”是中国特色社会主义的伟大创举：在统一国家内，国家主体坚持社会主义制度，香港、澳门等特别行政区依法实行资本主义制度、保持长期不变。","准确把握“一国”与“两制”关系：“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”；维护国家主权、安全、发展利益是“一国两制”方针的最高原则。","必须始终坚持“爱国者治港”“爱国者治澳”；制定实施香港国安法是香港由乱到治的“分水岭”，推动香港进入由乱到治走向由治及兴的新阶段。","“和平统一、一国两制”是解决台湾问题的基本方针，也是实现国家统一的最佳方式；制度不同不是统一的障碍，更不是分裂的借口。","坚持一个中国原则和“九二共识”，坚决反对“台独”分裂行径和外部势力干涉，牢牢把握两岸关系主导权和主动权。","实现祖国完全统一是中华民族伟大复兴的必然要求，是不可阻挡的历史大势；支持香港、澳门更好融入国家发展大局。"]],["第十六章 中国特色大国外交和推动构建人类命运共同体",["当今世界正经历百年未有之大变局；中国必须有自己特色的大国外交，我国国际影响力、感召力、塑造力显著提升。","中国始终不渝走和平发展道路，坚持独立自主的和平外交政策，坚决维护国家主权、安全、发展利益。","推动构建新型国际关系，秉持相互尊重、公平正义、合作共赢原则。","构建人类命运共同体是习近平外交思想的核心理念；总目标是建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界（“五个世界”）。","全球发展倡议、全球安全倡议、全球文明倡议（教材口径“三大全球倡议”），从发展、安全、文明三个维度指明人类社会前进方向。","秉持共商共建共享的全球治理观，坚持真正的多边主义，积极参与全球治理体系改革和建设；高质量共建“一带一路”，推动构建开放型世界经济。"]],["第十七章 全面从严治党",["打铁必须自身硬；全面从严治党是新时代党的建设的鲜明主题，是新时代党的自我革命的伟大实践，取得历史性、开创性成就。","全面从严治党核心是加强党的领导，基础在全面，关键在严，要害在治。","以党的政治建设为统领、把党的政治建设摆在首位；思想建设是党的基础性建设；以严的基调强化正风肃纪，把制度建设贯穿党的各项建设之中。","腐败是党长期执政面临的最大威胁；坚持标本兼治开展反腐败斗争，反腐败必须永远吹冲锋号。","党的自我革命是跳出治乱兴衰历史周期率的第二个答案（第一个答案是“让人民来监督政府”）。","时刻保持解决大党独有难题的清醒和坚定；以伟大自我革命引领伟大社会革命，建设长期执政的马克思主义政党。"]],["结语 深刻领悟“两个确立”的决定性意义，把学习贯彻习近平新时代中国特色社会主义思想不断引向深入",["“两个确立”：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心愿。","“两个确立”是党在新时代取得的重大政治成果，是推动党和国家事业取得历史性成就、发生历史性变革的决定性因素，具有决定性意义。","“两个确立”与“两个维护”精神同源、内核同质、目标同向：“两个确立”是“两个维护”的政治前提和思想基础，“两个维护”是政治责任和实践要求。","增强“四个意识”、坚定“四个自信”、做到“两个维护”；坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，全面系统学、及时跟进学、深入思考学、联系实际学，把学习贯彻不断引向深入。"]],["全书记忆口诀",["导论：十个明确四梁八柱、十四个坚持是方略、十三个方面成就是实践；两个结合是途径、六个必须坚持是总钥匙；两个确立定根本。","第一章：方向道路定根本、四个自信不动摇；主要矛盾“变”了、初级阶段“没变”；五位一体四全面，一个中心两个基本点。","第二章：两步走——2035基本现代化、本世纪中叶成强国；五特色、九要求、五原则、六关系，党的领导放首位。","第三章：最本质特征最大优势；党是最高政治领导力量、领导一切；两个维护是最重要的政治纪律。","第四章：江山就是人民、守的是人民的心；群众路线是生命线；发展为了、依靠、共享三句话；共同富裕是本质要求。","第五章：总目标两句话（完善制度＋治理现代化）；重点经济体制、核心政市关系；公平正义惠民生；三个进一步解放。","第六章：首要任务高质量；创新协调绿色开放共享；国内大循环为主体双循环；着力点放实体经济；五个振兴促乡村。","第七章：三个第一（科技生产力、人才第一资源、创新第一动力）；教育优先、科技自立自强、人才引领驱动；2035建成教育强国。","第八章：人民民主是生命；全过程=全链条全方位全覆盖、最广泛最真实最管用；人大制度是根本；协商民主是特有优势。","第九章：一目标一抓手、五体系一条路；三共同三一体；十六字方针依宪治；2035法治基本建成。","第十章：文化自信更基础更广泛更深厚；马导制度立根本；核心价值观三层次；双创传承讲好中国故事。","第十一章：国之大者惠民生；分配、就业、社保、健康四支柱；共建共治共享；枫桥经验化矛盾。","第十二章：生态兴则文明兴；两山理念化生产力；双碳——2030达峰、2060中和；山水林田湖草沙系统治。","第十三章：宗旨人民、根本政治、基础经济、保障军科文社、依托国际安全；政治安全放首位。","第十四章：听党指挥、能打胜仗、作风优良；三步走2027/2035/本世纪中叶；五个建军。","第十五章：一国是前提、两制从属之；爱国者治港治澳；和平统一一国两制，反独促统不松动。","第十六章：大变局中大国外交；新型国际关系三原则；命运共同体“五个世界”；三大全球倡议＋一带一路。","第十七章：打铁自身硬；两个答案（人民监督＋自我革命）；政治建设打头、思想建设打底；反腐永远吹冲锋号。","结语：两个确立定乾坤，四个意识四个自信，两个维护见行动。"]]]}];

function migrateLegacy(s){
  if(!s) return null;
  if(s.v && s.v >= 2) return s;
  // 旧版以全局序号为键（1..N），迁移为稳定 id 键
  const flat = allQuestions;
  const mapIdx = k => { const n = parseInt(k,10); return (!isNaN(n) && n>=1 && n<=flat.length) ? flat[n-1].id : null; };
  const na = {}, nw = {}, nf = [];
  if(s.answers && typeof s.answers === "object"){
    for(const k in s.answers){ const id = mapIdx(k); if(id) na[id] = s.answers[k]; }
  }
  if(s.wrong && typeof s.wrong === "object"){
    for(const k in s.wrong){ const id = mapIdx(k); if(id) nw[id] = s.wrong[k]; }
  }
  if(Array.isArray(s.favs)){ s.favs.forEach(k => { const id = mapIdx(k); if(id) nf.push(id); }); }
  const out = {v:2, answers:na, favs:nf, wrong:nw};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(out)); localStorage.removeItem(LS_LEGACY); }catch(e){}
  return out;
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800); }

function answeredCount(){ return Object.keys(state.answers).length; }
function correctCount(){ let c=0; for(const k in state.answers){ if(state.answers[k].correct) c++; } return c; }
function wrongList(){ return Object.keys(state.wrong); } // 按添加顺序（id 为字符串）
function getChapter(id){ return BANK.chapters.find(c=>c.id===id); }
function qInChapter(qid){ return flatById[qid] ? flatById[qid]._ch : null; }
function chAnswered(chId){ let a=0,c=0; getChapter(chId).questions.forEach(q=>{ const r=state.answers[q.id]; if(r){a++; if(r.correct)c++;} }); return [a,c]; }

let session = { mode:"chapter", chapterId:"c1", order:[], pos:0, scope:null };
function buildOrder(mode, chapterId){
  let qs = [];
  if(mode==="chapter") qs = getChapter(chapterId).questions.slice();
  else if(mode==="random") qs = allQuestions.slice().sort(()=>Math.random()-0.5);

}

function route(){
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//,"").split("/");
  const name = parts[0];
  const V = $("#view");
  if(name==="home"){ renderHome(V); }
  else if(name==="random"){ session={mode:"random",order:buildOrder("random"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"随机刷题");}else{renderQuiz(V,session);} }
  else if(name==="mistakes"){ session={mode:"mistakes",order:buildOrder("mistakes"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"错题本","暂无错题，继续刷题吧");}else{renderQuiz(V,session);} }
  else if(name==="fav"){ session={mode:"fav",order:buildOrder("fav"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"收藏","还没有收藏题目，刷题时点星标即可收藏");}else{renderQuiz(V,session);} }
  else if(name==="c"){ const cid=parts[1]; if(cid){ session={mode:"chapter",chapterId:cid,order:getChapter(cid).questions.map(q=>q.id),pos:0,scope:null}; renderQuiz(V,session); } }
  else if(name==="cards"){ renderCards(V); }
  else if(name==="mindmap"){ renderMindmap(V); }
  else if(name==="outline"){ renderOutline(V); }
  else if(name==="book"){ renderBook(V); }
  else if(name==="stats"){ renderStats(V); }
  else renderHome(V);
  document.body.classList.toggle("in-quiz", name==="c"||name==="random"||name==="mistakes"||name==="fav");
  renderPills();
  syncNavActive();
}
function syncNavActive(){
  $$(".nav-item").forEach(n=>n.classList.remove("active"));
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//,"").split("/");
  if(parts[0]==="c"){ const n=document.querySelector(`[data-nav="ch-${parts[1]}"]`); if(n) n.classList.add("active"); }
  else{ const n=document.querySelector(`[data-nav="${parts[0]}"]`); if(n) n.classList.add("active"); }

  // 移动端底部导航高亮映射
  $$(".tab").forEach(t=>t.classList.remove("active"));

  const tabName = tabMap[parts[0]];
  if(tabName){ const t=document.querySelector(`.tab[data-tab="${tabName}"]`); if(t) t.classList.add("active"); }
}

        }).join("")}</div>

function pickOpt(i){
  const q = currentQ(); if(!q) return;
  const els = $$(".opt");
  if(q.type==="single"){
    els.forEach(e=>e.classList.remove("sel"));
    els[i].classList.add("sel");
  }else{
    els[i].classList.toggle("sel");
  }
}
function currentQ(){ return flatById[session.order[session.pos]]; }
function myPick(){
  const q = currentQ();
  if(q.type==="single"){ const el=$(".opt.sel"); return el? el.dataset.i : null; }
  if(q.type==="multi"){ return $$(".opt.sel").map(e=>+e.dataset.i).sort(); }
  const v = $("#fill-input").value.trim();
  return v;
}
function submitAnswer(){
  const q = currentQ(); if(!q) return;
  const pick = myPick();
  const result = $("#result");
  let correct=false, ansText="";
  if(q.type==="single"){
    if(pick===null){ toast("请先选择一个选项"); return; }
    const letter = "ABCD"[pick];
    correct = letter===q.answer;
    ansText = letter+"."+q.options[pick];
    markOpts(pick, correct);
  }else if(q.type==="multi"){
    if(!pick.length){ toast("请至少选择一个选项"); return; }
    const letters = pick.map(i=>"ABCD"[i]).join("");
    correct = letters===q.answer;
    ansText = letters;
    markOpts(pick, correct);
  }else{
    if(!pick){ toast("请输入答案"); return; }
    const ok = checkFill(pick, q.answer);
    correct = ok;
    ansText = Array.isArray(q.answer)?q.answer.join(" ／ "):q.answer;
  }
  // 记录
  const rec = state.answers[q.id] || {tries:0};
  rec.tries++;
  rec.picked = Array.isArray(pick)?pick.join(","):(pick===null?"":pick);
  rec.correct = correct;
  rec.ts = Date.now();
  state.answers[q.id] = rec;
  if(correct){
    if(session.mode==="mistakes"){ delete state.wrong[q.id]; }
  }else{
    state.wrong[q.id] = (state.wrong[q.id]||0)+1;
  }
  saveState();
  // 展示结果
  $("#btn-submit").style.display="none";
  $("#btn-next").style.display="";
  $("#btn-again").style.display="";
  result.className = "result show "+(correct?"ok":"bad");
  result.innerHTML = `<div class="head">${correct?"回答正确 ✓":"回答错误 ✗"}</div>
    <div class="ans">正确答案：<b>${esc(ansText)}</b></div>
    <div class="exp"><b>解析：</b>${esc(q.explain)}</div>`;
  renderPills(); refreshDots();
}
function markOpts(pickIdx, correct){
  const q = currentQ();
  const els = $$(".opt");
  els.forEach(e=>e.classList.add("disabled"));
  q.options.forEach((o,i)=>{
    const el = els[i];
    if(o[0]===undefined) return;
    const letter = "ABCD"[i];
    if(letter===q.answer){ el.classList.add("right"); }
    else if(q.type==="single" && i===pickIdx){ el.classList.add("wrong"); }
    else if(q.type==="multi" && pickIdx.includes(i)){ el.classList.add("wrong"); }
  });
}
function checkFill(input, accepted){
  const norm = s => s.replace(/[\s，。；;、,．.\/|＿_]/g,"").toLowerCase();
  const ni = norm(input);
  const arr = Array.isArray(accepted)?accepted:[accepted];
  for(const a of arr){
    // 一个答案可能含多个空，用 ；或 | 分隔，全部命中才算对
    const segs = a.split(/[；;|]/).map(norm).filter(Boolean);
    if(segs.every(seg=>ni.includes(seg))) return true;
  }
  return false;
}
function restoreAnswered(q, rec){
  // 恢复上次选择
  if(q.type!=="fill" && rec.picked!==""){
    const idxs = String(rec.picked).split(",").map(Number).filter(n=>!isNaN(n));
    idxs.forEach(i=>{ const el=$$(".opt")[i]; if(el) el.classList.add("sel"); });
  }else if(q.type==="fill" && rec.picked){
    const inp=$("#fill-input"); if(inp) inp.value = rec.picked;
  }
  // 显示结果（若上次已提交）
  if(rec.tries>0){
    const result = $("#result");
    $("#btn-submit").style.display="none";
    $("#btn-next").style.display="";
    $("#btn-again").style.display="";
    result.className = "result show "+(rec.correct?"ok":"bad");
    const ansText = q.type==="fill" ? (Array.isArray(q.answer)?q.answer.join(" ／ "):q.answer) : q.answer;
    result.innerHTML = `<div class="head">${rec.correct?"回答正确 ✓":"上次回答错误 ✗"}</div>
      <div class="ans">正确答案：<b>${esc(ansText)}</b></div>
      <div class="exp"><b>解析：</b>${esc(q.explain)}</div>`;
    if(q.type!=="fill" && rec.correct){ markOpts([], true); } // 全标对
    else if(q.type!=="fill"){ markOpts(String(rec.picked).split(",").map(Number).filter(n=>!isNaN(n)), false); }
  }
}
function resetQ(){
  const q = currentQ();
  if(q.type==="fill"){ const inp=$("#fill-input"); if(inp) inp.value=""; }
  $$(".opt").forEach(e=>{e.classList.remove("sel","right","wrong","disabled");});
  $("#result").className="result";
  $("#result").innerHTML="";
  $("#btn-submit").style.display="";
  $("#btn-next").style.display="none";
  $("#btn-again").style.display="none";
}
function nextQ(){ gotoQ(session.pos+1); }
function gotoQ(i){

function refreshDots(){

function toggleFav(qid){

function renderMindmap(V){
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:6px">章节知识思维导图</h2>
  <p style="font-size:13px;color:var(--ink-3);margin-bottom:18px">点击章节标题或分组节点展开/折叠，辅助结构化记忆。</p>
  <div class="tip-card"><b>课程体系速记：</b>《习近平新时代中国特色社会主义思想概论》2023版教材围绕“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”展开；本课程按专题梳理为八大部分：新时代与新矛盾 → 中国式现代化 → 党建 → 以人民为中心 → 改革开放（＋二十大、三中全会专题） → 教材全书（导论＋17章＋结语）。</div>
  ${OUTLINE.map((ch,i)=>`
  <div class="mind-ch ${i===0?"open":""}" id="mc-${i}">
    <div class="mind-ch-head" onclick="toggleMind(${i})">
      <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>${esc(ch.title)}
    </div>
    <div class="mind-body">
      ${ch.groups.map((g,gi)=>`
      <div class="tree-group ${gi===0?"open":""}" onclick="event.stopPropagation();this.classList.toggle('open')">
        <div class="g-title">${esc(g[0])}</div>
        <div class="g-items">${g[1].map(it=>`<div class="tree-item">${esc(it)}</div>`).join("")}</div>
      </div>`).join("")}
    </div>
  </div>`).join("")}`;
}
function toggleMind(i){
  const el = $("#mc-"+i); if(el) el.classList.toggle("open");
}

/* ================= 知识提纲 ================= */
function renderOutline(V){
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:16px">章节知识要点提纲</h2>
  ${OUTLINE.map(ch=>`
  <div class="outline-sec">
    <h3>${esc(ch.title)}</h3>
    ${ch.groups.map(g=>`
    <div class="og"><h4>${esc(g[0])}</h4><ul>${g[1].map(it=>`<li>${esc(it)}</li>`).join("")}</ul></div>`).join("")}
  </div>`).join("")}`;
}

/* ================= 教材全书 ================= */
function renderBook(V){
  const ch = OUTLINE.find(o => o.title.indexOf("教材全书") === 0) || OUTLINE[OUTLINE.length-1];
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:6px">教材全书要点（2023版）</h2>
  <p style="font-size:13px;color:var(--ink-3);margin-bottom:16px">依据 2023 版教材公开章节体系（导论＋17章＋结语）与权威解读整理，未逐字复制教材全文。</p>
  <div class="outline-sec">
    <h3>${esc(ch.title)}</h3>
    ${ch.groups.map(g=>`
    <div class="og"><h4>${esc(g[0])}</h4><ul>${g[1].map(it=>`<li>${esc(it)}</li>`).join("")}</ul></div>`).join("")}
  </div>`;
}

/* ================= 统计 ================= */
function renderStats(V){
  const a=answeredCount(), c=correctCount(), rate=a?Math.round(c/a*100):0;
  V.innerHTML = `
  <h2 style="font-size:18px;margin-bottom:16px">答题统计</h2>
  <div class="doughnut-wrap">
    <div class="doughnut" style="--p:${a?rate:0}%"><div class="inner"><b>${rate}%</b><span>正确率</span></div></div>
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">总体进度</div>
      <div style="font-size:13px;color:var(--ink-2)">已作答 <b style="color:var(--red)">${a}</b> / ${allQuestions.length} 题（${a?Math.round(a/allQuestions.length*100):0}%）</div>
      <div style="font-size:13px;color:var(--ink-2)">答对 ${c} 题 · 答错 ${a-c} 题 · 错题本 ${wrongList().length} 题 · 收藏 ${state.favs.length} 题</div>
      <div style="font-size:12.5px;color:var(--ink-3);margin-top:8px">刷题记录保存在浏览器本地（localStorage），换设备或清缓存会丢失。</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="k">已作答</div><div class="v">${a}<small> / ${allQuestions.length}</small></div></div>
    <div class="stat-card"><div class="k">答对</div><div class="v">${c}</div></div>
    <div class="stat-card"><div class="k">答错</div><div class="v" style="color:var(--bad)">${a-c}</div></div>
    <div class="stat-card"><div class="k">正确率</div><div class="v" style="color:var(--ok)">${rate}%</div></div>
  </div>
  ${BANK.chapters.map(ch=>{
    const [ca,cc]=chAnswered(ch.id);
    const rt = ca?Math.round(cc/ca*100):0;
    const pct = ch.questions.length?Math.round(ca/ch.questions.length*100):0;
    return `<div class="ch-stats">
      <div class="row1"><b>${esc(ch.title)}</b><span>已答 ${ca}/${ch.questions.length} · 正确率 ${ca?rt+"%":"--"}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">完成度 ${pct}% · ${ch.questions.filter(q=>state.answers[q.id]&&state.answers[q.id].correct).length} 题答对</div>
    </div>`;}).join("")}`;
}

/* ================= 空状态 ================= */
function emptyView(V, title, msg){
  V.innerHTML = `<div class="empty">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9C2B4" stroke-width="1.4" style="margin-bottom:12px"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    <h3>${esc(title)}</h3><p>${esc(msg||"暂无内容")}</p></div>`;
}

/* ================= 全局 ================= */
function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
function resetProgress(){
  if(!confirm("确定要清空全部答题记录、错题本和收藏吗？此操作不可恢复。")) return;
  state = {v:2, answers:{}, favs:[], wrong:{}};
  saveState(); route();
  toast("学习进度已重置");
}
window.addEventListener("hashchange", ()=>{ closeSidebar(); route(); });
function isMobile(){ return window.matchMedia("(max-width:820px)").matches; }
document.addEventListener("DOMContentLoaded", ()=>{
  renderNav();
  // 手机端一点开就刷题：无路由时默认进入随机刷题；桌面端默认首页
  if(!location.hash){
    if(isMobile()){ history.replaceState(null, "", "#/random"); }
    else{ history.replaceState(null, "", "#/home"); }
  }
  route();
});
</script>
</body>
</html>
