"政策沟通、设施联通、贸易畅通、资金融通、民心相通","共商共建共享","和平合作、开放包容、互学互鉴、互利共赢","构建人类命运共同体"],"answer":"A","explain":"政策沟通、设施联通、贸易畅通、资金融通、民心相通是共建“一带一路”的重点合作内容，A项完整列出了“五通”。B项共商共建共享是合作原则；C项和平合作、开放包容、互学互鉴、互利共赢体现丝路精神；D项推动构建人类命运共同体是更高层次的总体方向。各项均与共建实践有关，但不是同一层级的核心内容。教材对应「共建“一带一路”的五通合作」。","id":"c16-o-s16","origNo":16},{"type":"single","orig":true,"q":"共建“一带一路”追求的目标是（ ）","options":["高标准、可持续、惠民生","政策沟通、设施联通、贸易畅通、资金融通、民心相通","共商共建共享","和平合作、开放包容、互学互鉴、互利共赢"],"answer":"A","explain":"高标准、可持续、惠民生体现高质量共建“一带一路”的目标要求，A项强调项目规则和质量、长期效益及民众获得感。B项“五通”是重点合作领域和具体内容；C项共商共建共享是合作原则；D项和平合作、开放包容、互学互鉴、互利共赢属于丝路精神。题干问追求的目标，不宜将领域、原则与精神视为等同答案。教材对应「高质量共建“一带一路”的目标」。","id":"c16-o-s17","origNo":17},{"type":"single","orig":true,"q":"中国外交工作布局中，首要的是（ ）","options":["大国关系","周边关系","发展中国家关系","多边外交"],"answer":"B","explain":"选B。中国外交工作布局中，周边是首要，大国是关键、发展中国家是基础、多边是重要舞台。A项是关键，C项是基础，D项是重要舞台，均与“首要”不符。教材对应「新时代中国外交工作布局」。","id":"c16-o-s18","origNo":18},{"type":"single","orig":true,"q":"中国外交工作布局中，关键的是（ ）","options":["大国关系","周边关系","发展中国家关系","多边外交"],"answer":"A","explain":"外交工作布局中大国是关键，A项强调稳定和发展主要大国关系对国际秩序及全球治理的影响。B项周边是首要，着重周边安全与合作；C项发展中国家是基础，强调共同利益与团结协作；D项多边是舞台，通过国际组织和机制推进合作。四者构成相互联系的外交布局，题干所问“关键”对应A。教材对应「中国外交工作总体布局」。","id":"c16-o-s19","origNo":19},{"type":"single","orig":true,"q":"新时代我国推动大国关系发展的目标是（ ）","options":["零和博弈","良性互动、协调合作","结盟对抗","单边优先"],"answer":"B","explain":"推动大国关系良性互动、协调合作，有利于管控分歧并维护国际稳定，B项体现对话协商与合作共赢的方向。A项零和博弈把一方收益建立在另一方损失之上；C项结盟对抗会强化阵营分裂；D项单边优先使一国利益凌驾其他国家合理关切。这三种做法均不符合相互尊重、和平共处、合作共赢的大国交往方向。教材对应「新时代大国关系发展方向」。","id":"c16-o-s20","origNo":20},{"type":"single","orig":true,"q":"文明交流互鉴的核心要求不包括（ ）","options":["文明交流超越文明隔阂","文明互鉴超越文明冲突","文明共存超越文明优越","文明同化超越文明差异"],"answer":"D","explain":"文明交流互鉴强调以文明交流超越文明隔阂、以文明互鉴超越文明冲突、以文明共存超越文明优越，A、B、C分别对应交流、互鉴和共存三个维度，属于题干所指的要求。D项“文明同化”主张消除差异、趋于单一，与尊重世界文明多样性和不同文明平等相待的立场相悖，因此是“不包括”的选项。教材对应「文明交流互鉴与文明多样性」。","id":"c16-o-s21","origNo":21},{"type":"single","orig":true,"q":"中国走和平发展道路的坚定立场是（ ）","options":["霸权主义道路","国强必霸道路","和平发展道路","扩张崛起道路"],"answer":"C","explain":"中国坚定走和平发展道路，C项强调通过和平方式维护国家发展利益、推进国际合作，不走侵略扩张道路。A项霸权主义主张以强凌弱；B项“国强必霸”将国家发展同霸权扩张错误地联系起来；D项扩张崛起依赖强制手段扩大势力范围。这三项都与坚持和平发展、反对霸权主义的中国外交立场相反。教材对应「坚持走和平发展道路」。","id":"c16-o-s22","origNo":22},{"type":"single","orig":true,"q":"全球发展倡议的首要目标是推动全球（ ）","options":["安全治理","共同发展","文明互鉴","秩序重构"],"answer":"B","explain":"全球发展倡议把促进共同发展作为重要目标，B项强调合作弥合发展鸿沟、落实联合国2030年可持续发展议程。A项安全治理主要属于全球安全倡议领域；C项文明互鉴对应全球文明倡议；D项秩序重构并不是全球发展倡议对发展目标的规范概括，其所涉治理秩序问题更接近全球治理议题。教材对应「全球发展倡议的目标」。","id":"c16-o-s23","origNo":23},{"type":"single","orig":true,"q":"全球文明倡议的核心是推动世界各国（ ）","options":["文明趋同、统一价值","文明交流、互鉴、共存","文明优劣、等级排序","文明隔绝、独立发展"],"answer":"B","explain":"全球文明倡议倡导尊重文明多样性，推动文明交流、互鉴与共存，B项强调不同文明平等对话、相互学习。A项文明趋同、统一价值否认发展道路和文明形态的差异；C项以文明优劣作等级排序破坏平等原则；D项文明隔绝拒绝相互理解和借鉴。后三项均不符合开放包容、交流互鉴的倡议精神。教材对应「全球文明倡议的核心主张」。","id":"c16-o-s24","origNo":24},{"type":"single","orig":true,"q":"中国提出“全球安全倡议”的宗旨是（ ）","options":["应对国际安全挑战","维护世界和平与安全","构建人类安全共同体","坚持共同、综合、合作、可持续的安全观"],"answer":"C","explain":"全球安全倡议提出构建人类安全共同体、建设远离恐惧和普遍安全的世界，因此本题按“宗旨”的概括选C。A只概括其针对的挑战，B是总体愿景的概括，D是倡议所坚持的安全观而非宗旨表述。教材对应「全球安全倡议与人类安全共同体」。","id":"c16-o-s25","origNo":25},{"type":"single","orig":true,"q":"全球治理观的核心内容是（ ）","options":["独立自主、和平发展","共商共建共享","互利共赢、开放包容","公平公正、合作共赢"],"answer":"B","explain":"共商共建共享是中国提出的全球治理观的核心要求，B项强调治理规则由各国共同商议、治理事业由各方参与、成果为各国共同享有。A项独立自主、和平发展是中国外交的基本立场与道路；C项互利共赢、开放包容侧重合作态度和利益方向；D项公平公正、合作共赢体现治理价值目标，但不是这一治理观的固定概括。教材对应「共商共建共享的全球治理观」。","id":"c16-o-s26","origNo":26},{"type":"single","orig":true,"q":"中国特色大国外交最鲜明的底色是（ ）","options":["霸权主义","独立自主","依附外交","结盟外交"],"answer":"B","explain":"独立自主是中国外交鲜明的立场和特点，B项强调根据事情本身是非曲直独立判断，维护自身主权与正当利益。A项霸权主义依赖强制和支配；C项依附外交将决策受制于他国；D项结盟外交依赖阵营对抗。这三种路径都与中国独立自主的和平外交政策及不结盟原则相区别。教材对应「独立自主的和平外交政策」。","id":"c16-o-s27","origNo":27},{"type":"single","orig":true,"q":"推动构建人类命运共同体的根本遵循是（ ）","options":["西方外交理论","习近平外交思想","传统外交理念","大国博弈规则"],"answer":"B","explain":"习近平外交思想是新时代中国对外工作的根本遵循和行动指南，B项为推动构建人类命运共同体提供方向指引。A项西方外交理论不能替代中国外交的理论指导；C项传统外交理念是历史经验的一部分而非这一新时代理论遵循；D项大国博弈规则着眼力量竞争，并非构建人类命运共同体的基本原则。教材对应「习近平外交思想的指导地位」。","id":"c16-o-s28","origNo":28},{"type":"single","orig":true,"q":"中国参与全球治理的根本目的是（ ）","options":["称霸世界、主导全球","服务人类进步、助力民族复兴","输出模式、干涉他国内政","争夺霸权、划分势力范围"],"answer":"B","explain":"中国参与全球治理把服务人类进步与助力民族复兴联系起来，B项体现中国发展与世界共同发展的协调关系。A项称霸世界、主导全球和D项争夺霸权、划分势力范围均以强权竞争为目标；C项输出模式、干涉他国内政违背尊重各国自主选择发展道路和不干涉内政的原则。参与全球治理不是谋求霸权或制度输出。教材对应「中国参与全球治理的目标与立场」。","id":"c16-o-s29","origNo":29},{"type":"multi","orig":true,"q":"习近平外交思想的核心要义包括（ ）","options":["坚持独立自主的和平外交政策","坚持维护世界和平、促进共同发展","坚持推动构建人类命运共同体","坚持共商共建共享全球治理观"],"answer":"A、B、C、D","explain":"习近平外交思想强调独立自主的和平外交政策（A），确立维护世界和平、促进共同发展的外交宗旨（B），以推动构建人类命运共同体引领对外工作（C），并倡导共商共建共享的全球治理观（D）。四项分别涉及政策立场、根本宗旨、总体目标与全球治理原则，均属于这一思想的重要内容，虽然定位不同，但都在题干所问的范围内。教材对应「习近平外交思想的主要内容」。","id":"c16-o-s30","origNo":30},{"type":"multi","orig":true,"q":"人类命运共同体建设的五大目标是建设（ ）的世界","options":["持久和平","普遍安全","共同繁荣","开放包容、清洁美丽"],"answer":"A、B、C、D","explain":"构建人类命运共同体提出建设持久和平（A）、普遍安全（B）、共同繁荣（C）、开放包容与清洁美丽（D）的世界。D项实际上合并列出了“开放包容”和“清洁美丽”两个目标，因此四个选项共同构成五项世界愿景。和平、安全、发展、文明交流和生态环境相互关联，是构建人类命运共同体所倡导的整体目标，不能只选择其中一部分。教材对应「构建人类命运共同体的五大目标」。","id":"c16-o-s31","origNo":31},{"type":"multi","orig":true,"q":"新型国际关系的基本内涵包括（ ）","options":["相互尊重","公平正义","合作共赢","结盟对抗"],"answer":"A、B、C","explain":"新型国际关系的基本内涵是相互尊重（A）、公平正义（B）、合作共赢（C）。相互尊重强调国家平等，公平正义强调国际规则和秩序应当公道，合作共赢强调通过合作实现共同利益。D项结盟对抗通过阵营划线强化冲突，违背相互尊重、对话协商和共同发展的方向，因而不属于新型国际关系的基本内涵。教材对应「新型国际关系的基本内涵」。","id":"c16-o-s32","origNo":32},{"type":"multi","orig":true,"q":"新时代中国特色大国外交的鲜明特征有（ ）","options":["独立自主","和平发展","合作共赢","胸怀天下"],"answer":"A、B、C、D","explain":"新时代中国特色大国外交坚持独立自主（A），维护外交决策自主权；坚持和平发展（B），不走对外扩张道路；追求合作共赢（C），推动各国共同受益；秉持胸怀天下（D），从人类共同利益出发思考国际事务。这四项分别体现外交立场、发展道路、合作方向和世界眼光，合起来说明中国特色大国外交的鲜明特征。教材对应「中国特色大国外交的鲜明特征」。","id":"c16-o-s33","origNo":33},{"type":"multi","orig":true,"q":"中国坚持的真正多边主义，坚决反对的是（ ）","options":["单边主义","霸权主义","强权政治","集团政治"],"answer":"A、B、C、D","explain":"真正的多边主义反对以一国意志取代各国协商的单边主义（A），反对以实力支配他国的霸权主义（B）和强权政治（C），也反对排他划线、以小圈子处理国际事务的集团政治（D）。四种做法都损害主权平等和开放合作，不符合维护联合国权威、遵守国际法和由各国共同参与全球治理的要求。教材对应「真正的多边主义与反对霸权强权」。","id":"c16-o-s34","origNo":34},{"type":"multi","orig":true,"q":"百年未有之大变局的主要表现包括（ ）","options":["世界多极化","经济全球化","社会信息化","文化多样化"],"answer":"A、B、C、D","explain":"百年未有之大变局的表现涉及世界多极化（A）、经济全球化（B）、社会信息化（C）和文化多样化（D）。多极化体现国际力量对比变化，全球化体现各国经济联系加深，信息化改变社会运行和交往方式，多样化反映不同文明形态长期并存。四者分别从政治、经济、科技社会和文化层面说明世界演变趋势，不能互相替代。教材对应「世界百年未有之大变局的主要趋势」。","id":"c16-o-s35","origNo":35},{"type":"multi","orig":true,"q":"中国对待发展中国家的外交理念包含（ ）","options":["真实","亲诚","正确义利观","互利排他"],"answer":"A、B、C","explain":"中国对发展中国家交往强调真实（A）、亲诚（B）与正确义利观（C）：真实强调真诚相待和务实合作，亲诚强调亲近、平等、守信，正确义利观强调既重义又重利，在必要时义利相兼、以义为先。D项“互利排他”把合作限定为排斥其他国家的小圈子，与开放包容、南南合作以及共同发展的方向不符。教材对应「真实亲诚理念和正确义利观」。","id":"c16-o-s36","origNo":36},{"type":"multi","orig":true,"q":"全球治理体系改革的中国主张包括（ ）","options":["坚持共商共建共享","倡导国际关系民主化","维护联合国核心地位","扩大发展中国家国际话语权"],"answer":"A、B、C、D","explain":"改革完善全球治理体系强调共商共建共享（A），使各国共同参与决策与合作；倡导国际关系民主化（B），反对少数国家垄断规则；维护联合国核心地位（C），坚持以联合国为核心的国际体系；扩大发展中国家话语权（D），推动更公平合理的国际代表性。四项从原则、程序、制度平台与代表性方面相互配合。教材对应「全球治理体系改革的中国主张」。","id":"c16-o-s37","origNo":37},{"type":"multi","orig":true,"q":"总体国家安全观框架下的国际安全理念包括（ ）","options":["共同安全","综合安全","合作安全","可持续安全"],"answer":"A、B、C、D","explain":"共同安全（A）要求兼顾各国合理安全关切；综合安全（B）要求统筹传统与非传统威胁；合作安全（C）主张通过协商和共同努力应对风险；可持续安全（D）强调发展与安全协调、重视安全问题的深层原因。四项完整构成中国倡导的共同、综合、合作、可持续全球安全观的不同维度，均属于题干范围。教材对应「共同综合合作可持续的全球安全观」。","id":"c16-o-s38","origNo":38},{"type":"multi","orig":true,"q":"中国外交工作布局中，正确的表述包括（ ）","options":["大国是关键","周边是首要","发展中国家是基础","多边是舞台"],"answer":"A、B、C、D","explain":"中国外交总体布局通常概括为大国是关键（A）、周边是首要（B）、发展中国家是基础（C）、多边是舞台（D）。大国关系影响全球稳定，周边关系直接关系周边环境，发展中国家合作提供广泛基础，多边平台用于参与全球治理。四项各有专门定位，构成相互联系的整体；本章关于“首要”的单选题与此表述存在冲突，需另行核对。教材对应「中国外交工作总体布局」。","id":"c16-o-s39","origNo":39},{"type":"multi","orig":true,"q":"文明交流互鉴的正确理念是（ ）","options":["以文明交流超越文明隔阂","以文明互鉴超越文明冲突","以文明共存超越文明优越","以文明同化超越文明差异"],"answer":"A、B、C","explain":"文明交流互鉴主张以文明交流超越文明隔阂（A），促进彼此了解；以文明互鉴超越文明冲突（B），在相互学习中化解误解；以文明共存超越文明优越（C），承认各国文明平等与多样。D项文明同化要求消除文明差异，不是文明交流互鉴所追求的目标，不能以同质化替代平等对话与开放包容。教材对应「不同文明交流互鉴的原则」。","id":"c16-o-s40","origNo":40},{"type":"multi","orig":true,"q":"新时代中国外交的重要原则包括（ ）","options":["坚持党的集中统一领导","坚持胸怀天下、服务大局","坚持独立自主和平外交","坚持走和平发展道路"],"answer":"A、B、C、D","explain":"坚持党的集中统一领导（A）为中国特色大国外交提供政治保证；胸怀天下、服务大局（B）体现把民族复兴与人类进步相联系；独立自主和平外交（C）明确自主决策与和平立场；和平发展道路（D）明确不靠对外扩张谋求发展。四项分别从领导保证、世界胸怀、基本政策与发展路径体现新时代外交的重要原则。教材对应「新时代中国特色大国外交的重要原则」。","id":"c16-o-s41","origNo":41},{"type":"multi","orig":true,"q":"中国推动构建的全球伙伴关系网络特点是（ ）","options":["全方位","多层次","立体化","排他性"],"answer":"A、B、C","explain":"中国建设的全球伙伴关系网络强调全方位（A）、多层次（B）和立体化（C）。全方位指交往对象覆盖不同地区和类型国家，多层次包括政府、地方和各领域合作，立体化体现双边、多边和各类机制相互衔接。D项排他性与广交朋友、结伴而不结盟的伙伴关系理念相反，不是中国所追求的全球伙伴网络特征。教材对应「全方位多层次立体化的全球伙伴关系」。","id":"c16-o-s42","origNo":42},{"type":"multi","orig":true,"q":"人类命运共同体理念的重大意义在于（ ）","options":["超越零和博弈思维","破解全球治理困境","引领人类文明进步方向","为全球发展提供中国方案"],"answer":"A、B、C、D","explain":"人类命运共同体理念超越零和博弈思维（A），倡导合作共赢；着眼破解全球治理困境（B），回应和平、发展、安全等共同挑战；为人类文明进步提供新的方向与思路（C），强调文明平等相处；为全球发展贡献中国方案（D），推动共同发展和互利合作。四项分别从理念创新、治理回应、文明意义和发展实践说明其重要价值。教材对应「人类命运共同体理念的重要意义」。","id":"c16-o-s43","origNo":43},{"type":"multi","orig":true,"q":"新时代大国关系发展的正确方向是（ ）","options":["相互尊重","和平共处","合作共赢","对抗博弈"],"answer":"A、B、C","explain":"新时代推动大国关系向前发展，应坚持相互尊重（A），承认各国正当利益和差异；坚持和平共处（B），通过协商管控矛盾；坚持合作共赢（C），在共同利益领域扩大合作。D项对抗博弈把分歧导向阵营冲突和零和竞争，与稳定协调、良性互动的大国关系方向相反，因此不属于正确的发展方向。教材对应「推动大国关系协调合作的方向」。","id":"c16-o-s44","origNo":44},{"type":"multi","orig":true,"q":"中国坚决抵制的错误国际理念包括（ ）","options":["霸权主义、强权政治","单边主义、保护主义","阵营对抗、冷战思维","多边合作、互利共赢"],"answer":"A、B、C","explain":"中国反对以强凌弱的霸权主义、强权政治（A），反对损害开放合作的单边主义、保护主义（B），也反对人为制造集团对立的阵营对抗、冷战思维（C）。D项多边合作、互利共赢强调各国协商、共同发展，符合中国倡导的国际合作方向。题干要求选择抵制的错误理念，因此前三项属于范围，D项不属于。教材对应「反对霸权主义与冷战思维」。","id":"c16-o-s45","origNo":45},{"type":"multi","orig":true,"q":"清洁美丽世界建设的核心举措包括（ ）","options":["坚持绿色低碳发展","积极应对全球气候变化","推动全球生态治理合作","转嫁环境污染、透支生态"],"answer":"A、B、C","explain":"建设清洁美丽世界需要坚持绿色低碳发展（A），降低资源消耗与排放；积极应对全球气候变化（B），履行共同环境保护责任；加强全球生态治理合作（C），协调跨国生态问题。D项转嫁污染、透支生态将环境代价转移给他国和未来世代，违背可持续发展和共同保护地球家园的要求，不属于建设清洁美丽世界的举措。教材对应「共建清洁美丽世界」。","id":"c16-o-s46","origNo":46},{"type":"multi","orig":true,"q":"共同繁荣世界建设的内涵包括（ ）","options":["坚持普惠平衡发展","缩小南北发展差距","反对贫富分化、发展失衡","推动全球经济协同发展"],"answer":"A、B、C、D","explain":"建设共同繁荣的世界要求普惠平衡的发展（A），让发展成果更多惠及各国人民；缩小南北发展差距（B），改善发展资源和机会分配；反对贫富分化与发展失衡（C），减少结构性不平等；推进全球经济协同发展（D），通过开放合作促进共同增长。四项分别从发展理念、公平目标、突出问题和合作路径描述共同繁荣的内涵。教材对应「建设共同繁荣世界的内涵」。","id":"c16-o-s47","origNo":47},{"type":"multi","orig":true,"q":"习近平外交思想回答的重大时代课题包括（ ）","options":["新时代中国如何开展特色大国外交","新时代如何推动全球治理变革","人类社会向何处去、世界怎么了","如何推动构建人类命运共同体"],"answer":"A、B、C、D","explain":"习近平外交思想回答新时代中国如何开展中国特色大国外交（A），明确外交理念和总体布局；回应全球治理变革（B），提出国际秩序与合作主张；思考世界怎么了、人类社会向何处去（C），把握国际格局深刻变化；提出推动构建人类命运共同体的方向和路径（D）。四项从中国外交实践与全球共同挑战两个层面构成相关时代课题。教材对应「习近平外交思想回应的时代课题」。","id":"c16-o-s48","origNo":48}]},{"id":"c17","title":"第十七章 全面从严治党","note":"来源：习思想题库导出-2026-10-28（33题）。 2026-10-28题库更新补充33题。","questions":[{"type":"single","orig":true,"q":"全面从严治党，核心是______。","options":["加强党的领导","加强党的建设","加强党的纪律","加强党的作风"],"answer":"A","explain":"全面从严治党的核心是加强党的领导，A项突出党对各方面工作的领导是管党治党的根本政治保证。B项加强党的建设是全面从严治党的总体任务范围，不能代替其核心定位；C项加强纪律属于纪律建设和监督执纪要求；D项加强作风属于纠治“四风”、密切联系群众等具体任务。各项相互关联，但题干问的是“核心”。教材对应「全面从严治党的核心要求」。","id":"c17-o-s1","origNo":1},{"type":"single","orig":true,"q":"党的______是党的根本性建设，决定党的建设方向和效果。","options":["思想建设","政治建设","组织建设","作风建设"],"answer":"B","explain":"党的政治建设是党的根本性建设，决定党的建设方向和效果，B项着眼维护党中央权威和集中统一领导等根本要求。A项思想建设是党的基础性建设，重在理想信念和理论武装；C项组织建设侧重组织体系和干部队伍；D项作风建设着重党群关系和工作作风。后三项都是党的建设重要组成部分，但不属于题干所问的根本性建设。教材对应「党的政治建设的根本性地位」。","id":"c17-o-s2","origNo":2},{"type":"single","orig":true,"q":"党的______是党的基础性建设。","options":["政治建设","思想建设","组织建设","纪律建设"],"answer":"B","explain":"党的思想建设是党的基础性建设，B项强调通过理论武装、理想信念教育巩固思想根基。A项政治建设是党的根本性建设，在党的建设中居于统领地位；C项组织建设解决组织体系和干部队伍建设问题；D项纪律建设通过纪律约束保障党的团结统一。四项属于党的建设不同方面，基础性建设这一定位对应思想建设。教材对应「思想建设的基础性地位」。","id":"c17-o-s3","origNo":3},{"type":"single","orig":true,"q":"全面从严治党，要害在______。","options":["严","治","全面","管"],"answer":"B","explain":"选B。全面从严治党“基础在全面、关键在严、要害在治、核心是加强党的领导”，题干问“要害”，因此选治。A项严对应“关键”，C项全面对应“基础”，D项管不是这组规范概括中的对应表述。教材对应「全面从严治党的基本要求」。","id":"c17-o-s4","origNo":4},{"type":"single","orig":true,"q":"党的作风建设的核心问题是______。","options":["保持党同人民群众的血肉联系","反对形式主义","反对官僚主义","厉行勤俭节约"],"answer":"A","explain":"党的作风建设核心问题是保持党同人民群众的血肉联系，A项突出党群关系和人民立场。B项反对形式主义侧重纠治重形式轻实效；C项反对官僚主义侧重纠治脱离群众和脱离实际；D项厉行勤俭节约是反对享乐主义和奢靡之风等作风要求的重要内容。后三项都是改进作风的措施或表现，而非核心问题的总体概括。教材对应「作风建设与密切联系群众」。","id":"c17-o-s5","origNo":5},{"type":"single","orig":true,"q":"全面从严治党，基础在______。","options":["全面","严","治","管"],"answer":"A","explain":"全面从严治党基础在全面，A项要求管全党、治全党，覆盖各级党组织与党员，贯穿党的建设各领域。B项“严”对应关键在严，要求真管真严、敢管敢严；C项“治”对应要害在治，强调落实管党治党责任；D项“管”不是这套规范表述中用于概括基础的关键词。题干问“基础”，不能混淆全面、严和治的定位。教材对应「全面从严治党的内涵」。","id":"c17-o-s6","origNo":6},{"type":"single","orig":true,"q":"党的政治建设的首要任务是______。","options":["保证全党服从中央，坚持党中央权威和集中统一领导","坚定理想信念","严肃党内政治生活","严明党的政治纪律"],"answer":"A","explain":"保证全党服从中央，坚持党中央权威和集中统一领导，是党的政治建设首要任务，A项体现维护党的团结统一的根本要求。B项坚定理想信念是党的思想建设的首要任务；C项严肃党内政治生活是政治建设的重要内容；D项严明政治纪律为维护集中统一领导提供纪律保障。C、D同样重要，但不取代明确规定的首要任务。教材对应「党的政治建设的首要任务」。","id":"c17-o-s7","origNo":7},{"type":"single","orig":true,"q":"党的纪律建设摆在首位的是______。","options":["组织纪律","廉洁纪律","政治纪律","群众纪律"],"answer":"C","explain":"政治纪律是党最根本、最重要的纪律，在党的纪律建设中摆在首位，对应C项，直接关系党的政治方向和集中统一。A项组织纪律维护组织原则和组织秩序；B项廉洁纪律规范廉洁用权；D项群众纪律保障党员干部正确处理同人民群众的关系。后三类纪律都是党的纪律的重要方面，但首要地位属于政治纪律。教材对应「政治纪律在党的纪律体系中的地位」。","id":"c17-o-s8","origNo":8},{"type":"single","orig":true,"q":"新时代党的组织路线强调，要着力培养忠诚干净担当的______。","options":["高素质干部队伍","专业化干部队伍","年轻化干部队伍","知识型干部队伍"],"answer":"A","explain":"新时代党的组织路线强调着力培养忠诚干净担当的高素质干部队伍，A项完整表达干部队伍建设的总体质量要求。B项专业化强调履职知识和能力，C项年轻化涉及干部年龄结构，D项知识型突出知识储备。后三项可以是干部队伍建设的具体方面，却不能替代“高素质”这一覆盖政治、能力、作风等多维要求的总括表述。教材对应「新时代党的组织路线和干部队伍建设」。","id":"c17-o-s9","origNo":9},{"type":"single","orig":true,"q":"党的自我革命的重要内涵是______。","options":["自我净化、自我完善、自我革新、自我提高","自我批评、自我反省、自我约束、自我监督","自我学习、自我教育、自我改造、自我提升","自我加压、自我鞭策、自我激励、自我超越"],"answer":"A","explain":"自我净化、自我完善、自我革新、自我提高是党的自我革命的“四个自我”，A项完整概括自我革命持续解决自身问题、提高能力的内涵。B项侧重反省和监督方法，C项偏重学习教育及自我改造，D项强调激励和自我鞭策，都涉及自我改进的某些方式，但不是“四个自我”的规范表述及完整结构。教材对应「党的自我革命的四个自我」。","id":"c17-o-s10","origNo":10},{"type":"single","orig":true,"q":"党内监督的重点对象是______。","options":["党的领导机关和领导干部特别是主要领导干部","基层党员","普通干部","年轻党员"],"answer":"A","explain":"党内监督的重点对象是党的领导机关和领导干部特别是主要领导干部，A项体现抓住“关键少数”的监督要求。B项基层党员、C项普通干部、D项年轻党员也应受党内监督，但主要属于监督覆盖的不同群体，不能等同于监督重点。全面覆盖与突出领导机关、领导干部的重点监督是相互结合的两个要求。教材对应「党内监督重点对象」。","id":"c17-o-s11","origNo":11},{"type":"single","orig":true,"q":"全面从严治党，必须坚持______，一体推进不敢腐、不能腐、不想腐。","options":["标本兼治","惩防并举","综合治理","宽严相济"],"answer":"A","explain":"一体推进不敢腐、不能腐、不想腐，强调标本兼治，A项要求把严厉惩治腐败同制度约束、思想教育结合起来。B项惩防并举强调惩治和预防并重；C项综合治理突出多措并举、系统推进；D项宽严相济通常涉及政策处置的区别对待。后三项都有各自的适用语境，但题干所引三者一体推进更强调治标与治本协同。教材对应「一体推进三不腐与标本兼治」。","id":"c17-o-s12","origNo":12},{"type":"single","orig":true,"q":"党的思想建设的首要任务是______。","options":["坚定理想信念","加强理论武装","开展党性教育","强化宗旨意识"],"answer":"A","explain":"坚定理想信念是党的思想建设的首要任务，A项强调保持党员政治信仰和精神追求。B项加强理论武装是坚定理想信念的重要途径；C项开展党性教育有助于锤炼政治品格；D项强化宗旨意识要求牢记为人民服务的根本宗旨。后三项与思想建设联系紧密，但题目明确问的是首要任务的规范定位。教材对应「思想建设的首要任务」。","id":"c17-o-s13","origNo":13},{"type":"single","orig":true,"q":"党的自我革命与社会革命的关系是______。","options":["自我革命引领社会革命","社会革命决定自我革命","二者相互独立、互不相关","社会革命优先于自我革命"],"answer":"A","explain":"党的自我革命引领社会革命，A项强调通过解决党自身问题保持领导力量的先进性和战斗力，从而推动党和人民事业发展。B项把社会革命说成单向决定自我革命，忽略党的自我革命的引领作用；C项否认二者的紧密联系；D项把社会革命置于自我革命之前并作为固定优先次序，不能概括两者相互促进的关系。教材对应「自我革命与社会革命的关系」。","id":"c17-o-s14","origNo":14},{"type":"single","orig":true,"q":"全面从严治党向纵深发展，要求把______挺在前面。","options":["纪律","法律","道德","制度"],"answer":"A","explain":"把纪律挺在前面意味着坚持纪严于法、纪在法前，A项强调用党规党纪规范全体党员的行为。B项法律是国家治理的重要规范和底线，但不能替代党员应遵守的更严格党纪要求；C项道德提供价值引导，不具备纪律处分的同类约束机制；D项制度范围广泛，题干专门要求置于前端的是纪律约束。教材对应「把纪律挺在前面」。","id":"c17-o-s15","origNo":15},{"type":"single","orig":true,"q":"党的政治纪律是党最根本、最重要的纪律，其核心是______。","options":["坚持党的领导","坚持党的基本路线","维护党中央权威和集中统一领导","坚持民主集中制"],"answer":"C","explain":"维护党中央权威和集中统一领导是党的政治纪律的核心要求，C项强调党员在政治方向、政治原则和政治行动上保持统一。A项坚持党的领导是总体政治原则；B项坚持党的基本路线规定政治路线方向；D项民主集中制是党的根本组织原则。后三项与政治纪律密切相关，但不如C项准确对应题干限定的核心内容。教材对应「政治纪律与维护党中央集中统一领导」。","id":"c17-o-s16","origNo":16},{"type":"single","orig":true,"q":"新时代党的建设要以______为统领。","options":["党的政治建设","党的思想建设","党的组织建设","党的作风建设"],"answer":"A","explain":"新时代党的建设要以政治建设为统领，A项强调政治建设决定党的建设方向和效果，贯穿各方面建设。B项思想建设提供理想信念和理论基础；C项组织建设巩固组织体系并培养干部；D项作风建设着重改进党群关系和工作作风。三者都不可缺少，但党的建设总体布局明确由政治建设发挥统领作用。教材对应「以党的政治建设为统领」。","id":"c17-o-s17","origNo":17},{"type":"single","orig":true,"q":"全面从严治党，必须坚持严的基调、严的措施、严的氛围，其根本目的是______。","options":["保持党的先进性和纯洁性","提高党的执政能力","巩固党的执政地位","增强党的创造力凝聚力战斗力"],"answer":"A","explain":"保持党的先进性和纯洁性是全面从严治党的重要根本要求，A项强调防止党在长期执政过程中失去理想信念、宗旨和政治本色。B项提高执政能力着重领导水平和履职本领；C项巩固执政地位侧重执政基础与政治结果；D项增强创造力凝聚力战斗力体现组织建设与管党治党的实际成效。各项相互关联，但题干所指向的根本价值要求由A项概括。教材对应「全面从严治党的根本要求」。","id":"c17-o-s18","origNo":18},{"type":"multi","orig":true,"q":"全面从严治党的基本要求包括______。","options":["基础在全面","关键在严","要害在治","核心在加强党的领导"],"answer":"A、B、C、D","explain":"全面从严治党的基本要求概括为核心是加强党的领导、基础在全面、关键在严、要害在治，因此A、B、C、D分别对应这四个方面，均正确。教材对应「全面从严治党的基本内涵」。","id":"c17-o-s19","origNo":19},{"type":"multi","orig":true,"q":"新时代党的建设总要求中，党的建设的总体布局包括______。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":"A、B、C、D","explain":"新时代党的建设总体布局包括政治建设（A）、思想建设（B）、组织建设（C）和作风建设（D），分别保障政治方向、思想基础、组织力量与优良作风。完整布局还包括纪律建设，并把制度建设贯穿其中、深入推进反腐败斗争；题干只要求从列出的项目中选择属于总体布局的内容，因此A、B、C、D均应选，不代表总体布局只有这四项。教材对应「新时代党的建设总体布局」。","id":"c17-o-s20","origNo":20},{"type":"multi","orig":true,"q":"党的自我革命的内涵包括______。","options":["自我净化","自我完善","自我革新","自我提高"],"answer":"A、B、C、D","explain":"党的自我革命强调自我净化（A），清除影响党的先进性纯洁性的消极因素；自我完善（B），修补制度和组织运行中的不足；自我革新（C），主动适应形势变化并推动改革；自我提高（D），增强领导能力与执政本领。“四个自我”从清除问题、弥补缺陷到改进提升相互衔接，四项均属于题干所问的内涵。教材对应「党的自我革命的四个自我」。","id":"c17-o-s21","origNo":21},{"type":"multi","orig":true,"q":"党的纪律主要包括______。","options":["政治纪律","组织纪律","廉洁纪律","群众纪律"],"answer":"A、B、C、D","explain":"党的纪律体系包括政治纪律（A）、组织纪律（B）、廉洁纪律（C）和群众纪律（D）。政治纪律维护政治方向与统一，组织纪律规范组织关系，廉洁纪律规范权力行使，群众纪律维护群众利益。完整的六项纪律还包括工作纪律、生活纪律；题干问“主要包括”，所列四项均是真实纪律类别，因此应全选。教材对应「党的六项纪律及其作用」。","id":"c17-o-s22","origNo":22},{"type":"multi","orig":true,"q":"党内政治生活的基本规范包括______。","options":["实事求是","理论联系实际","密切联系群众","批评和自我批评"],"answer":"A、B、C、D","explain":"党内政治生活要求实事求是（A），坚持从实际出发；理论联系实际（B），把理论要求落实到实际工作；密切联系群众（C），维护党的群众路线；批评和自我批评（D），通过党内监督与思想交流发现和改正问题。四项都是党的优良传统、作风与严肃党内政治生活的重要规范，并非互斥选项，应共同选择。教材对应「严肃党内政治生活的基本规范」。","id":"c17-o-s23","origNo":23},{"type":"multi","orig":true,"q":"全面从严治党，必须坚持______。","options":["思想建党和制度治党同向发力","依规治党与以德治党相结合","严管与厚爱相结合","激励与约束并重"],"answer":"A、B、C、D","explain":"全面从严治党要求思想建党与制度治党同向发力（A），将思想教育和制度约束结合；依规治党与以德治党相结合（B），同时注重纪律规则和道德引导；严管与厚爱相结合（C），把严格监督同关心干部结合；激励与约束并重（D），促使党员干部担当作为。四项从思想、制度、教育和干部管理层面说明综合施策的要求。教材对应「全面从严治党的方法要求」。","id":"c17-o-s24","origNo":24},{"type":"multi","orig":true,"q":"新时代党的组织路线强调，要建设______的干部队伍。","options":["忠诚","干净","担当","高学历"],"answer":"A、B、C","explain":"忠诚、干净、担当是新时代高素质干部队伍建设的重要要求。A项忠诚强调政治品格与信念坚定；B项干净强调廉洁自律和正确用权；C项担当强调敢于负责、积极作为。D项高学历可能是部分岗位的知识条件，但不能作为衡量所有干部政治品格、廉洁品质和担当精神的统一标准，不属于这组三项要求。教材对应「忠诚干净担当的干部队伍建设」。","id":"c17-o-s25","origNo":25},{"type":"multi","orig":true,"q":"党的作风建设要重点纠治的“四风”问题包括______。","options":["形式主义","官僚主义","享乐主义","奢靡之风"],"answer":"A、B、C、D","explain":"党的作风建设所说的“四风”包括形式主义（A）、官僚主义（B）、享乐主义（C）和奢靡之风（D）。形式主义重形式轻实效，官僚主义表现为脱离实际和群众，享乐主义追求安逸并缺乏担当，奢靡之风体现铺张浪费等不良习气。四项是作风整治的完整分类，不应把其中任一项排除。教材对应「纠治四风与党的作风建设」。","id":"c17-o-s26","origNo":26},{"type":"multi","orig":true,"q":"一体推进不敢腐、不能腐、不想腐，其中______。","options":["不敢腐侧重惩治和震慑","不能腐侧重制度和监督","不想腐侧重教育和自律","三者相互独立、互不关联"],"answer":"A、B、C","explain":"一体推进不敢腐、不能腐、不想腐，A项“不敢腐”通过惩治形成震慑，B项“不能腐”依靠制度约束和监督制约权力，C项“不想腐”通过思想教育与廉洁文化增强自觉。D项把三者说成相互独立，忽略惩治、制度和教育协同推进的关系。三者各有侧重但相互促进，缺少任何一环都难以形成持久的反腐效果。教材对应「一体推进不敢腐不能腐不想腐」。","id":"c17-o-s27","origNo":27},{"type":"multi","orig":true,"q":"党内监督的主要形式包括______。","options":["党内巡视","民主生活会","组织生活会","述职述廉"],"answer":"A、B、C、D","explain":"党内监督可以通过巡视巡察（A）发现和推动纠治问题，通过民主生活会（B）进行领导班子内部监督，通过组织生活会（C）落实党支部和党员日常监督，通过述职述廉（D）公开报告履职与廉洁情况。四项具有不同的开展层级、程序和监督侧重点，但都是党内监督工作的重要方式，均属于题干所问范围。教材对应「党内监督的具体形式」。","id":"c17-o-s28","origNo":28},{"type":"multi","orig":true,"q":"全面从严治党向纵深发展，需要正确处理的关系包括______。","options":["思想建党与制度治党的关系","依规治党与以德治党的关系","严管与厚爱的关系","自我革命与社会革命的关系"],"answer":"A、B、C、D","explain":"推动全面从严治党向纵深发展，应正确处理思想建党与制度治党的关系（A），把思想引导和制度约束贯通；依规治党与以德治党的关系（B），协同发挥规则和道德作用；严管与厚爱的关系（C），做到监督约束与关心激励并重；自我革命与社会革命的关系（D），以自我革命引领社会革命。四组关系分别对应治党方法、干部管理和党的使命实践。教材对应「全面从严治党需处理的重要关系」。","id":"c17-o-s29","origNo":29},{"type":"multi","orig":true,"q":"新时代党的建设总要求中，党的建设的主线是______。","options":["加强党的长期执政能力建设","加强党的先进性和纯洁性建设","加强党的全面领导","全面从严治党"],"answer":"A、B","explain":"新时代党的建设总要求以加强党的长期执政能力建设、先进性和纯洁性建设为主线，因此A、B共同构成主线。C“加强党的全面领导”是总要求的政治方向，D“全面从严治党”是贯穿党的建设的主题，不是此处所指的主线。教材对应「新时代党的建设总要求」。","id":"c17-o-s30","origNo":30},{"type":"multi","orig":true,"q":"党的政治建设摆在首位，其具体内容包括______。","options":["保证全党服从中央","严明政治纪律和政治规矩","严肃党内政治生活","发展党内民主"],"answer":"A、B、C、D","explain":"把党的政治建设摆在首位，要求保证全党服从中央（A），维护党中央权威和集中统一领导；严明政治纪律与政治规矩（B），规范政治行为；严肃党内政治生活（C），增强政治性、时代性、原则性和战斗性；发展党内民主（D），保障党员参与并落实民主集中制。四项均属于政治建设及健康党内政治生活的有关要求。教材对应「党的政治建设的主要任务」。","id":"c17-o-s31","origNo":31},{"type":"multi","orig":true,"q":"关于党的自我革命，下列说法正确的有______。","options":["自我革命是党跳出历史周期率的第二个答案","自我革命是党永葆生机活力的强大支撑","自我革命与社会革命相互促进","自我革命是党独有的政治品格"],"answer":"A、B、C、D","explain":"党的自我革命是跳出历史周期率的第二个答案（A），强调依靠自身不断纠偏；是党保持生机活力的重要支撑（B），有助于克服长期执政考验；与社会革命相互促进（C），通过党的自身建设引领社会变革；体现党勇于刀刃向内的政治品格（D）。四项从历史意义、实践作用、社会革命关系和政治特征说明自我革命的重要性。教材对应「党的自我革命的意义与特点」。","id":"c17-o-s32","origNo":32},{"type":"multi","orig":true,"q":"全面从严治党，必须坚持严的基调，具体体现在______。","options":["严明党的纪律","严格党内监督","严肃党内政治生活","严厉惩治腐败"],"answer":"A、B、C、D","explain":"坚持全面从严治党严的基调，体现在严明党的纪律（A），划清纪律底线；严格党内监督（B），及时发现纠正问题；严肃党内政治生活（C），增强组织生活的政治性和原则性；严厉惩治腐败（D），维护纪律法律权威。四项从纪律、监督、政治生活和反腐败实践不同方面落实严的要求，均属于题干范围。教材对应「全面从严治党的严的基调」。","id":"c17-o-s33","origNo":33}]},{"id":"z1","title":"专题一 党的二十大新观点新论断新思想","note":"本专题题目依据《二十大新观点新论断新思想》PPT 编写。","questions":[{"id":"z1-s1","type":"single","orig":false,"origNo":1,"q":"党的二十大报告指出，中国共产党已走过百年奋斗历程，全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必（ ）。","options":["敢于斗争、善于斗争","自力更生、发愤图强","解放思想、实事求是","与时俱进、求真务实"],"answer":"A","explain":"党的二十大报告提出“三个务必”：务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。"},{"id":"z1-s2","type":"single","orig":false,"origNo":2,"q":"经过不懈努力，党找到了跳出治乱兴衰历史周期率的第二个答案，这就是（ ）。","options":["自我革命","民主监督","全面从严治党","群众路线"],"answer":"A","explain":"党的二十大报告指出，党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。"},{"id":"z1-s3","type":"single","orig":false,"origNo":3,"q":"党的二十大报告指出，中国共产党为什么能，中国特色社会主义为什么好，归根到底是（ ）。","options":["马克思主义行，是中国化时代化的马克思主义行","中国共产党领导好","社会主义制度好","中国人民团结奋斗"],"answer":"A","explain":"归根到底是马克思主义行，是中国化时代化的马克思主义行。拥有马克思主义科学理论指导是我们党坚定信仰信念、把握历史主动的根本所在。"},{"id":"z1-s4","type":"single","orig":false,"origNo":4,"q":"党的二十大报告指出，从现在起，中国共产党的中心任务是（ ）。","options":["团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴","全面建成小康社会","基本实现社会主义现代化","实现全体人民共同富裕"],"answer":"A","explain":"从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"id":"z1-s5","type":"single","orig":false,"origNo":5,"q":"全面建设社会主义现代化国家的首要任务是（ ）。","options":["高质量发展","创新驱动发展","乡村振兴","共同富裕"],"answer":"A","explain":"高质量发展是全面建设社会主义现代化国家的首要任务，发展是党执政兴国的第一要务。"},{"id":"z1-s6","type":"single","orig":false,"origNo":6,"q":"人民民主是社会主义的生命，是全面建设社会主义现代化国家的（ ）。","options":["应有之义","本质要求","内在要求","根本保证"],"answer":"A","explain":"人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义；全过程人民民主是社会主义民主政治的本质属性。"},{"id":"z1-s7","type":"single","orig":false,"origNo":7,"q":"全过程人民民主是社会主义民主政治的本质属性，是（ ）的民主。","options":["最广泛、最真实、最管用","最直接、最全面、最有效","最彻底、最完备、最科学","最民主、最自由、最公正"],"answer":"A","explain":"全过程人民民主是最广泛、最真实、最管用的民主，是社会主义民主政治的本质属性。"},{"id":"z1-s8","type":"single","orig":false,"origNo":8,"q":"为民造福是立党为公、执政为民的（ ）。","options":["本质要求","根本宗旨","核心价值","最高追求"],"answer":"A","explain":"江山就是人民，人民就是江山。为民造福是立党为公、执政为民的本质要求。"},{"id":"z1-s9","type":"single","orig":false,"origNo":9,"q":"尊重自然、顺应自然、保护自然，是全面建设社会主义现代化国家的（ ）。","options":["内在要求","基本方略","重要保障","战略支撑"],"answer":"A","explain":"必须牢固树立和践行绿水青山就是金山银山的理念，站在人与自然和谐共生的高度谋划发展，尊重自然、顺应自然、保护自然是全面建设社会主义现代化国家的内在要求。"},{"id":"z1-s10","type":"single","orig":false,"origNo":10,"q":"国家安全是民族复兴的（ ），社会稳定是国家强盛的（ ）。","options":["根基；前提","基础；保障","保障；根基","前提；基础"],"answer":"A","explain":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提。必须坚定不移贯彻总体国家安全观。"},{"id":"z1-s11","type":"single","orig":false,"origNo":11,"q":"如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的（ ）。","options":["战略要求","根本任务","重要保障","基础工程"],"answer":"A","explain":"如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。"},{"id":"z1-s12","type":"single","orig":false,"origNo":12,"q":"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的（ ）。","options":["最佳制度安排","唯一制度安排","基本制度安排","临时制度安排"],"answer":"A","explain":"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排，必须长期坚持。"},{"id":"z1-s13","type":"single","orig":false,"origNo":13,"q":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在（ ）。","options":["党","人民","法治","科技"],"answer":"A","explain":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党，必须深入推进新时代党的建设新的伟大工程。"},{"id":"z1-s14","type":"single","orig":false,"origNo":14,"q":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；团结奋斗是中国人民创造历史伟业的必由之路；贯彻新发展理念是新时代我国发展壮大的必由之路；（ ）是党永葆生机活力、走好新的赶考之路的必由之路。","options":["全面从严治党","全面依法治国","全面深化改革","全过程人民民主"],"answer":"A","explain":"五个“必由之路”之一：全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。"},{"id":"z1-s15","type":"single","orig":false,"origNo":15,"q":"科技是第一生产力、人才是第一资源、（ ）是第一动力。","options":["创新","改革","教育","开放"],"answer":"A","explain":"党的二十大报告强调，必须坚持科技是第一生产力、人才是第一资源、创新是第一动力，深入实施科教兴国战略、人才强国战略、创新驱动发展战略。"},{"id":"z1-m1","type":"multi","orig":false,"origNo":1,"q":"党的二十大报告提出的“三个务必”包括（ ）。","options":["务必不忘初心、牢记使命","务必谦虚谨慎、艰苦奋斗","务必敢于斗争、善于斗争","务必自信自强、守正创新"],"answer":"ABC","explain":"“三个务必”即务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。"},{"id":"z1-m2","type":"multi","orig":false,"origNo":2,"q":"十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事，包括（ ）。","options":["迎来中国共产党成立一百周年","中国特色社会主义进入新时代","完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标","基本实现社会主义现代化"],"answer":"ABC","explain":"三件大事：迎来中国共产党成立一百周年；中国特色社会主义进入新时代；完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。"},{"id":"z1-m3","type":"multi","orig":false,"origNo":3,"q":"党的二十大报告指出，前进道路上必须牢牢把握的重大原则包括（ ）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放、坚持发扬斗争精神"],"answer":"ABCD","explain":"五项重大原则即坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。"},{"id":"z1-m4","type":"multi","orig":false,"origNo":4,"q":"党的二十大报告强调的五个“必由之路”包括（ ）。","options":["坚持党的全面领导是坚持和发展中国特色社会主义的必由之路","中国特色社会主义是实现中华民族伟大复兴的必由之路，团结奋斗是中国人民创造历史伟业的必由之路","贯彻新发展理念是新时代我国发展壮大的必由之路","全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路"],"answer":"ABCD","explain":"五个“必由之路”是我们在长期实践中得出的至关紧要的规律性认识，必须倍加珍惜、始终坚持。"},{"id":"z1-m5","type":"multi","orig":false,"origNo":5,"q":"全面建设社会主义现代化国家的基础性、战略性支撑是（ ）。","options":["教育","科技","人才","法治"],"answer":"ABC","explain":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑，必须坚持科技是第一生产力、人才是第一资源、创新是第一动力。"},{"id":"z1-m6","type":"multi","orig":false,"origNo":6,"q":"党的二十大报告指出，必须坚持中国特色社会主义文化发展道路，围绕（ ）建设社会主义文化强国。","options":["举旗帜","聚民心、育新人","兴文化","展形象"],"answer":"ABCD","explain":"围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国，激发全民族文化创新创造活力。"},{"id":"z1-f1","type":"fill","orig":false,"origNo":1,"q":"党的二十大报告提出“三个务必”：务必____、牢记使命，务必谦虚谨慎、____，务必敢于斗争、善于斗争。","options":[],"answer":["不忘初心；艰苦奋斗"],"explain":"“三个务必”。"},{"id":"z1-f2","type":"fill","orig":false,"origNo":2,"q":"党找到了____这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、____。","options":[],"answer":["自我革命；不变味"],"explain":"自我革命是跳出历史周期率的第二个答案。"},{"id":"z1-f3","type":"fill","orig":false,"origNo":3,"q":"从现在起，中国共产党的中心任务是团结带领全国各族人民全面建成____强国、实现____奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","options":[],"answer":["社会主义现代化；第二个百年"],"explain":"党的中心任务。"},{"id":"z1-f4","type":"fill","orig":false,"origNo":4,"q":"高质量发展是全面建设社会主义现代化国家的____任务。","options":[],"answer":["首要"],"explain":"高质量发展是首要任务。"},{"id":"z1-f5","type":"fill","orig":false,"origNo":5,"q":"____是社会主义民主政治的本质属性，是____、最真实、最管用的民主。","options":[],"answer":["全过程人民民主；最广泛"],"explain":"全过程人民民主。"},{"id":"z1-f6","type":"fill","orig":false,"origNo":6,"q":"国家安全是民族复兴的____，社会稳定是国家强盛的____。","options":[],"answer":["根基；前提"],"explain":"国家安全与社会稳定的定位。"},{"id":"z1-f7","type":"fill","orig":false,"origNo":7,"q":"全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在____。","options":[],"answer":["党"],"explain":"关键在党。"},{"id":"z1-f8","type":"fill","orig":false,"origNo":8,"q":"五个“必由之路”：坚持____是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；____是中国人民创造历史伟业的必由之路；贯彻____是新时代我国发展壮大的必由之路；全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","options":[],"answer":["党的全面领导；团结奋斗；新发展理念"],"explain":"五个“必由之路”。"}]},{"id":"z2","title":"专题二 党的二十届三中全会精神","note":"本专题题目依据《党的二十届三中全会公报要点学习》PPT 编写。","questions":[{"id":"z2-s1","type":"single","orig":false,"origNo":1,"q":"中国共产党第二十届中央委员会第三次全体会议于（ ）在北京举行。","options":["2024年7月15日至18日","2023年10月15日至18日","2025年7月15日至18日","2024年10月15日至18日"],"answer":"A","explain":"党的二十届三中全会于2024年7月15日至18日在北京举行。"},{"id":"z2-s2","type":"single","orig":false,"origNo":2,"q":"党的二十届三中全会审议通过了（ ）。","options":["《中共中央关于进一步全面深化改革、推进中国式现代化的决定》","《中共中央关于坚持和完善中国特色社会主义制度的决定》","《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","《中共中央关于全面推进依法治国若干重大问题的决定》"],"answer":"A","explain":"全会审议通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。"},{"id":"z2-s3","type":"single","orig":false,"origNo":3,"q":"全会认为，当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的（ ）。","options":["关键时期","起步阶段","攻坚阶段","决胜阶段"],"answer":"A","explain":"全会认为，当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。"},{"id":"z2-s4","type":"single","orig":false,"origNo":4,"q":"中国式现代化是在（ ）中不断推进的，也必将在（ ）中开辟广阔前景。","options":["改革开放；改革开放","实践探索；实践探索","自我革命；自我革命","创新驱动；创新驱动"],"answer":"A","explain":"中国式现代化是在改革开放中不断推进的，也必将在改革开放中开辟广阔前景。必须自觉把改革摆在更加突出位置。"},{"id":"z2-s5","type":"single","orig":false,"origNo":5,"q":"进一步全面深化改革，必须以（ ）为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点。","options":["经济体制改革","政治体制改革","文化体制改革","生态文明体制改革"],"answer":"A","explain":"全会强调，以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点，为中国式现代化提供强大动力和制度保障。"},{"id":"z2-s6","type":"single","orig":false,"origNo":6,"q":"全会提出，必须更好发挥市场机制作用，实现资源配置效率最优化和效益最大化，既“放得活”又“（ ）”。","options":["管得住","管得严","放得开","控得住"],"answer":"A","explain":"既“放得活”又“管得住”，更好维护市场秩序、弥补市场失灵，畅通国民经济循环。"},{"id":"z2-s7","type":"single","orig":false,"origNo":7,"q":"全会提出，必须以（ ）引领改革，立足新发展阶段，深化供给侧结构性改革。","options":["新发展理念","高质量发展","新质生产力","科技创新"],"answer":"A","explain":"必须以新发展理念引领改革，健全因地制宜发展新质生产力体制机制。"},{"id":"z2-s8","type":"single","orig":false,"origNo":8,"q":"全会提出，开放是中国式现代化的（ ）。","options":["鲜明标识","根本保证","本质要求","重要基础"],"answer":"A","explain":"开放是中国式现代化的鲜明标识，必须坚持对外开放基本国策，坚持以开放促改革。"},{"id":"z2-s9","type":"single","orig":false,"origNo":9,"q":"全会提出，发展全过程人民民主是中国式现代化的（ ）。","options":["本质要求","重要保障","鲜明标识","战略支撑"],"answer":"A","explain":"发展全过程人民民主是中国式现代化的本质要求，必须加强人民当家作主制度建设。"},{"id":"z2-s10","type":"single","orig":false,"origNo":10,"q":"全会提出，法治是中国式现代化的（ ）。","options":["重要保障","根本要求","内在动力","制度基础"],"answer":"A","explain":"法治是中国式现代化的重要保障，必须全面贯彻实施宪法，协同推进立法、执法、司法、守法各环节改革。"},{"id":"z2-s11","type":"single","orig":false,"origNo":11,"q":"全会提出，在发展中保障和改善民生是中国式现代化的（ ）。","options":["重大任务","根本目标","首要前提","基本要求"],"answer":"A","explain":"在发展中保障和改善民生是中国式现代化的重大任务，必须坚持尽力而为、量力而行。"},{"id":"z2-s12","type":"single","orig":false,"origNo":12,"q":"全会提出，国家安全是中国式现代化行稳致远的（ ）。","options":["重要基础","根本保障","战略前提","核心支撑"],"answer":"A","explain":"国家安全是中国式现代化行稳致远的重要基础，必须全面贯彻总体国家安全观。"},{"id":"z2-s13","type":"single","orig":false,"origNo":13,"q":"全会提出，国防和军队现代化是中国式现代化的（ ）。","options":["重要组成部分","根本保证","战略要求","基础条件"],"answer":"A","explain":"国防和军队现代化是中国式现代化的重要组成部分，必须坚持党对人民军队的绝对领导。"},{"id":"z2-s14","type":"single","orig":false,"origNo":14,"q":"全会强调，（ ）是进一步全面深化改革、推进中国式现代化的根本保证。","options":["党的领导","人民民主","依法治国","制度完善"],"answer":"A","explain":"党的领导是进一步全面深化改革、推进中国式现代化的根本保证，必须深刻领悟“两个确立”的决定性意义。"},{"id":"z2-s15","type":"single","orig":false,"origNo":15,"q":"全会提出，中国式现代化是走和平发展道路的现代化，必须坚定奉行独立自主的和平外交政策，推动构建（ ）。","options":["人类命运共同体","新型国际关系","开放型世界经济","全球治理体系"],"answer":"A","explain":"必须坚定奉行独立自主的和平外交政策，推动构建人类命运共同体，践行全人类共同价值，落实全球发展倡议、全球安全倡议、全球文明倡议。"},{"id":"z2-m1","type":"multi","orig":false,"origNo":1,"q":"进一步全面深化改革，必须贯彻的原则包括（ ）。","options":["坚持党的全面领导","坚持以人民为中心，坚持守正创新","坚持以制度建设为主线","坚持全面依法治国，坚持系统观念"],"answer":"ABCD","explain":"进一步全面深化改革必须贯彻“六个坚持”原则：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。"},{"id":"z2-m2","type":"multi","orig":false,"origNo":2,"q":"全会提出，要毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展，保证各种所有制经济（ ）。","options":["依法平等使用生产要素","公平参与市场竞争","同等受到法律保护","优势互补、共同发展"],"answer":"ABCD","explain":"“两个毫不动摇”是构建高水平社会主义市场经济体制的重要要求。"},{"id":"z2-m3","type":"multi","orig":false,"origNo":3,"q":"全会提出，要构建全国统一大市场，完善市场经济基础制度，包括（ ）等改革部署。","options":["健全因地制宜发展新质生产力体制机制","健全促进实体经济和数字经济深度融合制度","健全提升产业链供应链韧性和安全水平制度","完善实施区域协调发展战略机制"],"answer":"ABCD","explain":"《决定》围绕构建高水平社会主义市场经济体制、推动高质量发展作出一系列体制机制改革部署。"},{"id":"z2-m4","type":"multi","orig":false,"origNo":4,"q":"全会提出，要统筹推进教育科技人才体制机制一体改革，包括（ ）。","options":["深化教育综合改革","深化科技体制改革","深化人才发展体制机制改革","健全新型举国体制，提升国家创新体系整体效能"],"answer":"ABCD","explain":"必须深入实施科教兴国战略、人才强国战略、创新驱动发展战略，统筹推进教育科技人才体制机制一体改革。"},{"id":"z2-m5","type":"multi","orig":false,"origNo":5,"q":"全会强调，学习好贯彻好全会精神，要深刻领会和把握进一步全面深化改革的（ ）。","options":["主题","重大原则","重大举措","根本保证"],"answer":"ABCD","explain":"要深刻领会和把握进一步全面深化改革的主题、重大原则、重大举措、根本保证，把改革战略部署转化为推进中国式现代化的强大力量。"},{"id":"z2-m6","type":"multi","orig":false,"origNo":6,"q":"全会强调，必须坚持党中央对进一步全面深化改革的集中统一领导，深化党的建设制度改革，深入推进党风廉政建设和反腐败斗争，以钉钉子精神抓好改革落实，不断推进党的（ ）。","options":["自我净化","自我完善","自我革新","自我提高"],"answer":"ABCD","explain":"坚持用改革精神和严的标准管党治党，完善党的自我革命制度规范体系，不断推进党的自我净化、自我完善、自我革新、自我提高。"},{"id":"z2-f1","type":"fill","orig":false,"origNo":1,"q":"党的二十届三中全会于____年7月15日至18日在北京举行，审议通过了《中共中央关于____的决定》。","options":[],"answer":["2024；进一步全面深化改革、推进中国式现代化"],"explain":"二十届三中全会基本情况。"},{"id":"z2-f2","type":"fill","orig":false,"origNo":2,"q":"进一步全面深化改革的总目标是继续完善和发展____制度，推进____现代化。","options":[],"answer":["中国特色社会主义；国家治理体系和治理能力"],"explain":"进一步全面深化改革总目标。"},{"id":"z2-f3","type":"fill","orig":false,"origNo":3,"q":"进一步全面深化改革以____为牵引，以促进社会公平正义、____为出发点和落脚点。","options":[],"answer":["经济体制改革；增进人民福祉"],"explain":"《决定》总体思路。"},{"id":"z2-f4","type":"fill","orig":false,"origNo":4,"q":"全会提出，开放是中国式现代化的____，法治是中国式现代化的____，国家安全是中国式现代化行稳致远的____，党的领导是进一步全面深化改革、推进中国式现代化的____。","options":[],"answer":["鲜明标识；重要保障；重要基础；根本保证"],"explain":"二十届三中全会重要论断。"},{"id":"z2-f5","type":"fill","orig":false,"origNo":5,"q":"全会提出，发展全过程人民民主是中国式现代化的____，在发展中保障和改善民生是中国式现代化的____，国防和军队现代化是中国式现代化的____。","options":[],"answer":["本质要求；重大任务；重要组成部分"],"explain":"二十届三中全会重要论断。"},{"id":"z2-f6","type":"fill","orig":false,"origNo":6,"q":"进一步全面深化改革必须贯彻的“六个坚持”原则：坚持党的全面领导、坚持以人民为中心、坚持____、坚持以制度建设为主线、坚持全面依法治国、坚持____。","options":[],"answer":["守正创新；系统观念"],"explain":"“六个坚持”原则。"},{"id":"z2-f7","type":"fill","orig":false,"origNo":7,"q":"《决定》提出“七个聚焦”：聚焦构建____市场经济体制、聚焦发展____、聚焦建设社会主义文化强国、聚焦提高人民生活品质、聚焦建设美丽中国、聚焦建设更高水平____、聚焦提高党的领导水平和长期执政能力。","options":[],"answer":["高水平社会主义；全过程人民民主；平安中国"],"explain":"“七个聚焦”。"}]}]};
const OUTLINE = [{"title":"第一章 新时代坚持和发展中国特色社会主义","groups":[["一、新时代的历史方位",["中国特色社会主义进入新时代，这是我国发展新的历史方位。","“三个意味着”：意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃；意味着科学社会主义在二十一世纪的中国焕发出强大生机活力；意味着中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案。"]],["二、社会主要矛盾（变与不变）",["新时代我国社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾（党的十九大论断）。","“两个没有变”：我国仍处于并将长期处于社会主义初级阶段的基本国情没有变；我国是世界最大发展中国家的国际地位没有变。","主要矛盾变化是关系全局的历史性变化，但属于初级阶段内部的阶段性变化。"]],["三、总任务与总依据",["总任务：实现社会主义现代化和中华民族伟大复兴。","总依据：社会主义初级阶段。","总布局：统筹推进“五位一体”总体布局。","战略布局：协调推进“四个全面”战略布局（全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党）。"]],["四、党的基本路线",["核心内容“一个中心、两个基本点”：以经济建设为中心，坚持四项基本原则（立国之本）、坚持改革开放（强国之路）。","基本路线是党和国家的生命线、人民的幸福线；奋斗目标是把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。"]],["五、科学体系“四个层次”",["“十个明确”：核心内容，回答坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题。","“十四个坚持”：基本方略。","“十三个方面成就”：实践成果。","“六个必须坚持”：世界观和方法论（人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下）。","“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。"]],["六、政治要求",["“两个确立”：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。","“两个维护”：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","“四个意识”：政治意识、大局意识、核心意识、看齐意识。","“四个自信”：道路自信、理论自信、制度自信、文化自信。"]],["七、记忆口诀",["一个中心、两个基本点，基本路线生命线；五位一体总布局（经济根本、政治保证、文化灵魂、社会条件、生态基础）；四个全面施工图（目标、动力、保障、保证）；两个确立护核心，两个维护不动摇。"]]]},{"title":"第二章 以中国式现代化全面推进中华民族伟大复兴","groups":[["一、中国梦",["本质：国家富强、民族振兴、人民幸福。","实现路径：走中国道路（中国特色社会主义道路）、弘扬中国精神（民族精神＋时代精神）、凝聚中国力量。","中国梦是国家的梦、民族的梦，也是每一个中国人的梦；归根到底是人民的梦。"]],["二、“两步走”战略安排",["到 2035 年：基本实现社会主义现代化。","到本世纪中叶：建成富强民主文明和谐美丽的社会主义现代化强国。","全面建成小康社会实现第一个百年奋斗目标后，开启全面建设社会主义现代化国家新征程（从解决“有没有”转向解决“好不好”）。"]],["三、中国式现代化",["定性：中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。","五个特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。","本质要求（九条）：坚持中国共产党领导、坚持中国特色社会主义、实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生、推动构建人类命运共同体、创造人类文明新形态。","首要任务：高质量发展。","发展过程：“并联式”（四化叠加）而非“串联式”。"]],["四、推进中国式现代化的保障",["五个重大原则：坚持和加强党的全面领导（首位）、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","六对重大关系：顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放。","创造人类文明新形态：五大文明协调发展，打破“现代化＝西方化”迷思，为发展中国家提供全新选择。"]],["五、“四个伟大”",["伟大梦想（目标）、伟大斗争（手段）、伟大事业（路径）、伟大工程（保证，起决定性作用，指党的建设新的伟大工程）。"]],["六、记忆口诀",["中国梦三本质（国家富强、民族振兴、人民幸福）；两步走到 2035 基本现代化、本世纪中叶成强国；五特九要六关系；并联式发展提质量。"]]]},{"title":"第三章 习近平党建思想","groups":[["一、时代课题与总要求、总目标",["时代课题：建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","总要求：“5＋2”总体布局——政治、思想、组织、作风、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争；核心是提高党的建设质量。","总目标：始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。"]],["二、党的建设各项建设定位",["根本原则：坚持和加强党的全面领导。","政治建设是根本性建设（统领，决定方向和效果）；全面从严治党首先要从政治上看。","思想建设是基础性建设；首要任务：坚定理想信念（共产党人精神上的“钙”）。","组织路线重点：以组织体系建设为重点，培养忠诚干净担当的高素质干部队伍。","作风建设核心问题：保持党同人民群众的血肉联系；反对“四风”（形式主义、官僚主义、享乐主义、奢靡之风）。","纪律建设：政治纪律是最根本、最重要的纪律；重点强化政治纪律和组织纪律。","党章是党的根本大法；抓住领导干部这个“关键少数”。"]],["三、全面从严治党",["核心：加强党的领导；基础在全面，关键在严，要害在治。","“真管真严、敢管敢严、长管长严”。","反腐败：坚持无禁区、全覆盖、零容忍；重遏制、强高压、长震慑；一体推进不敢腐、不能腐、不想腐。"]],["四、风险考验与自我革命",["“四大考验”：执政考验、改革开放考验、市场经济考验、外部环境考验。","“四种危险”：精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险。","跳出历史周期率的两个答案：第一个（毛泽东）——“让人民来监督政府”；第二个（新时代）——自我革命，确保党永远不变质、不变色、不变味。","全面从严治党永远在路上，党的自我革命永远在路上；以党的自我革命引领社会革命。"]],["五、记忆口诀",["党建 5＋2，政治是统领、思想是基础、作风连群众、纪律守政治；四个意识四个自信两个维护；四大考验四种危险要牢记；第二个答案叫自我革命。"]]]},{"title":"第四章 坚持以人民为中心","groups":[["一、人民的历史地位与根本立场",["人民是历史的创造者，是决定党和国家前途命运的根本力量；人民立场是中国共产党的根本政治立场，是马克思主义政党区别于其他政党的显著标志。","为什么人的问题，是检验一个政党、一个政权性质的试金石。","党的一切工作必须以最广大人民根本利益为最高标准；人民是党的工作的最高裁决者和最终评判者（“人民是阅卷人”）。"]],["二、坚持人民主体地位",["人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。","全过程人民民主是社会主义民主政治的本质属性，涵盖民主选举、民主协商、民主决策、民主管理、民主监督五大环节。","“江山就是人民，人民就是江山”：党与人民生死与共、休戚与共，党的执政基础在人民。"]],["三、以人民为中心的发展思想",["发展为了人民（目的）、发展依靠人民（动力）、发展成果由人民共享（归宿），“三个发展”有机统一。","首先要回答“发展为了谁、依靠谁、成果由谁共享”这一根本问题；衡量发展成效的最终标准是人民生活是否改善。","“我将无我，不负人民”体现全心全意为人民服务的根本宗旨；保障和改善民生坚持尽力而为、量力而行。","建设平安中国是坚持以人民为中心在国家安全领域的生动体现；“人民至上、生命至上”是其价值追求。"]],["四、共同富裕",["共同富裕是中国特色社会主义的本质要求，是物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义（不是同步富裕、同等富裕）。","推进共同富裕要处理好效率与公平、先富与共富、物质富裕与精神富足、城市与乡村等重大关系。","从“脱贫攻坚”到“乡村振兴”的战略衔接，体现党始终把解决好“三农”问题作为全党工作重中之重。"]],["五、群众路线",["群众路线是党的生命线和根本工作路线：一切为了群众、一切依靠群众，从群众中来、到群众中去。","走好新时代群众路线：深入基层调查研究，运用网络了解民意，畅通群众诉求表达渠道，解决群众急难愁盼问题。","尊重人民首创精神：鼓励基层大胆探索、先行先试，及时总结推广群众创造的鲜活经验，把顶层设计与问计于民统一起来。"]],["六、社会主要矛盾与高质量发展",["新时代我国社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；从“物质文化需要”到“美好生活需要”，反映需求层次跃升和党对人民需求认识的深化。","以人民为中心要求推动高质量发展中更加注重共同富裕，促进人与自然和谐共生，实现人的全面发展。"]],["七、记忆口诀",["人民立场是根本，试金石上看为谁；人民主体不动摇，人大制度是根基。","发展三问（为了谁、依靠谁、共享谁），成果人民来评判；共同富裕非平均，物质精神都要富。","群众路线是生命，一切为了依靠群众，从群众中来、到群众中去；人民至上记心间，江山就是人民、人民就是江山。"]]]},{"title":"第五章 全面深化改革开放","groups":[["一、改革开放的地位",["关键一招：改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。","性质：社会主义制度的自我完善和发展；是中国的第二次革命，不是暴力革命。","鲜明特征和首要任务：解放和发展社会生产力。"]],["二、全面深化改革总目标",["总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","两个层面：前者是前提和方向，后者是目的和落脚点（核心是制度现代化）。","国家治理体系：党领导下管理国家的制度体系；国家治理能力：运用国家制度管理社会各方面事务的能力（改革发展稳定、内政外交国防、治党治国治军）。"]],["三、重点与核心问题",["重点：经济体制改革。","核心问题：处理好政府和市场的关系——市场在资源配置中起决定性作用，更好发挥政府作用。","社会主义基本经济制度：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。"]],["四、立场与方法",["出发点和落脚点：促进社会公平正义、增进人民福祉。","“三个进一步解放”：进一步解放思想、进一步解放和发展生产力、进一步增强社会活力（既是改革目的又是改革条件）。","方法论：顶层设计和摸着石头过河相结合、胆子要大步子要稳、坚持重大改革于法有据、统筹改革发展稳定（改革是动力、发展是目的、稳定是前提）。","思想前提：解放思想；根本保证：党的领导。"]],["五、进一步全面深化改革（二十届三中全会）",["主题：进一步全面深化改革、推进中国式现代化。","总目标：继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","以经济体制改革为牵引；以促进社会公平正义、增进人民福祉为出发点和落脚点；更加注重系统集成、突出重点、改革实效。","“六个坚持”原则：党的全面领导、以人民为中心、守正创新、以制度建设为主线、全面依法治国、系统观念。","“七个聚焦”：高水平社会主义市场经济体制、全过程人民民主、社会主义文化强国、人民生活品质、美丽中国、更高水平平安中国、党的领导水平和长期执政能力。"]],["六、记忆口诀",["总目标两句话（完善制度＋治理现代化）；重点经济体制、核心政市关系；出发落脚点公平正义惠民生；三个进一步解放；动力改革、目的发展、前提稳定。"]]]},{"title":"专题一 党的二十大新观点新论断新思想","groups":[["一、报告核心论断",["大会主题：高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。","三个务必：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。","三件大事：迎来中国共产党成立一百周年；中国特色社会主义进入新时代；完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。","两个“行”：中国共产党为什么能、中国特色社会主义为什么好，归根到底是马克思主义行，是中国化时代化的马克思主义行。"]],["二、中心任务与布局",["党的中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","首要任务：高质量发展。","基础性、战略性支撑：教育、科技、人才（科技是第一生产力、人才是第一资源、创新是第一动力）。","应有之义：人民民主（全过程人民民主是最广泛、最真实、最管用的民主）。","内在要求：尊重自然、顺应自然、保护自然。"]],["三、安全、强军与治理",["国家安全是民族复兴的根基，社会稳定是国家强盛的前提。","强军：如期实现建军一百年奋斗目标，把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。","“一国两制”是香港、澳门回归后保持长期繁荣稳定的最佳制度安排。","全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。"]],["四、五个“必由之路”",["坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。","中国特色社会主义是实现中华民族伟大复兴的必由之路。","团结奋斗是中国人民创造历史伟业的必由之路。","贯彻新发展理念是新时代我国发展壮大的必由之路。","全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。"]],["五、记忆口诀",["三个务必记心间，三件大事铭史册，两个行字是关键；中心任务现代化、首要任务高质量；五个必由之路要背熟。"]]]},{"title":"专题二 党的二十届三中全会精神","groups":[["一、全会概况",["时间地点：2024 年 7 月 15 日至 18 日在北京举行。","审议通过：《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","历史定位：当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。"]],["二、总体思路与目标",["主题：进一步全面深化改革、推进中国式现代化。","总目标：继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","阶段目标：到 2029 年完成《决定》提出的改革任务；到 2035 年全面建成高水平社会主义市场经济体制；到本世纪中叶全面建成社会主义现代化强国。","以经济体制改革为牵引；以促进社会公平正义、增进人民福祉为出发点和落脚点；更加注重系统集成、突出重点、改革实效。"]],["三、重要论断（定位速记）",["开放是中国式现代化的鲜明标识。","发展全过程人民民主是中国式现代化的本质要求。","法治是中国式现代化的重要保障。","在发展中保障和改善民生是中国式现代化的重大任务。","国家安全是中国式现代化行稳致远的重要基础。","国防和军队现代化是中国式现代化的重要组成部分。","党的领导是进一步全面深化改革、推进中国式现代化的根本保证。"]],["四、“六个坚持”与“七个聚焦”",["六个坚持：坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。","七个聚焦：构建高水平社会主义市场经济体制、发展全过程人民民主、建设社会主义文化强国、提高人民生活品质、建设美丽中国、建设更高水平平安中国、提高党的领导水平和长期执政能力。"]],["五、记忆口诀",["三中全会定改革：主题现代化、总目标两句话；六个坚持七聚焦；开放是标识、民主是本质、法治是保障、民生是任务、安全是基础、国防是组成、党是根本保证。"]]]},{"title":"教材全书 2023版（导论＋17章＋结语）","groups":[["导论 习近平新时代中国特色社会主义思想是党和国家必须长期坚持的指导思想",["创立背景：在世界百年未有之大变局加速演进、我国社会主要矛盾发生历史性变化、中华民族伟大复兴进入关键时期、党推进全面从严治党的时代条件下创立并不断丰富发展。","确立过程：党的十九大把这一思想确立为党必须长期坚持的指导思想并写入党章；十三届全国人大一次会议通过宪法修正案将其载入宪法。","历史地位：是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。","主要内容：“十个明确”是最为核心关键的组成部分、构成“四梁八柱”；“十四个坚持”是新时代治国理政的基本方略；“十三个方面成就”是实践成果；三者内在贯通、有机统一。","三大时代课题：新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，是开辟马克思主义中国化时代化新境界的根本途径。","“六个必须坚持”（精髓与活的灵魂、“总钥匙”）：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","政治要求：深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”。"]],["第一章 新时代坚持和发展中国特色社会主义",["中国特色社会主义是历史和人民的选择，是社会主义而不是其他什么主义；坚定道路自信、理论自信、制度自信、文化自信。","中国特色社会主义进入新时代，这是我国发展新的历史方位；新时代伟大变革具有里程碑意义。","“三个意味着”：中华民族迎来从站起来、富起来到强起来的伟大飞跃；科学社会主义在二十一世纪的中国焕发出强大生机活力；中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径。","社会主要矛盾：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；是关系全局的历史性变化，但“两个没有变”——社会主义初级阶段的基本国情没有变，世界最大发展中国家的国际地位没有变。","基本路线核心“一个中心、两个基本点”：以经济建设为中心，坚持四项基本原则（立国之本）、坚持改革开放（强国之路）。","统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局（全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党）。"]],["第二章 以中国式现代化全面推进中华民族伟大复兴",["中国梦本质：国家富强、民族振兴、人民幸福；实现路径：走中国道路、弘扬中国精神、凝聚中国力量。","在中华大地上全面建成小康社会、实现第一个百年奋斗目标后，开启全面建设社会主义现代化国家新征程。","“两步走”：到2035年基本实现社会主义现代化；到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。","定性：中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。","五个中国特色：人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。","本质要求（九条）：坚持中国共产党领导、坚持中国特色社会主义、实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生、推动构建人类命运共同体、创造人类文明新形态。","五个重大原则（坚持和加强党的全面领导为首位）、六对重大关系（顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放）。","世界意义：创造人类文明新形态，打破“现代化＝西方化”迷思，为发展中国家走向现代化提供全新选择。"]],["第三章 坚持党的全面领导",["中国最大的国情就是中国共产党的领导；中国共产党领导是中国特色社会主义最本质的特征、中国特色社会主义制度的最大优势。","党的领导是党和国家事业不断发展的“定海神针”；没有中国共产党就没有新中国，就没有中华民族伟大复兴。","中国共产党是最高政治领导力量；党政军民学、东西南北中，党是领导一切的。","党的领导是全面的、系统的、整体的，要体现到治国理政各领域各方面各环节。","维护党中央权威和集中统一领导是最高政治原则；“两个维护”是最重要的政治纪律和政治规矩。","党的领导制度是我国的根本领导制度；健全党中央对重大工作的领导体制，把党的领导落实到国家治理各领域各方面各环节。"]],["第四章 坚持以人民为中心",["江山就是人民，人民就是江山；打江山、守江山，守的是人民的心。","人民立场是中国共产党的根本政治立场；党除了人民利益没有任何自己的特殊利益。","人民对美好生活的向往就是党的奋斗目标；人民是党的工作的最高裁决者和最终评判者。","群众路线是党的生命线和根本工作路线：一切为了群众、一切依靠群众，从群众中来、到群众中去。","发展为了人民、发展依靠人民、发展成果由人民共享；在发展中保障和改善民生，尽力而为、量力而行。","共同富裕是社会主义的本质要求、中国式现代化的重要特征；推动全体人民共同富裕取得更为明显的实质性进展。"]],["第五章 全面深化改革开放",["改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。","性质：社会主义制度的自我完善和发展，是“中国的第二次革命”；鲜明特征和首要任务是解放和发展社会生产力。","全面深化改革总目标：完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","国家治理体系是党领导下管理国家的制度体系；国家治理能力是运用国家制度管理各方面事务的能力，制度现代化是核心。","改革重点：经济体制改革；核心问题：处理好政府和市场的关系——市场在资源配置中起决定性作用，更好发挥政府作用。","出发点和落脚点：促进社会公平正义、增进人民福祉；“三个进一步解放”：解放思想、解放和发展社会生产力、解放和增强社会活力。","方法论：顶层设计和摸着石头过河相结合、胆子要大步子要稳、重大改革于法有据；改革是动力、发展是目的、稳定是前提。","更高水平开放：建设更高水平开放型经济新体制，实行更大范围、更宽领域、更深层次的对外开放，以开放促改革、促发展、促创新。"]],["第六章 推动高质量发展",["高质量发展是全面建设社会主义现代化国家的首要任务，是新时代的“硬道理”；发展是党执政兴国的第一要务。","新发展理念：创新、协调、绿色、开放、共享，是管全局、管根本、管长远的导向，具有战略性、纲领性、引领性。","新发展格局：以国内大循环为主体、国内国际双循环相互促进；是开放的双循环，要增强国内大循环内生动力和可靠性。","战略基点：坚持扩大内需，把实施扩大内需战略同深化供给侧结构性改革有机结合起来。","现代化产业体系是现代化国家的物质技术基础，具有完整性、先进性、安全性；坚持把发展经济的着力点放在实体经济上，推进新型工业化。","高水平科技自立自强：发挥新型举国体制优势，攻关关键核心技术，以发展新质生产力为重要着力点。","乡村振兴总要求：产业兴旺、生态宜居、乡风文明、治理有效、生活富裕；路径是产业、人才、文化、生态、组织“五个振兴”。","区域协调：深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略。"]],["第七章 社会主义现代化建设的教育、科技、人才战略",["教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。","“三个第一”：科技是第一生产力、人才是第一资源、创新是第一动力。","三大战略：科教兴国战略、人才强国战略、创新驱动发展战略；坚持教育优先发展、科技自立自强、人才引领驱动。","内在关系：科技创新靠人才、人才培养靠教育；教育强国、科技强国、人才强国具有内在一致性和相互支撑性，一体统筹推进。","教育是国之大计、党之大计；落实立德树人根本任务；到2035年建成教育强国。","党的二十大报告首次将教育、科技、人才作为专章一体部署；统筹推进教育科技人才体制机制一体改革。"]],["第八章 发展全过程人民民主",["人民民主是社会主义的生命；人民当家作主是社会主义民主政治的本质和核心。","全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。","全过程人民民主是全链条、全方位、全覆盖的民主，实现过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一。","五大环节：民主选举、民主协商、民主决策、民主管理、民主监督，各环节紧密联系、相互贯通，形成有效闭环。","人民代表大会制度是根本政治制度，是人民当家作主的重要途径和最高实现形式、实现全过程人民民主的重要制度载体。","基本政治制度：中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度；巩固和发展最广泛的爱国统一战线。","协商民主是社会主义民主政治的特有形式和独特优势；人民政协是专门协商机构；基层民主是全过程人民民主最直接、最广泛、最生动的体现。"]],["第九章 全面依法治国",["总目标：建设中国特色社会主义法治体系、建设社会主义法治国家；建设中国特色社会主义法治体系是总抓手，即在党的领导下形成“五个体系”——完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系、完善的党内法规体系。","中国特色社会主义法治道路是建设社会主义法治国家的唯一正确道路；核心要义是坚持党的领导、坚持中国特色社会主义制度、贯彻中国特色社会主义法治理论。","党的领导是社会主义法治之魂，是我国法治同西方资本主义国家法治最大的区别；决不走西方“宪政”“三权鼎立”“司法独立”的路子。","依宪治国、依宪执政：宪法是国家的根本法；坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。","工作布局：依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；法治政府建设是重点任务和主体工程。","十六字方针：科学立法、严格执法、公正司法、全民守法；公正司法是维护社会公平正义的最后一道防线。","全面依法治国是国家治理的一场深刻革命；在法治轨道上全面建设社会主义现代化国家；到2035年法治国家、法治政府、法治社会基本建成。"]],["第十章 建设社会主义文化强国",["文化是一个国家、一个民族的灵魂；文化兴则国运兴，文化强则民族强。","文化自信是更基础、更广泛、更深厚的自信；中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明。","坚持马克思主义在意识形态领域指导地位的根本制度；意识形态工作是为国家立心、为民族立魂的工作。","社会主义核心价值观：国家层面富强、民主、文明、和谐，社会层面自由、平等、公正、法治，公民层面爱国、敬业、诚信、友善。","中国特色社会主义文化源自中华优秀传统文化，熔铸于革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。","“两个结合”与“双创”：推动中华优秀传统文化创造性转化、创新性发展，古为今用、推陈出新。","繁荣发展文化事业和文化产业，推进文化和科技、文化和旅游深度融合；讲好中国故事，构建中国话语和中国叙事体系，提升国家文化软实力和中华文化影响力。","习近平文化思想的正式提出具有里程碑意义，标志着党对社会主义文化建设规律的认识达到新高度。"]],["第十一章 以保障和改善民生为重点加强社会建设",["江山就是人民，人民就是江山；为民造福是立党为公、执政为民的本质要求；让人民生活幸福是“国之大者”。","坚持在发展中保障和改善民生、在发展中增进民生福祉，尽力而为、量力而行。","收入分配是民生之源、促进共同富裕的基础性制度；规范收入分配秩序，保护合法收入、调节过高收入、取缔非法收入。","就业是最基本的民生；实施就业优先战略，把高质量充分就业作为经济社会发展的优先目标。","社会保障是民生保障安全网、收入分配调节器、经济运行减震器；健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。","健康中国：把保障人民健康放在优先发展的战略位置，坚持预防为主，促进优质医疗资源扩容和区域均衡布局。","社会治理：健全共建共治共享的社会治理制度，建设人人有责、人人尽责、人人享有的社会治理共同体。","新时代“枫桥经验”：坚持就地化解矛盾，把矛盾纠纷化解在基层、化解在萌芽状态；2022年首次写入党代会报告。"]],["第十二章 建设社会主义生态文明",["生态文明建设是关系中华民族永续发展的根本大计；“生态兴则文明兴”。","核心理念：坚持人与自然和谐共生；中国式现代化是人与自然和谐共生的现代化，绿色发展是中国式现代化的鲜明底色。","“两山”理论：绿水青山就是金山银山；保护生态环境就是保护生产力，改善生态环境就是发展生产力。","“双碳”目标：2020年9月习近平主席在第七十五届联合国大会一般性辩论上宣布，中国力争2030年前实现碳达峰、2060年前实现碳中和。","工作方针：精准治污、科学治污、依法治污；协同推进降碳、减污、扩绿、增长，深入打好蓝天、碧水、净土保卫战。","坚持山水林田湖草沙一体化保护和系统治理；实施长江十年禁渔，打好“三北”工程攻坚战。","建立以国家公园为主体的自然保护地体系，划定并严守生态保护红线；用最严格制度最严密法治保护生态环境，生态文明已载入党章和宪法。","全球贡献：共谋全球生态文明建设之路，共建清洁美丽世界；推动《巴黎协定》实施，推动达成“昆明—蒙特利尔全球生物多样性框架”。"]],["第十三章 维护和塑造国家安全",["国家安全是民族复兴的根基，社会稳定是国家强盛的前提。","总体国家安全观核心要义集中体现为“十个坚持”；首要的是坚持党对国家安全工作的绝对领导，坚持中国特色国家安全道路。","五大要素：以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。","坚持统筹发展和安全，统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同安全，以新安全格局保障新发展格局。","把维护政治安全放在首要位置；统筹维护政治、军事、国土、经济、金融、文化、社会、科技、网络、粮食、生态等重点领域安全。","增强忧患意识、居安思危，提高防范化解重大风险能力；推进国家安全体系和能力现代化，建设更高水平的平安中国。"]],["第十四章 建设巩固国防和强大人民军队",["党在新时代的强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队；强国必须强军，军强才能国安。","国防和军队现代化新“三步走”：到2027年实现建军一百年奋斗目标；到2035年基本实现国防和军队现代化；到本世纪中叶把人民军队全面建成世界一流军队。","坚持党对人民军队的绝对领导是人民军队的建军之本、强军之魂，最高实现形式是军委主席负责制。","全面推进政治建军、改革强军、科技强军、人才强军、依法治军，加快军事理论、军队组织形态、军事人员、武器装备现代化。","军队是要准备打仗的，一切工作向能打仗、打胜仗聚焦；全面加强练兵备战，紧盯科技之变、战争之变、对手之变。","巩固提高一体化国家战略体系和能力，实现富国和强军相统一；国防和军队现代化进程必须同国家现代化进程相适应。"]],["第十五章 坚持“一国两制”和推进祖国完全统一",["“一国两制”是中国特色社会主义的伟大创举：在统一国家内，国家主体坚持社会主义制度，香港、澳门等特别行政区依法实行资本主义制度、保持长期不变。","准确把握“一国”与“两制”关系：“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”；维护国家主权、安全、发展利益是“一国两制”方针的最高原则。","必须始终坚持“爱国者治港”“爱国者治澳”；制定实施香港国安法是香港由乱到治的“分水岭”，推动香港进入由乱到治走向由治及兴的新阶段。","“和平统一、一国两制”是解决台湾问题的基本方针，也是实现国家统一的最佳方式；制度不同不是统一的障碍，更不是分裂的借口。","坚持一个中国原则和“九二共识”，坚决反对“台独”分裂行径和外部势力干涉，牢牢把握两岸关系主导权和主动权。","实现祖国完全统一是中华民族伟大复兴的必然要求，是不可阻挡的历史大势；支持香港、澳门更好融入国家发展大局。"]],["第十六章 中国特色大国外交和推动构建人类命运共同体",["当今世界正经历百年未有之大变局；中国必须有自己特色的大国外交，我国国际影响力、感召力、塑造力显著提升。","中国始终不渝走和平发展道路，坚持独立自主的和平外交政策，坚决维护国家主权、安全、发展利益。","推动构建新型国际关系，秉持相互尊重、公平正义、合作共赢原则。","构建人类命运共同体是习近平外交思想的核心理念；总目标是建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界（“五个世界”）。","全球发展倡议、全球安全倡议、全球文明倡议（教材口径“三大全球倡议”），从发展、安全、文明三个维度指明人类社会前进方向。","秉持共商共建共享的全球治理观，坚持真正的多边主义，积极参与全球治理体系改革和建设；高质量共建“一带一路”，推动构建开放型世界经济。"]],["第十七章 全面从严治党",["打铁必须自身硬；全面从严治党是新时代党的建设的鲜明主题，是新时代党的自我革命的伟大实践，取得历史性、开创性成就。","全面从严治党核心是加强党的领导，基础在全面，关键在严，要害在治。","以党的政治建设为统领、把党的政治建设摆在首位；思想建设是党的基础性建设；以严的基调强化正风肃纪，把制度建设贯穿党的各项建设之中。","腐败是党长期执政面临的最大威胁；坚持标本兼治开展反腐败斗争，反腐败必须永远吹冲锋号。","党的自我革命是跳出治乱兴衰历史周期率的第二个答案（第一个答案是“让人民来监督政府”）。","时刻保持解决大党独有难题的清醒和坚定；以伟大自我革命引领伟大社会革命，建设长期执政的马克思主义政党。"]],["结语 深刻领悟“两个确立”的决定性意义，把学习贯彻习近平新时代中国特色社会主义思想不断引向深入",["“两个确立”：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心愿。","“两个确立”是党在新时代取得的重大政治成果，是推动党和国家事业取得历史性成就、发生历史性变革的决定性因素，具有决定性意义。","“两个确立”与“两个维护”精神同源、内核同质、目标同向：“两个确立”是“两个维护”的政治前提和思想基础，“两个维护”是政治责任和实践要求。","增强“四个意识”、坚定“四个自信”、做到“两个维护”；坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，全面系统学、及时跟进学、深入思考学、联系实际学，把学习贯彻不断引向深入。"]],["全书记忆口诀",["导论：十个明确四梁八柱、十四个坚持是方略、十三个方面成就是实践；两个结合是途径、六个必须坚持是总钥匙；两个确立定根本。","第一章：方向道路定根本、四个自信不动摇；主要矛盾“变”了、初级阶段“没变”；五位一体四全面，一个中心两个基本点。","第二章：两步走——2035基本现代化、本世纪中叶成强国；五特色、九要求、五原则、六关系，党的领导放首位。","第三章：最本质特征最大优势；党是最高政治领导力量、领导一切；两个维护是最重要的政治纪律。","第四章：江山就是人民、守的是人民的心；群众路线是生命线；发展为了、依靠、共享三句话；共同富裕是本质要求。","第五章：总目标两句话（完善制度＋治理现代化）；重点经济体制、核心政市关系；公平正义惠民生；三个进一步解放。","第六章：首要任务高质量；创新协调绿色开放共享；国内大循环为主体双循环；着力点放实体经济；五个振兴促乡村。","第七章：三个第一（科技生产力、人才第一资源、创新第一动力）；教育优先、科技自立自强、人才引领驱动；2035建成教育强国。","第八章：人民民主是生命；全过程=全链条全方位全覆盖、最广泛最真实最管用；人大制度是根本；协商民主是特有优势。","第九章：一目标一抓手、五体系一条路；三共同三一体；十六字方针依宪治；2035法治基本建成。","第十章：文化自信更基础更广泛更深厚；马导制度立根本；核心价值观三层次；双创传承讲好中国故事。","第十一章：国之大者惠民生；分配、就业、社保、健康四支柱；共建共治共享；枫桥经验化矛盾。","第十二章：生态兴则文明兴；两山理念化生产力；双碳——2030达峰、2060中和；山水林田湖草沙系统治。","第十三章：宗旨人民、根本政治、基础经济、保障军科文社、依托国际安全；政治安全放首位。","第十四章：听党指挥、能打胜仗、作风优良；三步走2027/2035/本世纪中叶；五个建军。","第十五章：一国是前提、两制从属之；爱国者治港治澳；和平统一一国两制，反独促统不松动。","第十六章：大变局中大国外交；新型国际关系三原则；命运共同体“五个世界”；三大全球倡议＋一带一路。","第十七章：打铁自身硬；两个答案（人民监督＋自我革命）；政治建设打头、思想建设打底；反腐永远吹冲锋号。","结语：两个确立定乾坤，四个意识四个自信，两个维护见行动。"]]]}];

function loadState(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s){ try{ s = JSON.parse(localStorage.getItem(LS_LEGACY)); }catch(e){} }
  s = migrateLegacy(s);
  if(!s) s = {v:2, answers:{}, favs:[], wrong:{}};
  s.v = 2;
  return s;
}
function migrateLegacy(s){
  if(!s) return null;
  if(s.v && s.v >= 2) return s;
  // 旧版以全局序号为键（1..N），迁移为稳定 id 键
  const flat = allQuestions;
  const mapIdx = k => { const n = parseInt(k,10); return (!isNaN(n) && n>=1 && n<=flat.length) ? flat[n-1].id : null; };
  const na = {}, nw = {}, nf = [];
  if(s.answers && typeof s.answers === "object"){
    for(const k in s.answers){ const id = mapIdx(k); if(id) na[id] = s.answers[k]; }
  }
  if(s.wrong && typeof s.wrong === "object"){
    for(const k in s.wrong){ const id = mapIdx(k); if(id) nw[id] = s.wrong[k]; }
  }
  if(Array.isArray(s.favs)){ s.favs.forEach(k => { const id = mapIdx(k); if(id) nf.push(id); }); }
  const out = {v:2, answers:na, favs:nf, wrong:nw};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(out)); localStorage.removeItem(LS_LEGACY); }catch(e){}
  return out;
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800); }

/* 派生统计 */
function answeredCount(){ return Object.keys(state.answers).length; }
function correctCount(){ let c=0; for(const k in state.answers){ if(state.answers[k].correct) c++; } return c; }
function wrongList(){ return Object.keys(state.wrong); } // 按添加顺序（id 为字符串）
function getChapter(id){ return BANK.chapters.find(c=>c.id===id); }
function qInChapter(qid){ return flatById[qid] ? flatById[qid]._ch : null; }
function chAnswered(chId){ let a=0,c=0; getChapter(chId).questions.forEach(q=>{ const r=state.answers[q.id]; if(r){a++; if(r.correct)c++;} }); return [a,c]; }

/* ================= 会话 ================= */
let session = { mode:"chapter", chapterId:"c1", order:[], pos:0, scope:null };
function buildOrder(mode, chapterId){
  let qs = [];
  if(mode==="chapter") qs = getChapter(chapterId).questions.slice();
  else if(mode==="random") qs = allQuestions.slice().sort(()=>Math.random()-0.5);
  else if(mode==="mistakes") qs = wrongList().map(id=>flatById[id]).filter(Boolean);
  else if(mode==="fav") qs = state.favs.map(id=>flatById[id]).filter(Boolean);
  return qs.map(q=>q.id);
}

/* ================= 视图路由 ================= */
function route(){
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//,"").split("/");
  const name = parts[0];
  const V = $("#view");
  if(name==="home"){ renderHome(V); }
  else if(name==="random"){ session={mode:"random",order:buildOrder("random"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"随机刷题");}else{renderQuiz(V,session);} }
  else if(name==="mistakes"){ session={mode:"mistakes",order:buildOrder("mistakes"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"错题本","暂无错题，继续刷题吧");}else{renderQuiz(V,session);} }
  else if(name==="fav"){ session={mode:"fav",order:buildOrder("fav"),pos:0,scope:null}; if(!session.order.length){emptyView(V,"收藏","还没有收藏题目，刷题时点星标即可收藏");}else{renderQuiz(V,session);} }
  else if(name==="c"){ const cid=parts[1]; if(cid){ session={mode:"chapter",chapterId:cid,order:getChapter(cid).questions.map(q=>q.id),pos:0,scope:null}; renderQuiz(V,session); } }
  else if(name==="cards"){ renderCards(V); }
  else if(name==="mindmap"){ renderMindmap(V); }
  else if(name==="outline"){ renderOutline(V); }
  else if(name==="book"){ renderBook(V); }
  else if(name==="stats"){ renderStats(V); }
  else renderHome(V);
  document.body.classList.toggle("in-quiz", name==="c"||name==="random"||name==="mistakes"||name==="fav");
  renderPills();
  syncNavActive();
}
function syncNavActive(){
  $$(".nav-item").forEach(n=>n.classList.remove("active"));
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//,"").split("/");
  if(parts[0]==="c"){ const n=document.querySelector(`[data-nav="ch-${parts[1]}"]`); if(n) n.classList.add("active"); }
  else{ const n=document.querySelector(`[data-nav="${parts[0]}"]`); if(n) n.classList.add("active"); }
  // 首页默认点亮第一个章节
  if((h==="#/home"||h==="#") && BANK.length){ const n=document.querySelector('[data-nav="ch-c1"]'); if(n) n.classList.add("active"); }
  // 移动端底部导航高亮映射
  $$(".tab").forEach(t=>t.classList.remove("active"));
  const tabMap = {home:"home", c:"quiz", random:"quiz", fav:"quiz", mistakes:"mistakes", cards:"cards", stats:"stats"};
  const tabName = tabMap[parts[0]];
  if(tabName){ const t=document.querySelector(`.tab[data-tab="${tabName}"]`); if(t) t.classList.add("active"); }
}

  return worst;
}

        ${q.type!=="fill" ? q.options.map((o,i)=>`
          <div class="opt" data-i="${i}" onclick="pickOpt(${i})">

          </div>`).join("") : `

          return `<div class="qdot ${cls}${f?" fav":""}" onclick="gotoQ(${i})" title="${i+1}">${i+1}</div>`;
        }).join("")}</div>
        <div class="nav-btns">
          <button class="btn btn-ghost" onclick="gotoQ(${s.pos-1})" ${s.pos===0?'disabled style="opacity:.5"':""}>← 上一题</button>
          <button class="btn btn-ghost" onclick="gotoQ(${s.pos+1})" ${s.pos>=total-1?'disabled style="opacity:.5"':""}>下一题 →</button>
          <span class="spacer"></span>
          <span style="font-size:12.5px;color:var(--ink-3)">${s.mode==="mistakes"?"错题巩固中 · 答对自动移出错题本":(s.mode==="random"?"随机顺序":s.mode==="fav"?"收藏题":getChapter(q._ch).title)}</span>

function pickOpt(i){
  const q = currentQ(); if(!q) return;
  const els = $$(".opt");
  if(q.type==="single"){
    els.forEach(e=>e.classList.remove("sel"));
    els[i].classList.add("sel");
  }else{
    els[i].classList.toggle("sel");
  }
}
function currentQ(){ return flatById[session.order[session.pos]]; }
function myPick(){
  const q = currentQ();
  if(q.type==="single"){ const el=$(".opt.sel"); return el? el.dataset.i : null; }
  if(q.type==="multi"){ return $$(".opt.sel").map(e=>+e.dataset.i).sort(); }
  const v = $("#fill-input").value.trim();
  return v;
}
function submitAnswer(){
  const q = currentQ(); if(!q) return;
  const pick = myPick();
  const result = $("#result");
  let correct=false, ansText="";
  if(q.type==="single"){
    if(pick===null){ toast("请先选择一个选项"); return; }
    const letter = letL(pick);
    correct = letter===ansNorm(q);
    ansText = ansTextOf(q);
    markOpts(pick, correct);
  }else if(q.type==="multi"){
    if(!pick.length){ toast("请至少选择一个选项"); return; }
    const letters = pick.map(i=>letL(i)).join("");
    correct = letters===ansNorm(q);
    ansText = ansTextOf(q);
    markOpts(pick, correct);
  }else{
    if(!pick){ toast("请输入答案"); return; }
    const ok = checkFill(pick, q.answer);
    correct = ok;
    ansText = Array.isArray(q.answer)?q.answer.join(" ／ "):q.answer;
  }
  // 记录
  const rec = state.answers[q.id] || {tries:0};
  rec.tries++;
  rec.picked = Array.isArray(pick)?pick.join(","):(pick===null?"":pick);
  rec.correct = correct;
  rec.ts = Date.now();
  state.answers[q.id] = rec;
  if(correct){
    if(session.mode==="mistakes"){ delete state.wrong[q.id]; }
  }else{
    state.wrong[q.id] = (state.wrong[q.id]||0)+1;
  }
  saveState();
  // 展示结果
  $("#btn-submit").style.display="none";
  $("#btn-next").style.display="";
  $("#btn-again").style.display="";
  result.className = "result show "+(correct?"ok":"bad");
  result.innerHTML = `<div class="head">${correct?"回答正确 ✓":"回答错误 ✗"}</div>
    <div class="ans">正确答案：<b>${esc(ansText)}</b></div>
    <div class="exp"><b>解析：</b>${esc(q.explain)}</div>`;
  renderPills(); refreshDots();
}
function markOpts(pickIdx, correct){
  const q = currentQ();
  const els = $$(".opt");
  els.forEach(e=>e.classList.add("disabled"));
  const picked = (Array.isArray(pickIdx)?pickIdx:[pickIdx]).map(Number).filter(n=>!isNaN(n));
  q.options.forEach((o,i)=>{
    const el = els[i];
    if(o[0]===undefined) return;
    const letter = letL(i);
    if(ansNorm(q).includes(letter)){ el.classList.add("right"); }
    else if(picked.includes(i)){ el.classList.add("wrong"); }
  });
}
function checkFill(input, accepted){
  const norm = s => s.replace(/[\s，。；;、,．.\/|＿_]/g,"").toLowerCase();
  const ni = norm(input);
  const arr = Array.isArray(accepted)?accepted:[accepted];
  for(const a of arr){
    // 一个答案可能含多个空，用 ；或 | 分隔，全部命中才算对
    const segs = a.split(/[；;|]/).map(norm).filter(Boolean);
    if(segs.every(seg=>ni.includes(seg))) return true;
  }
  return false;
}
function restoreAnswered(q, rec){
  // 恢复上次选择
  if(q.type!=="fill" && rec.picked!==""){
    const idxs = String(rec.picked).split(",").map(Number).filter(n=>!isNaN(n));
    idxs.forEach(i=>{ const el=$$(".opt")[i]; if(el) el.classList.add("sel"); });
  }else if(q.type==="fill" && rec.picked){
    const inp=$("#fill-input"); if(inp) inp.value = rec.picked;
  }
  // 显示结果（若上次已提交）
  if(rec.tries>0){
    const result = $("#result");
    $("#btn-submit").style.display="none";
    $("#btn-next").style.display="";
    $("#btn-again").style.display="";
    result.className = "result show "+(rec.correct?"ok":"bad");
    let ansText;
    if(q.type==="fill"){ ansText = Array.isArray(q.answer)?q.answer.join(" ／ "):q.answer; }
    else { ansText = ansTextOf(q); }
    result.innerHTML = `<div class="head">${rec.correct?"回答正确 ✓":"上次回答错误 ✗"}</div>
      <div class="ans">正确答案：<b>${esc(ansText)}</b></div>
      <div class="exp"><b>解析：</b>${esc(q.explain)}</div>`;
    if(q.type!=="fill" && rec.correct){ markOpts([], true); } // 全标对
    else if(q.type!=="fill"){ markOpts(String(rec.picked).split(",").map(Number).filter(n=>!isNaN(n)), false); }
  }
}
function resetQ(){
  const q = currentQ();
  if(q.type==="fill"){ const inp=$("#fill-input"); if(inp) inp.value=""; }
  $$(".opt").forEach(e=>{e.classList.remove("sel","right","wrong","disabled");});
  $("#result").className="result";
  $("#result").innerHTML="";
  $("#btn-submit").style.display="";
  $("#btn-next").style.display="none";
  $("#btn-again").style.display="none";
}
function nextQ(){ gotoQ(session.pos+1); }
function gotoQ(i){
  if(i<0||i>=session.order.length) return;
  session.pos = i;
  renderQuiz($("#view"), session);
  window.scrollTo({top:0,behavior:"smooth"});
}
function refreshDots(){
  $$(".qdot").forEach(d=>{
    const idx = +d.textContent-1;
    const r = state.answers[session.order[idx]];
    d.className = "qdot"+(idx===session.pos?" cur":"")+(r?(r.correct?" right":" wrong"):"");
  });
}
function toggleFav(qid){
  const i = state.favs.indexOf(qid);
  if(i>=0){ state.favs.splice(i,1); } else { state.favs.push(qid); }
  saveState(); renderPills();
  const b=$("#btn-fav"); if(b){ b.classList.toggle("on", i<0); }
  toast(i>=0?"已取消收藏":"已加入收藏");
}

          ${q.type!=="fill"?`<div style="margin-top:18px;font-size:13px;color:var(--ink-3)">${q.options.map((o,i)=>letL(i)+". "+esc(o)).join("&nbsp;&nbsp;")}</div>`:""}
        </div>
        <div class="face back">
          <div class="k">答案</div>
          <div class="txt">${q.type==="fill"?esc(Array.isArray(q.answer)?q.answer.join(" ／ "):q.answer):esc(q.answer+"."+q.options["ABCD".indexOf(q.answer)])}</div>
          <div style="margin-top:16px;font-size:12.5px;color:#E8D9A8">解析：${esc(q.explain.slice(0,90))}${q.explain.length>90?"…":""}</div>
        </div>
      </div>
      <div class="card-hint">点击卡片翻面 · 记住后点“下一张”继续</div>
    </div>
    <div class="deck-controls">
      <button class="btn btn-ghost" onclick="cardGo(-1)">← 上一张</button>
      <button class="btn btn-primary" onclick="cardGo(1)">下一张 →</button>
      <button class="btn btn-ghost" onclick="flipCard()">翻面</button>
    </div>
  </div>`;
}
function flipCard(){ cardSession.flipped=!cardSession.flipped; const f=$("#flash"); if(f) f.classList.toggle("flipped"); }
function cardGo(d){
  const n = cardSession.order.length;
  cardSession.pos = (cardSession.pos+d+n)%n;
  cardSession.flipped = false;
  renderCards($("#view"));
}
function shuffleCards(){
  cardSession.order = allQuestions.map(q=>q.id).sort(()=>Math.random()-0.5);
  cardSession.pos = 0; cardSession.flipped=false;
  renderCards($("#view"));
}

/* ================= 思维导图 ================= */
function renderMindmap(V){
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:6px">章节知识思维导图</h2>
  <p style="font-size:13px;color:var(--ink-3);margin-bottom:18px">点击章节标题或分组节点展开/折叠，辅助结构化记忆。</p>
  <div class="tip-card"><b>课程体系速记：</b>《习近平新时代中国特色社会主义思想概论》2023版教材围绕“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”展开；本课程按专题梳理为八大部分：新时代与新矛盾 → 中国式现代化 → 党建 → 以人民为中心 → 改革开放（＋二十大、三中全会专题） → 教材全书（导论＋17章＋结语）。</div>
  ${OUTLINE.map((ch,i)=>`
  <div class="mind-ch ${i===0?"open":""}" id="mc-${i}">
    <div class="mind-ch-head" onclick="toggleMind(${i})">
      <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>${esc(ch.title)}
    </div>
    <div class="mind-body">
      ${ch.groups.map((g,gi)=>`
      <div class="tree-group ${gi===0?"open":""}" onclick="event.stopPropagation();this.classList.toggle('open')">
        <div class="g-title">${esc(g[0])}</div>
        <div class="g-items">${g[1].map(it=>`<div class="tree-item">${esc(it)}</div>`).join("")}</div>
      </div>`).join("")}
    </div>
  </div>`).join("")}`;
}
function toggleMind(i){
  const el = $("#mc-"+i); if(el) el.classList.toggle("open");
}

/* ================= 知识提纲 ================= */
function renderOutline(V){
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:16px">章节知识要点提纲</h2>
  ${OUTLINE.map(ch=>`
  <div class="outline-sec">
    <h3>${esc(ch.title)}</h3>
    ${ch.groups.map(g=>`
    <div class="og"><h4>${esc(g[0])}</h4><ul>${g[1].map(it=>`<li>${esc(it)}</li>`).join("")}</ul></div>`).join("")}
  </div>`).join("")}`;
}

/* ================= 教材全书 ================= */
function renderBook(V){
  const ch = OUTLINE.find(o => o.title.indexOf("教材全书") === 0) || OUTLINE[OUTLINE.length-1];
  V.innerHTML = `<h2 style="font-size:18px;margin-bottom:6px">教材全书要点（2023版）</h2>
  <p style="font-size:13px;color:var(--ink-3);margin-bottom:16px">依据 2023 版教材公开章节体系（导论＋17章＋结语）与权威解读整理，未逐字复制教材全文。</p>
  <div class="outline-sec">
    <h3>${esc(ch.title)}</h3>
    ${ch.groups.map(g=>`
    <div class="og"><h4>${esc(g[0])}</h4><ul>${g[1].map(it=>`<li>${esc(it)}</li>`).join("")}</ul></div>`).join("")}
  </div>`;
}

/* ================= 统计 ================= */
function renderStats(V){
  const a=answeredCount(), c=correctCount(), rate=a?Math.round(c/a*100):0;
  V.innerHTML = `
  <h2 style="font-size:18px;margin-bottom:16px">答题统计</h2>
  <div class="doughnut-wrap">
    <div class="doughnut" style="--p:${a?rate:0}%"><div class="inner"><b>${rate}%</b><span>正确率</span></div></div>
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">总体进度</div>
      <div style="font-size:13px;color:var(--ink-2)">已作答 <b style="color:var(--red)">${a}</b> / ${allQuestions.length} 题（${a?Math.round(a/allQuestions.length*100):0}%）</div>
      <div style="font-size:13px;color:var(--ink-2)">答对 ${c} 题 · 答错 ${a-c} 题 · 错题本 ${wrongList().length} 题 · 收藏 ${state.favs.length} 题</div>
      <div style="font-size:12.5px;color:var(--ink-3);margin-top:8px">刷题记录保存在浏览器本地（localStorage），换设备或清缓存会丢失。</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="k">已作答</div><div class="v">${a}<small> / ${allQuestions.length}</small></div></div>
    <div class="stat-card"><div class="k">答对</div><div class="v">${c}</div></div>
    <div class="stat-card"><div class="k">答错</div><div class="v" style="color:var(--bad)">${a-c}</div></div>
    <div class="stat-card"><div class="k">正确率</div><div class="v" style="color:var(--ok)">${rate}%</div></div>
  </div>
  ${BANK.chapters.map(ch=>{
    const [ca,cc]=chAnswered(ch.id);
    const rt = ca?Math.round(cc/ca*100):0;
    const pct = ch.questions.length?Math.round(ca/ch.questions.length*100):0;
    return `<div class="ch-stats">
      <div class="row1"><b>${esc(ch.title)}</b><span>已答 ${ca}/${ch.questions.length} · 正确率 ${ca?rt+"%":"--"}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">完成度 ${pct}% · ${ch.questions.filter(q=>state.answers[q.id]&&state.answers[q.id].correct).length} 题答对</div>
    </div>`;}).join("")}`;
}

/* ================= 空状态 ================= */
function emptyView(V, title, msg){
  V.innerHTML = `<div class="empty">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9C2B4" stroke-width="1.4" style="margin-bottom:12px"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    <h3>${esc(title)}</h3><p>${esc(msg||"暂无内容")}</p></div>`;
}

/* ================= 全局 ================= */
function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
function resetProgress(){
  if(!confirm("确定要清空全部答题记录、错题本和收藏吗？此操作不可恢复。")) return;
  state = {v:2, answers:{}, favs:[], wrong:{}};
  saveState(); route();
  toast("学习进度已重置");
}
window.addEventListener("hashchange", ()=>{ closeSidebar(); route(); });
function isMobile(){ return window.matchMedia("(max-width:820px)").matches; }
document.addEventListener("DOMContentLoaded", ()=>{
  renderNav();
  // 手机端一点开就刷题：无路由时默认进入随机刷题；桌面端默认首页
  if(!location.hash){
    if(isMobile()){ history.replaceState(null, "", "#/random"); }
    else{ history.replaceState(null, "", "#/home"); }
  }
  route();
});
</script>
</body>
</html>
