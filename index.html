<style>
:root{
  --red:#C7000B; --red-dark:#8F0A08; --red-light:#FBE3E1;
  --gold:#C9A227; --gold-soft:#F5E9C8;
  --ink:#26221C; --ink-2:#5C554A; --ink-3:#8A8378;
  --paper:#F7F4EF; --card:#FFFFFF; --line:#E7E1D6;
  --ok:#2E7D46; --ok-bg:#E4F2E8; --bad:#B23A2E; --bad-bg:#FBE7E3;
  --sidebar:#221E18; --sidebar-ink:#EDE6D6; --sidebar-ink2:#A89F8E;
  --radius:14px; --shadow:0 2px 14px rgba(38,34,28,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.serif{font-family:Georgia,"Songti SC","SimSun",serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9C2B4;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.content{flex:1;padding:22px;max-width:980px;width:100%;margin:0 auto}

/* ===== 侧栏 ===== */
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px}
.brand-badge{width:40px;height:40px;border-radius:8px;background:linear-gradient(145deg,#D2121E,var(--red-dark));color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;border:1.5px solid var(--gold);outline:1px solid rgba(201,162,39,.55);outline-offset:2px;box-shadow:0 3px 9px rgba(199,0,11,.35)}
.brand-name{font-weight:700;font-size:16px;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--sidebar-ink2);margin-top:1px}
.nav-group{padding:6px 12px 0}
.nav-label{font-size:11px;letter-spacing:2px;color:var(--sidebar-ink2);padding:10px 8px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--sidebar-ink);text-decoration:none;font-size:14px;margin-bottom:2px;transition:background .15s}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:var(--red);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav-item.active svg{opacity:1}
.nav-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:20px}
.nav-item.active .cnt{background:rgba(255,255,255,.22)}
.side-foot{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--sidebar-ink2)}
.side-foot button{background:none;border:none;color:var(--sidebar-ink2);font-size:11px;text-decoration:underline;padding:2px 0}

/* ===== 顶栏统计 ===== */
.stat-pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pill b{color:var(--red);font-size:14px}
.pill.gold b{color:var(--gold)}
.pill.ok b{color:var(--ok)}
.pill.bad b{color:var(--bad)}
.mode-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.mode-title .tag{font-size:11px;font-weight:600;background:var(--red-light);color:var(--red);padding:2px 9px;border-radius:20px}

/* ===== 首页仪表盘 ===== */
.hero{background:linear-gradient(135deg,#3A1212 0%,#6E1B16 55%,#8A2418 100%);border-radius:var(--radius);color:#F5EBD8;padding:30px 32px;margin-bottom:22px;position:relative;overflow:hidden;border-top:2px solid var(--gold)}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(201,162,39,.7),transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.3),transparent 65%)}
.hero h1{font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.hero p{color:#C9BFA9;font-size:13.5px;max-width:560px}
.hero .kpis{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.kpi b{display:block;font-size:26px;color:var(--gold-soft)}
.kpi span{font-size:12px;color:#B7AC93}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-card .k{font-size:12.5px;color:var(--ink-3)}
.stat-card .v{font-size:30px;font-weight:800;color:var(--ink);margin-top:4px}
.stat-card .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ch-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s;text-decoration:none;color:inherit;display:block}
.ch-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(38,34,28,.12)}
.ch-card h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ink);padding-left:10px;border-left:3px solid var(--red)}
.ch-card .meta{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.bar{height:7px;background:#EFEAE0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#C9574F);border-radius:6px;transition:width .4s}
.ch-card .note{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}

/* ===== 刷题视图 ===== */
.quiz-wrap{max-width:820px;margin:0 auto}
.quiz-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.quiz-top .badge{font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;background:var(--red-light);color:var(--red)}
.quiz-top .badge.fill{background:#EAF0FB;color:#2D5FA8}
.quiz-top .badge.orig{background:var(--gold-soft);color:#8A6D1F}
.quiz-top .qmeta{font-size:12.5px;color:var(--ink-3)}
.quiz-top .qmeta b{color:var(--ink-2)}
.progress-line{height:6px;background:#EFEAE0;border-radius:6px;overflow:hidden;margin-bottom:16px}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:6px;transition:width .3s}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
.q-stem{font-size:16.5px;font-weight:600;line-height:1.75;margin-bottom:20px}
.q-stem .num{color:var(--red);margin-right:6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;transition:all .13s;background:#fff}
.opt:hover{border-color:#C9BFA9;background:#FBF8F2}
.opt .letter{width:26px;height:26px;border-radius:8px;background:#F1ECE2;color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;transition:all .13s}
.opt .txt{flex:1;font-size:15px}
.opt.sel{border-color:var(--red);background:var(--red-light)}
.opt.sel .letter{background:var(--red);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt.disabled{pointer-events:none}
.fill-box{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fill-box input{flex:1;min-width:240px;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:15.5px;background:#fff}
.fill-box input:focus{outline:none;border-color:var(--red)}
.btn{border:none;border-radius:11px;padding:11px 22px;font-size:14.5px;font-weight:600;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-gold{background:var(--gold);color:#2B2410}
.btn-ghost{background:#F1ECE2;color:var(--ink-2)}
.btn-ghost:hover{background:#E9E2D4}
.btn-ok{background:var(--ok);color:#fff}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.result{margin-top:18px;border-radius:12px;padding:16px 18px;display:none}
.result.show{display:block;animation:fadein .25s}
.result.ok{background:var(--ok-bg);border:1px solid #BFDCC8}
.result.bad{background:var(--bad-bg);border:1px solid #EDC9C2}
.result .head{font-weight:700;font-size:15px;margin-bottom:6px}
.result.ok .head{color:var(--ok)}
.result.bad .head{color:var(--bad)}
.result .ans{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.result .ans b{color:var(--ink)}
.result .exp{font-size:13.5px;color:var(--ink-2);line-height:1.7}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.q-nav{margin-top:18px}
.q-nav .qdots{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow-y:auto}
.qdot{width:26px;height:26px;border-radius:7px;background:#F1ECE2;color:var(--ink-2);font-size:11.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;font-weight:600}
.qdot.cur{border-color:var(--red);color:var(--red)}
.qdot.right{background:var(--ok);color:#fff}
.qdot.wrong{background:var(--bad);color:#fff}
.qdot.fav::after{content:"★";font-size:9px;position:relative;top:-1px}
.nav-btns{display:flex;align-items:center;gap:10px;margin-top:14px}
.nav-btns .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{background:#FBF8F2}
.icon-btn.on{background:var(--gold-soft);color:#8A6D1F;border-color:var(--gold)}
.fav-star svg{fill:none;stroke:#B8B0A0;stroke-width:1.6}
.fav-star.on svg{fill:var(--gold);stroke:var(--gold)}

/* ===== 速记卡片 ===== */
.card-deck{perspective:1200px;max-width:680px;margin:0 auto}
.flash{position:relative;width:100%;min-height:300px;cursor:pointer;transition:transform .35s;transform-style:preserve-3d}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);padding:34px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.flash .back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--red-dark),var(--red));color:#fff}
.flash .face .k{font-size:12px;letter-spacing:2px;color:var(--ink-3);margin-bottom:14px;font-weight:600}
.flash .back .k{color:var(--gold-soft)}
.flash .face .txt{font-size:17.5px;font-weight:600;line-height:1.8}
.flash .back .txt{font-size:16px;line-height:1.9}
.card-hint{margin-top:14px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.deck-controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== 思维导图 / 提纲 ===== */
.mind-ch{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:16px;overflow:hidden}
.mind-ch-head{display:flex;align-items:center;gap:10px;padding:15px 20px;cursor:pointer;font-weight:700;font-size:15px;background:#FBF8F2;border-bottom:1px solid var(--line)}
.mind-ch-head .arrow{transition:transform .2s;color:var(--red);font-size:13px}
.mind-ch.open .mind-ch-head .arrow{transform:rotate(90deg)}
.mind-body{display:none;padding:8px 22px 20px}
.mind-ch.open .mind-body{display:block}
.tree-node{margin-left:0}
.tree-group{margin:10px 0 2px}
.tree-group .g-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--red-dark);padding:7px 0;cursor:pointer}
.tree-group .g-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tree-group .g-items{display:none;border-left:2px solid #EFE7D8;margin-left:11px;padding-left:16px}
.tree-group.open .g-items{display:block}
.tree-item{font-size:13.5px;color:var(--ink-2);padding:5px 0;line-height:1.7}
.tree-item::before{content:"·";color:var(--red);font-weight:700;margin-right:6px}
.outline-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px}
.outline-sec h3{font-size:16px;margin-bottom:10px;color:var(--ink);border-left:4px solid var(--red);padding-left:12px}
.outline-sec .og{margin:12px 0}
.outline-sec .og h4{font-size:13.5px;color:var(--red-dark);font-weight:700;margin-bottom:6px}
.outline-sec .og li{font-size:13.5px;color:var(--ink-2);margin-left:18px;margin-bottom:4px}
.tip-card{background:var(--gold-soft);border:1px solid #E4D5A8;border-radius:12px;padding:14px 18px;font-size:13.5px;color:#6B5420;margin-top:10px}
.tip-card b{color:#8A6D1F}

/* ===== 统计 ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.ch-stats{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px}
.ch-stats .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.ch-stats .row1 b{font-size:14.5px}
.ch-stats .row1 span{font-size:12.5px;color:var(--ink-3)}
.ch-stats .sub{font-size:12px;color:var(--ink-3);margin-top:7px}
.doughnut-wrap{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;margin-bottom:22px}
.doughnut{width:130px;height:130px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--ok) 0 var(--p,0%),#EFEAE0 var(--p,0%) 100%)}
.doughnut .inner{width:86px;height:86px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.doughnut .inner b{font-size:22px;color:var(--ink)}
.doughnut .inner span{font-size:11px;color:var(--ink-3)}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#26221C;color:#F2EBDD;padding:11px 22px;border-radius:12px;font-size:13.5px;opacity:0;transition:all .25s;pointer-events:none;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 移动端 ===== */
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;align-items:center;justify-content:center}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
@media (max-width:820px){
  .sidebar{display:none;position:fixed;left:0;top:0;bottom:0;height:100vh;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .sidebar.open{display:flex}
  .scrim.show{display:block}
  .menu-btn{display:flex;width:36px;height:36px}
  .content{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  .topbar{padding:8px 12px;gap:8px}
  .mode-title{font-size:14.5px}
  .stat-pills{display:none}
  .hero{padding:18px 16px;margin-bottom:14px;border-radius:12px}
  .hero h1{font-size:17px;letter-spacing:.3px;margin-bottom:4px}
  .hero p{font-size:12px;display:none}
  .hero .kpis{gap:14px;margin-top:12px}
  .kpi b{font-size:21px}
  .kpi span{font-size:11px}
  .stat-cards{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .stat-card{padding:13px 14px}
  .stat-card .k{font-size:12px}
  .stat-card .v{font-size:23px}
  .chapter-grid{grid-template-columns:1fr;gap:10px}
  .ch-card{padding:13px 14px}
  .ch-card h3{font-size:14.5px;margin-bottom:6px}
  .ch-card .note{font-size:11.5px}
  .q-card{padding:18px 15px}
  h2[style]{font-size:15px!important}
}

/* ===== 移动端底部导航（仅 ≤820px 显示） ===== */

const BANK = {"chapters":[{"id":"c1","title":"第一章 新时代坚持和发展中国特色社会主义","note":"原题来源：第一章练习题.docx（单选30+多选20）；补充题依据：《习近平新时代中国特色社会主义思想概论》2023年版教材要点及党的二十大报告。","questions":[{"id":"c1-o-s1","type":"single","orig":true,"origNo":1,"q":"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为：（ ）","options":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","生产关系和生产力、上层建筑和经济基础之间的矛盾","人民群众对美好生活的向往与各种风险挑战之间的矛盾"],"answer":"B","explain":"党的十九大报告明确指出，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。A项是改革开放初期至十九大前的主要矛盾表述。"},{"id":"c1-o-s2","type":"single","orig":true,"origNo":2,"q":"坚持和发展中国特色社会主义，总任务是：（ ）","options":["全面建成小康社会","实现社会主义现代化和中华民族伟大复兴","全面深化改革","全面依法治国"],"answer":"B","explain":"党的十九大报告明确了新时代坚持和发展中国特色社会主义的总任务，即实现社会主义现代化和中华民族伟大复兴。"},{"id":"c1-o-s3","type":"single","orig":true,"origNo":3,"q":"中国特色社会主义最本质的特征是：（ ）","options":["人民民主专政","中国共产党领导","以经济建设为中心","改革开放"],"answer":"B","explain":"中国共产党领导是中国特色社会主义最本质的特征，这是宪法和党章明确规定的，也是新时代坚持和发展中国特色社会主义的根本保证。"},{"id":"c1-o-s4","type":"single","orig":true,"origNo":4,"q":"“四个全面”战略布局中，具有突破性和先导性的关键环节是：（ ）","options":["全面建成小康社会","全面深化改革","全面依法治国","全面从严治党"],"answer":"B","explain":"全面深化改革是“四个全面”战略布局中具有突破性和先导性的关键环节，为其他“三个全面”提供动力。"},{"id":"c1-o-s5","type":"single","orig":true,"origNo":5,"q":"“五位一体”总体布局中，起基础性作用的是（ ）。","options":["经济建设","政治建设","文化建设","社会建设"],"answer":"A","explain":"经济建设是“五位一体”总体布局的中心和基础，为其他方面建设提供物质条件。"},{"id":"c1-o-s6","type":"single","orig":true,"origNo":6,"q":"新时代坚持和发展中国特色社会主义的基本方略，党的十九大报告将其概括为（ ）。","options":["“八个明确”","“十四个坚持”","“五位一体”","“四个全面”"],"answer":"B","explain":"“十四个坚持”是新时代坚持和发展中国特色社会主义的基本方略，是习近平新时代中国特色社会主义思想的重要组成部分。“八个明确”是核心内容。"},{"id":"c1-o-s7","type":"single","orig":true,"origNo":7,"q":"中国特色社会主义进入新时代，我国发展仍处于（ ）。","options":["重要战略机遇期","矛盾凸显期","改革攻坚期","风险多发期"],"answer":"A","explain":"尽管面临复杂严峻的国内外形势，但我国发展仍处于可以大有作为的重要战略机遇期，这是党中央作出的重大判断。"},{"id":"c1-o-s8","type":"single","orig":true,"origNo":8,"q":"决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招是（ ）。","options":["党的领导","改革开放","科技创新","依法治国"],"answer":"B","explain":"习近平总书记多次强调，改革开放是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。"},{"id":"c1-o-s9","type":"single","orig":true,"origNo":9,"q":"中国特色社会主义道路、理论、制度、文化，四者之间的关系是（ ）。","options":["相互独立、互不干涉","统一于中国特色社会主义伟大实践","理论决定道路，制度决定文化","文化是基础，制度是保障"],"answer":"B","explain":"中国特色社会主义道路、理论、制度、文化是相互联系、相互促进的有机整体，统一于中国特色社会主义伟大实践。"},{"id":"c1-o-s10","type":"single","orig":true,"origNo":10,"q":"新时代坚持和发展中国特色社会主义，必须坚持和完善的社会主义基本经济制度是（ ）。","options":["公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","社会主义市场经济体制","以上都是"],"answer":"D","explain":"党的十九届四中全会将公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等共同作为社会主义基本经济制度。"},{"id":"c1-o-s11","type":"single","orig":true,"origNo":11,"q":"以下关于“新时代”的理解，正确的是（ ）。","options":["新时代意味着我国已经跨越了社会主义初级阶段","新时代是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代","新时代的主要任务是解决人民日益增长的物质文化需要","新时代意味着我国社会主要矛盾已经消失"],"answer":"B","explain":"A项错误，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。C项错误，新时代的主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。D项错误，矛盾依然存在，只是转化了。B项是十九大报告对新时代的准确定义之一。"},{"id":"c1-o-s12","type":"single","orig":true,"origNo":12,"q":"“中国特色社会主义进入新时代，我国社会主要矛盾发生了变化，但这并没有改变我们对我国社会主义所处历史阶段的判断。”这一论断体现了（ ）。","options":["矛盾的普遍性与特殊性辩证关系原理","事物发展的渐进性与飞跃性统一","主要矛盾与次要矛盾在一定条件下相互转化","事物性质是由主要矛盾的主要方面决定的"],"answer":"A","explain":"我国社会主要矛盾的变化是特殊性的表现（新时代的阶段性特征），但我国仍处于社会主义初级阶段是普遍性（基本国情），二者是共性与个性、绝对与相对的关系。这一论断体现了矛盾的普遍性与特殊性辩证关系原理。"},{"id":"c1-o-s13","type":"single","orig":true,"origNo":13,"q":"党的二十大报告指出，新时代十年的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。其中，“我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事”不包括（ ）。","options":["迎来中国共产党成立一百周年","中国特色社会主义进入新时代","完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标","实现中华民族伟大复兴进入了不可逆转的历史进程"],"answer":"D","explain":"党的二十大报告明确的三件大事是：一是迎来中国共产党成立一百周年，二是中国特色社会主义进入新时代，三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。D项是新时代伟大变革的里程碑意义之一，而非三件大事本身。"},{"id":"c1-o-s14","type":"single","orig":true,"origNo":14,"q":"“两个确立”的决定性意义在于，它是党在新时代取得的重大政治成果，是推动党和国家事业取得历史性成就、发生历史性变革的决定性因素。“两个确立”是指（ ）。","options":["确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位","确立全面建成小康社会目标，确立全面深化改革总目标","确立党在新时代的强军目标，确立构建人类命运共同体理念","确立“五位一体”总体布局，确立“四个全面”战略布局"],"answer":"A","explain":"“两个确立”是党的十九届六中全会提出的重大政治论断，指确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。"},{"id":"c1-o-s15","type":"single","orig":true,"origNo":15,"q":"党的二十大报告强调，中国式现代化是中国共产党领导的社会主义现代化。以下关于中国式现代化的特征，表述错误的是（ ）。","options":["人口规模巨大的现代化","全体人民共同富裕的现代化","物质文明和精神文明相协调的现代化","走殖民扩张道路的现代化"],"answer":"D","explain":"中国式现代化的特征包括人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。D项“走殖民扩张道路”完全不符合中国式现代化的本质。"},{"id":"c1-o-s16","type":"single","orig":true,"origNo":16,"q":"坚持和发展中国特色社会主义，必须一以贯之。这里的“一以贯之”强调的是（ ）。","options":["坚持党的基本路线不动摇","坚持改革开放不动摇","坚持走中国特色社会主义道路不动摇","以上都是"],"answer":"D","explain":"一以贯之坚持和发展中国特色社会主义，核心是坚持党的基本路线不动摇，坚持改革开放不动摇，坚持走中国特色社会主义道路不动摇，三者是统一的整体。"},{"id":"c1-o-s17","type":"single","orig":true,"origNo":17,"q":"新时代坚持和发展中国特色社会主义，必须统筹推进“五位一体”总体布局。其中，政治建设的核心目标是（ ）。","options":["建设社会主义文化强国","发展社会主义民主政治","提高保障和改善民生水平","建设美丽中国"],"answer":"B","explain":"“五位一体”中，政治建设的目标是坚持党的领导、人民当家作主、依法治国有机统一，发展社会主义民主政治。A项是文化建设，C项是社会建设，D项是生态文明建设。"},{"id":"c1-o-s18","type":"single","orig":true,"origNo":18,"q":"协调推进“四个全面”战略布局，必须把“全面从严治党”作为（ ）。","options":["战略目标","根本保证","动力源泉","法治保障"],"answer":"B","explain":"在“四个全面”战略布局中，全面建成小康社会（后调整为全面建设社会主义现代化国家）是战略目标，全面深化改革是动力，全面依法治国是保障，全面从严治党是根本保证。"},{"id":"c1-o-s19","type":"single","orig":true,"origNo":19,"q":"以下关于“新时代伟大变革的里程碑意义”的表述，不正确的是（ ）。","options":["意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃","意味着科学社会主义在二十一世纪的中国焕发出强大生机活力","意味着中国特色社会主义道路、理论、制度、文化彻底解决了中国所有问题","意味着中国特色社会主义拓展了发展中国家走向现代化的途径"],"answer":"C","explain":"A、B、D项都是对新时代伟大变革里程碑意义的准确概括。C项“彻底解决了中国所有问题”说法过于绝对，不符合实际，我们仍面临许多挑战和问题。"},{"id":"c1-o-s20","type":"single","orig":true,"origNo":20,"q":"习近平总书记强调，“全党必须牢记，坚持党的全面领导是坚持和发展中国特色社会主义的必由之路”。这一论断深刻揭示了（ ）。","options":["党的领导与中国特色社会主义的内在统一性","党的领导是中国特色社会主义的唯一特征","坚持党的领导就能解决一切问题","党的领导与依法治国是矛盾的"],"answer":"A","explain":"习近平总书记的论断阐明了党的领导与中国特色社会主义之间不可分割的内在联系，坚持党的领导是中国特色社会主义事业取得成功的根本保证。B、C、D项表述均有误。"},{"id":"c1-o-s21","type":"single","orig":true,"origNo":21,"q":"党的二十大报告指出：“新时代十年的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。”这一论断的深层逻辑在于，新时代十年（ ）。","options":["实现了中国从站起来到富起来的伟大飞跃","完成了中国历史上最广泛最深刻的社会变革","推动中华民族伟大复兴进入了不可逆转的历史进程","彻底解决了社会主义初级阶段的主要矛盾"],"answer":"C","explain":"A项错误，从站起来到富起来的飞跃是在改革开放时期实现的。B项错误，最广泛最深刻的社会变革是指社会主义改造。D项表述过于绝对。新时代十年最根本的里程碑意义在于，它使中华民族伟大复兴具备了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量，进入了不可逆转的历史进程。"},{"id":"c1-o-s22","type":"single","orig":true,"origNo":22,"q":"习近平总书记指出：“中国特色社会主义不是从天上掉下来的，是党和人民历尽千辛万苦、付出巨大代价取得的根本成就。”这一论述旨在强调（ ）。","options":["中国特色社会主义具有深厚的历史渊源和广泛的现实基础","中国特色社会主义是唯一的正确道路，不存在其他选择","坚持中国特色社会主义必须付出巨大代价","中国特色社会主义已经完美无缺，无需发展"],"answer":"A","explain":"该论述深刻阐明了中国特色社会主义的历史逻辑、理论逻辑和实践逻辑，说明其是历史的结论、人民的选择，具有深厚的历史渊源和广泛的现实基础。B、C、D项表述均曲解了原意。"},{"id":"c1-o-s23","type":"single","orig":true,"origNo":23,"q":"党的二十大报告将“中国式现代化”作为核心概念进行系统阐述。从“四个全面”战略布局到“中国式现代化”的理论创新，体现了（ ）。","options":["党对社会主义建设规律认识的深化","我国社会主要矛盾的彻底解决","中国特色社会主义道路的根本转向","马克思主义基本原理与中国实际结合的第二次飞跃"],"answer":"A","explain":"从“四个全面”到“中国式现代化”，反映了党在新时代对如何建设社会主义现代化强国、如何实现民族复兴等重大问题的认识不断深化，是对社会主义建设规律认识的深化。B项错误，主要矛盾依然存在。C项错误，道路没有转向。D项错误，第二次飞跃是指中国特色社会主义理论体系的形成。"},{"id":"c1-o-s24","type":"single","orig":true,"origNo":24,"q":"坚持和发展中国特色社会主义，必须处理好“变”与“不变”的关系。以下体现这一辩证关系的是（ ）。","options":["我国社会主要矛盾发生了变化，但我国仍处于社会主义初级阶段的基本国情没有变","我国是世界最大发展中国家的国际地位没有变，但综合国力显著提升","党的基本路线没有变，但具体政策和策略需要与时俱进","以上都是"],"answer":"D","explain":"A项体现了主要矛盾之“变”与基本国情之“不变”；B项体现了国际地位之“不变”与综合国力之“变”；C项体现了基本路线之“不变”与具体政策之“变”。三者都深刻揭示了坚持和发展中国特色社会主义过程中“变”与“不变”的辩证统一。"},{"id":"c1-o-s25","type":"single","orig":true,"origNo":25,"q":"新时代坚持和发展中国特色社会主义，必须坚持党的基本路线不动摇。党的基本路线的核心内容是“一个中心、两个基本点”。其中，“两个基本点”是（ ）。","options":["坚持四项基本原则和坚持改革开放","坚持党的领导与坚持人民民主专政","坚持社会主义道路与坚持依法治国","坚持以经济建设为中心与坚持共同富裕"],"answer":"A","explain":"“一个中心”指以经济建设为中心，“两个基本点”指坚持四项基本原则（立国之本）和坚持改革开放（强国之路）。B、C、D项均不完全正确。"},{"id":"c1-o-s26","type":"single","orig":true,"origNo":26,"q":"习近平总书记指出：“全党要更加自觉地增强道路自信、理论自信、制度自信、文化自信，既不走封闭僵化的老路，也不走改旗易帜的邪路，保持政治定力，坚持实干兴邦，始终坚持和发展中国特色社会主义。”其中，“不走封闭僵化的老路”强调的是（ ）。","options":["必须坚持改革开放的基本国策","必须坚持四项基本原则","必须坚持党的基本路线","必须坚持独立自主"],"answer":"A","explain":"“封闭僵化的老路”指的是改革开放前一段时间内脱离实际、僵化封闭的社会主义建设模式。不走老路，就是要求我们必须坚持改革开放，不断推进理论创新、实践创新、制度创新、文化创新。"},{"id":"c1-o-s27","type":"single","orig":true,"origNo":27,"q":"党的二十大报告强调，前进道路上必须牢牢把握“五项重大原则”，其中“坚持和加强党的全面领导”居于首位。这主要是因为（ ）。","options":["党的领导是中国特色社会主义最本质的特征和最大优势","党是最高政治领导力量，能够总揽全局、协调各方","只有坚持党的领导，才能确保中国式现代化的正确方向","以上都是"],"answer":"D","explain":"A、B、C项都是坚持和加强党的全面领导作为首要原则的原因。党的领导是中国特色社会主义事业取得胜利的根本保证，是战胜一切困难和风险的“定海神针”。"},{"id":"c1-o-s28","type":"single","orig":true,"origNo":28,"q":"以下关于“统筹推进‘五位一体’总体布局”与“协调推进‘四个全面’战略布局”关系的表述，最准确的是（ ）。","options":["“五位一体”是目标，“四个全面”是路径","“四个全面”是总体布局，“五位一体”是战略布局","二者相互促进、有机统一，共同构成新时代中国特色社会主义的顶层设计","“五位一体”侧重于国内发展，“四个全面”侧重于国际战略"],"answer":"C","explain":"“五位一体”总体布局和“四个全面”战略布局是新时代中国特色社会主义事业发展的两大战略安排，二者相辅相成、相互促进，共同构成了党治国理政的顶层设计。A、B、D项表述均有误。"},{"id":"c1-o-s29","type":"single","orig":true,"origNo":29,"q":"新时代伟大变革的里程碑意义，深刻体现在它证明了中国特色社会主义道路的正确性。从国际比较来看，这突出表现为（ ）。","options":["中国用几十年时间走完了发达国家几百年的工业化历程","中国式现代化为发展中国家走向现代化提供了全新选择","中国摆脱了“现代化=西方化”的迷思","以上都是"],"answer":"D","explain":"A、B、C项都是新时代伟大变革在国际比较视野下里程碑意义的体现。中国的发展成就打破了“历史终结论”，证明了现代化道路的多样性，为人类文明进步贡献了中国智慧和中国方案。"},{"id":"c1-o-s30","type":"single","orig":true,"origNo":30,"q":"习近平总书记强调：“中华民族伟大复兴绝不是轻轻松松、敲锣打鼓就能实现的。”这要求我们在新时代坚持和发展中国特色社会主义的过程中，必须（ ）。","options":["增强忧患意识，坚持底线思维，准备经受风高浪急甚至惊涛骇浪的重大考验","发扬斗争精神，提高斗争本领，依靠顽强斗争打开事业发展新天地","保持战略定力，坚持稳中求进工作总基调","以上都是"],"answer":"D","explain":"习近平总书记的论断深刻揭示了实现中华民族伟大复兴的艰巨性和复杂性。A、B、C项都是应对这一挑战、一以贯之推进中国特色社会主义事业所必须坚持的原则和策略。"},{"id":"c1-o-m1","type":"multi","orig":true,"origNo":1,"q":"关于中国特色社会主义进入新时代，下列理解正确的有（ ）","options":["这是我国发展新的历史方位","意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃","意味着科学社会主义在二十一世纪的中国焕发出强大生机活力","意味着中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案"],"answer":"ABCD","explain":"党的十九大报告明确指出，中国特色社会主义进入新时代，这是我国发展新的历史方位。新时代具有重大意义，即“三个意味着”，选项A、B、C、D完整概括了这“三个意味着”的内涵。"},{"id":"c1-o-m2","type":"multi","orig":true,"origNo":2,"q":"关于新时代我国社会主要矛盾，下列理解正确的有（ ）","options":["我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断","我国社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求","我国社会主要矛盾的转化，意味着我国已经跨越了社会主义初级阶段"],"answer":"ABC","explain":"A项是党的十九大报告对新时代我国社会主要矛盾的准确表述。B项和C项正确指出了主要矛盾变化与基本国情不变的辩证关系，以及这一变化对全局工作的指导意义。D项错误，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。"},{"id":"c1-o-m3","type":"multi","orig":true,"origNo":3,"q":"下列属于党的基本路线核心内容的是（ ）","options":["以经济建设为中心","坚持四项基本原则","坚持改革开放","自力更生，艰苦创业"],"answer":"ABC","explain":"党在社会主义初级阶段的基本路线核心内容是“一个中心、两个基本点”，即以经济建设为中心，坚持四项基本原则，坚持改革开放。D项“自力更生，艰苦创业”是实现基本路线的方针，但不是核心内容。"},{"id":"c1-o-m4","type":"multi","orig":true,"origNo":4,"q":"关于“五位一体”总体布局，下列表述正确的有（ ）","options":["经济建设是根本","政治建设是保证","文化建设是灵魂","社会建设是条件"],"answer":"AC","explain":"“五位一体”总体布局中，经济建设是根本，政治建设是保证，文化建设是灵魂，社会建设是条件，生态文明建设是基础。本题为多选题，正确答案为A、C。"},{"id":"c1-o-m5","type":"multi","orig":true,"origNo":5,"q":"协调推进“四个全面”战略布局，包括（ ）","options":["全面建成小康社会","全面深化改革","全面依法治国","全面从严治党"],"answer":"ABCD","explain":"“四个全面”战略布局即全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。注意：在新时代，第一个“全面”已由“全面建成小康社会”发展为“全面建设社会主义现代化国家”。"},{"id":"c1-o-m6","type":"multi","orig":true,"origNo":6,"q":"中国特色社会主义进入新时代，意味着（ ）","options":["中华民族迎来了从站起来、富起来到强起来的伟大飞跃","科学社会主义在二十一世纪的中国焕发出强大生机活力","中国特色社会主义道路、理论、制度、文化不断发展，为解决人类问题贡献了中国智慧和中国方案","我国已经成为世界强国"],"answer":"ABC","explain":"D项表述错误。我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。新时代的“三个意味着”是A、B、C选项。"},{"id":"c1-o-m7","type":"multi","orig":true,"origNo":7,"q":"下列关于坚持和发展中国特色社会主义的说法，正确的有（ ）","options":["是改革开放以来党的全部理论和实践的主题","是当代中国发展进步的根本方向","只有坚持和发展中国特色社会主义才能实现中华民族伟大复兴","中国特色社会主义是社会主义，不是别的什么主义"],"answer":"ABCD","explain":"以上四个选项均是对坚持和发展中国特色社会主义的正确表述，体现了其历史地位、现实意义和本质属性。"},{"id":"c1-o-m8","type":"multi","orig":true,"origNo":8,"q":"关于新时代伟大变革的里程碑意义，下列说法正确的有（ ）","options":["在党史上，标志着我们党在政治上更加成熟、思想上更加统一、组织上更加巩固","在新中国史上，推动我国迈上全面建设社会主义现代化国家新征程","在改革开放史上，实现了改革开放新突破，开创了改革开放新局面","在社会主义发展史上，彰显了科学社会主义的强大生命力"],"answer":"ABCD","explain":"新时代的伟大变革在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上都具有里程碑意义。本题四个选项分别对应了前“四史”中的里程碑意义。"},{"id":"c1-o-m9","type":"multi","orig":true,"origNo":9,"q":"如何理解“一以贯之坚持和发展中国特色社会主义”？以下说法正确的有（ ）","options":["需要一代又一代人接续奋斗","必须坚持党的基本路线不动摇","要不断推进理论创新、实践创新、制度创新、文化创新","要在实践中不断丰富和发展中国特色社会主义"],"answer":"ABCD","explain":"坚持和发展中国特色社会主义是一项长期而艰巨的历史任务，需要接续奋斗，必须坚持党的基本路线，并在实践中不断推进各方面的创新，丰富和发展其内涵。"},{"id":"c1-o-m10","type":"multi","orig":true,"origNo":10,"q":"下列关于党在社会主义初级阶段基本路线的认识，正确的有（ ）","options":["是党和国家的生命线、人民的幸福线","必须长期坚持，贯穿整个社会主义初级阶段","核心内容是“一个中心、两个基本点”","奋斗目标是把我国建设成为富强民主文明和谐美丽的社会主义现代化强国"],"answer":"ABCD","explain":"党的基本路线是党和国家的生命线、人民的幸福线，必须长期坚持。其核心是“一个中心、两个基本点”，奋斗目标是建设社会主义现代化强国。注意D项中的“美丽”是十九大后加入的。"},{"id":"c1-o-m11","type":"multi","orig":true,"origNo":11,"q":"关于“统筹推进‘五位一体’总体布局”和“协调推进‘四个全面’战略布局”的关系，下列理解正确的有（ ）","options":["“五位一体”是总体布局，“四个全面”是战略布局","“五位一体”是管全局、管长远的，“四个全面”是战略抓手、战略重点","两者相互促进、相互支撑，有机统一于坚持和发展中国特色社会主义的实践","“四个全面”是“五位一体”的具体化"],"answer":"ABC","explain":"D项表述不准确。“四个全面”是战略布局，是“五位一体”总体布局在当前阶段的战略重点和战略抓手，但并非简单的“具体化”。两者是总体与重点、长远与当下的关系。"},{"id":"c1-o-m12","type":"multi","orig":true,"origNo":12,"q":"新时代我国社会主要矛盾的转化，意味着（ ）","options":["我国社会主义初级阶段已经结束","我国作为世界最大发展中国家的国际地位没有变","我国社会生产力水平总体上显著提高，但发展不平衡不充分问题突出","人民对美好生活的需要日益广泛，不仅对物质文化生活提出了更高要求，而且在民主、法治、公平、正义、安全、环境等方面的要求日益增长"],"answer":"BCD","explain":"A项错误，我国仍处于并将长期处于社会主义初级阶段。主要矛盾的转化，是初级阶段内部阶段性特征的变化，没有改变我国的基本国情和国际地位。"},{"id":"c1-o-m13","type":"multi","orig":true,"origNo":13,"q":"中国特色社会主义道路、理论、制度、文化之间的关系是（ ）","options":["中国特色社会主义道路是实现途径","中国特色社会主义理论体系是行动指南","中国特色社会主义制度是根本保障","中国特色社会主义文化是精神力量"],"answer":"ABCD","explain":"这四个方面相互联系、相互作用，统一于中国特色社会主义伟大实践。道路是实现途径，理论是行动指南，制度是根本保障，文化是精神力量。"},{"id":"c1-o-m14","type":"multi","orig":true,"origNo":14,"q":"下列关于“新时代”的理解，正确的有（ ）","options":["是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代","是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代","是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代","是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代"],"answer":"ABCD","explain":"这四个选项是党的十九大报告对“新时代”内涵的全面阐述，分别从历史使命、奋斗目标、人民期盼和民族梦想等维度进行了概括。"},{"id":"c1-o-m15","type":"multi","orig":true,"origNo":15,"q":"中国特色社会主义进入新时代，对我国发展提出了新的要求。下列属于新时代新要求的有（ ）","options":["必须坚持以发展为第一要务，着力解决发展不平衡不充分问题","必须坚持和完善我国社会主义基本经济制度，推动经济高质量发展","必须坚持以人民为中心的发展思想，不断促进人的全面发展、全体人民共同富裕","必须坚持党对一切工作的领导，确保党始终总揽全局、协调各方"],"answer":"ABCD","explain":"新时代面临新矛盾、新任务，必然提出新要求。A项强调解决发展不平衡不充分问题；B项强调经济高质量发展；C项强调以人民为中心；D项强调党的领导，这些都是新时代推动事业发展的必然要求。"},{"id":"c1-o-m16","type":"multi","orig":true,"origNo":16,"q":"关于“一以贯之坚持和发展中国特色社会主义”的时代要求，下列分析正确的有（ ）","options":["必须保持政治定力，坚持实干兴邦，始终坚持和发展中国特色社会主义","必须推进国家治理体系和治理能力现代化，将制度优势转化为治理效能","必须发扬斗争精神，提高斗争本领，有效应对重大挑战、抵御重大风险、克服重大阻力、解决重大矛盾","必须不断推进党的自我革命，确保党在坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心"],"answer":"ABCD","explain":"坚持和发展中国特色社会主义是一项长期艰巨的任务，需要从政治定力、制度建设、斗争精神和党的建设等多个方面着力。这四个选项分别从战略定力、治理效能、风险应对和党的领导核心地位等角度深入阐释了新时代如何“一以贯之”的要求。"},{"id":"c1-o-m17","type":"multi","orig":true,"origNo":17,"q":"如何从“两个大局”的高度理解新时代坚持和发展中国特色社会主义的紧迫性与必要性？（ ）","options":["世界正经历百年未有之大变局，我国发展面临的外部环境深刻变化","中华民族伟大复兴进入关键时期，机遇与挑战并存","只有坚持和发展中国特色社会主义，才能在复杂多变的国际环境中保持战略主动","只有坚持和发展中国特色社会主义，才能凝聚起实现民族复兴的磅礴伟力"],"answer":"ABCD","explain":"此题要求从“中华民族伟大复兴战略全局”和“世界百年未有之大变局”这两个大局出发进行综合分析。A、B明确了“两个大局”的背景，C、D则指出了坚持和发展中国特色社会主义在应对大变局、实现民族复兴中的关键作用，逻辑严谨，层次清晰。"},{"id":"c1-o-m18","type":"multi","orig":true,"origNo":18,"q":"关于新时代伟大变革及其里程碑意义，以下说法体现了对“中华民族发展史”深刻影响的有（ ）","options":["推动我国迈上全面建设社会主义现代化国家新征程","为实现中华民族伟大复兴提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量","彰显了科学社会主义的强大生命力","标志着中华民族迎来了从站起来、富起来到强起来的伟大飞跃"],"answer":"BD","explain":"此题要求精准区分新时代伟大变革在不同“史”中的里程碑意义。A项更多体现的是在新中国史和改革开放史上的意义；C项体现的是在社会主义发展史上的意义。B项和D项则直接指向中华民族的伟大复兴进程，体现了对中华民族发展史的深刻影响。"},{"id":"c1-o-m19","type":"multi","orig":true,"origNo":19,"q":"在新时代，坚持和发展中国特色社会主义，必须统筹推进“五位一体”总体布局。下列举措中，直接服务于“社会建设”的有（ ）","options":["实施乡村振兴战略，促进城乡区域协调发展","健全基本公共服务体系，提高公共服务水平","完善社会治理体系，建设更高水平的平安中国","推动绿色低碳发展，促进人与自然和谐共生"],"answer":"BC","explain":"此题考查对“五位一体”总体布局中各领域具体内容的区分。A项“乡村振兴”主要属于“经济建设”范畴；D项“绿色低碳发展”属于“生态文明建设”范畴。B项“健全基本公共服务体系”和C项“完善社会治理体系”是“社会建设”的核心内容。"},{"id":"c1-o-m20","type":"multi","orig":true,"origNo":20,"q":"关于“坚持党的基本路线不动摇”与“一以贯之坚持和发展中国特色社会主义”的关系，下列理解最深刻的有（ ）","options":["党的基本路线是中国特色社会主义的生命线，动摇基本路线就会动摇整个事业","坚持和发展中国特色社会主义，最根本的就是要坚持党的基本路线","党的基本路线规定了中国特色社会主义的奋斗目标、中心任务和基本原则，是长期坚持的根本遵循","坚持基本路线不动摇，是确保中国特色社会主义航船行稳致远的“定盘星”"],"answer":"ABCD","explain":"此题考查对两者内在逻辑关系的深刻把握。A项指出基本路线对事业的极端重要性；B项指出坚持基本路线是坚持和发展中国特色社会主义的根本要求；C项从内容上阐明基本路线对事业的全方位规定作用；D项用比喻形象说明了基本路线在实践中的“定盘星”作用。四个选项层层递进，从不同维度深刻揭示了两者的关系。"},{"id":"c1-a-s1","type":"single","orig":false,"origNo":null,"q":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的（ ）。","options":["时代产物","时代精华","最新成果","集中体现"],"answer":"B","explain":"习近平新时代中国特色社会主义思想是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。"},{"id":"c1-a-s2","type":"single","orig":false,"origNo":null,"q":"习近平新时代中国特色社会主义思想系统回答了新时代坚持和发展中国特色社会主义、建设社会主义现代化强国、建设长期执政的马克思主义政党等重大时代课题，其核心内容包括“十个明确”“十四个坚持”“十三个方面成就”。其中，“十个明确”回答的是（ ）。","options":["新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题","新时代怎样实现共同富裕","新时代如何推进党的建设新的伟大工程","新时代如何构建人类命运共同体"],"answer":"A","explain":"“十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题；“十四个坚持”是基本方略，“十三个方面成就”是实践成果。"},{"id":"c1-a-s3","type":"single","orig":false,"origNo":null,"q":"“十个明确”第一条明确指出，中国特色社会主义最本质的特征是（ ），中国特色社会主义制度的最大优势是（ ）。","options":["人民民主专政；改革开放","中国共产党领导；中国共产党领导","以经济建设为中心；依法治国","共同富裕；人民当家作主"],"answer":"B","explain":"“十个明确”第一条明确指出：明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量。"},{"id":"c1-a-s4","type":"single","orig":false,"origNo":null,"q":"习近平新时代中国特色社会主义思想的世界观和方法论，集中体现为“六个必须坚持”。其中居于首位的是（ ）。","options":["必须坚持自信自立","必须坚持人民至上","必须坚持守正创新","必须坚持胸怀天下"],"answer":"B","explain":"“六个必须坚持”即必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下，其中人民至上居于首位。"},{"id":"c1-a-s5","type":"single","orig":false,"origNo":null,"q":"坚持和发展中国特色社会主义，总依据是（ ）。","options":["社会主义初级阶段","新时代","我国社会主要矛盾","党的基本路线"],"answer":"A","explain":"社会主义初级阶段是当代中国最大的国情，是坚持和发展中国特色社会主义的总依据。我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。"},{"id":"c1-a-s6","type":"single","orig":false,"origNo":null,"q":"“两个确立”与“两个维护”是新时代最重要的政治要求。“两个维护”是指（ ）。","options":["坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导","坚决维护国家主权，坚决维护国家安全","坚决维护党的团结统一，坚决维护社会和谐稳定","坚决维护中国特色社会主义制度，坚决维护党的基本路线"],"answer":"A","explain":"“两个维护”即坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。"},{"id":"c1-a-s7","type":"single","orig":false,"origNo":null,"q":"“四个全面”战略布局中，作为战略目标的是（ ）。","options":["全面建设社会主义现代化国家","全面深化改革","全面依法治国","全面从严治党"],"answer":"A","explain":"“四个全面”战略布局中，全面建设社会主义现代化国家是战略目标，全面深化改革是动力，全面依法治国是保障，全面从严治党是根本保证。"},{"id":"c1-a-s8","type":"single","orig":false,"origNo":null,"q":"关于新时代我国社会主要矛盾的变化，下列判断正确的是（ ）。","options":["我国社会主义初级阶段已经结束","我国已不再是世界最大发展中国家","我国仍处于并将长期处于社会主义初级阶段的基本国情没有变","我国社会主要矛盾已经彻底解决"],"answer":"C","explain":"我国社会主要矛盾的变化是关系全局的历史性变化，但没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情，也没有改变我国是世界最大发展中国家的国际地位。"},{"id":"c1-a-s9","type":"single","orig":false,"origNo":null,"q":"党的二十大报告指出，新时代十年伟大变革在中华民族发展史上的里程碑意义，集中体现为（ ）。","options":["实现了第一个百年奋斗目标，推动中华民族伟大复兴进入了不可逆转的历史进程","完成了社会主义工业化","实现了共同富裕","建成了社会主义现代化强国"],"answer":"A","explain":"新时代十年，完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标，推动中华民族伟大复兴进入了不可逆转的历史进程，这是其在中华民族发展史上最根本的里程碑意义。"},{"id":"c1-a-s10","type":"single","orig":false,"origNo":null,"q":"《中共中央关于党的百年奋斗重大成就和历史经验的决议》用“十个明确”概括了习近平新时代中国特色社会主义思想的核心内容，其中明确全面深化改革总目标是（ ）。","options":["完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建设社会主义市场经济体制","实现共同富裕","建成社会主义现代化强国"],"answer":"A","explain":"“十个明确”明确：全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。"},{"id":"c1-a-m1","type":"multi","orig":false,"origNo":null,"q":"习近平新时代中国特色社会主义思想科学体系的组成部分包括（ ）。","options":["“十个明确”","“十四个坚持”","“十三个方面成就”","“六个必须坚持”"],"answer":"ABCD","explain":"习近平新时代中国特色社会主义思想以“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”为内容体系，构成系统完整的科学理论体系。"},{"id":"c1-a-m2","type":"multi","orig":false,"origNo":null,"q":"“六个必须坚持”是习近平新时代中国特色社会主义思想的世界观和方法论，包括（ ）。","options":["必须坚持人民至上、自信自立","必须坚持守正创新、问题导向","必须坚持系统观念、胸怀天下","必须坚持斗争精神、底线思维"],"answer":"ABC","explain":"“六个必须坚持”即必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。D项不属于“六个必须坚持”。"},{"id":"c1-a-m3","type":"multi","orig":false,"origNo":null,"q":"“两个结合”是指（ ）。","options":["把马克思主义基本原理同中国具体实际相结合","把马克思主义基本原理同中华优秀传统文化相结合","把马克思主义基本原理同西方思想文化相结合","把马克思主义基本原理同革命实践相结合"],"answer":"AB","explain":"“两个结合”即把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，是推进马克思主义中国化时代化的根本途径。"},{"id":"c1-a-m4","type":"multi","orig":false,"origNo":null,"q":"新时代坚持和发展中国特色社会主义，全党必须增强的“四个意识”是（ ）。","options":["政治意识","大局意识","核心意识","看齐意识"],"answer":"ABCD","explain":"“四个意识”即政治意识、大局意识、核心意识、看齐意识，是维护党中央权威和集中统一领导的重要要求。"},{"id":"c1-a-m5","type":"multi","orig":false,"origNo":null,"q":"党的二十大报告指出，前进道路上必须牢牢把握的重大原则包括（ ）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放、坚持发扬斗争精神"],"answer":"ABCD","explain":"五项重大原则即坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。"},{"id":"c1-a-f1","type":"fill","orig":false,"origNo":null,"q":"新时代我国社会主要矛盾是人民日益增长的____需要和不平衡不充分的发展之间的矛盾。","options":[],"answer":["美好生活"],"explain":"党的十九大的重大论断：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"id":"c1-a-f2","type":"fill","orig":false,"origNo":null,"q":"中国共产党领导是中国特色社会主义____的特征，是中国特色社会主义制度的____优势。","options":[],"answer":["最本质；最大"],"explain":"中国共产党领导是中国特色社会主义最本质的特征、中国特色社会主义制度的最大优势。"},{"id":"c1-a-f3","type":"fill","orig":false,"origNo":null,"q":"党的基本路线核心内容“一个中心、两个基本点”：“一个中心”指____为中心，“两个基本点”指坚持四项基本原则、坚持____。","options":[],"answer":["以经济建设；改革开放"],"explain":"“一个中心”是以经济建设为中心，“两个基本点”是坚持四项基本原则和坚持改革开放。"},{"id":"c1-a-f4","type":"fill","orig":false,"origNo":null,"q":"“五位一体”总体布局指____建设、政治建设、文化建设、社会建设、____建设。","options":[],"answer":["经济；生态文明"],"explain":"“五位一体”即经济建设、政治建设、文化建设、社会建设、生态文明建设。"},{"id":"c1-a-f5","type":"fill","orig":false,"origNo":null,"q":"“四个全面”战略布局指全面建设社会主义现代化国家、全面____、全面依法治国、全面____。","options":[],"answer":["深化改革；从严治党"],"explain":"“四个全面”即全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"},{"id":"c1-a-f6","type":"fill","orig":false,"origNo":null,"q":"“两个确立”指确立习近平同志党中央的核心、____的核心地位，确立习近平新时代中国特色社会主义思想的____地位。","options":[],"answer":["全党；指导"],"explain":"“两个确立”是党在新时代取得的重大政治成果。"},{"id":"c1-a-f7","type":"fill","orig":false,"origNo":null,"q":"中国特色社会主义道路、理论、制度、文化统一于____的伟大实践。","options":[],"answer":["中国特色社会主义"],"explain":"四者相互联系、相互作用，统一于中国特色社会主义伟大实践。"},{"id":"c1-a-f8","type":"fill","orig":false,"origNo":null,"q":"我国仍处于并将长期处于____的基本国情没有变，我国是世界最大____的国际地位没有变。","options":[],"answer":["社会主义初级阶段；发展中国家"],"explain":"这是把握新时代“变与不变”的两个重要判断。"}]},{"id":"c2","title":"第二章 以中国式现代化全面推进中华民族伟大复兴","note":"原题来源：第二章练习题.docx（单选30+多选20）；补充题依据：《习近平新时代中国特色社会主义思想概论》2023年版教材要点及党的二十大报告。","questions":[{"id":"c2-o-s1","type":"single","orig":true,"origNo":1,"q":"实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。中国梦的本质是（ ）。","options":["国家富强、民族振兴、人民幸福","经济腾飞、政治清明、文化繁荣","全面建成小康社会","实现共产主义"],"answer":"A","explain":"本题考察中国梦的本质内涵。习近平总书记明确指出，中国梦的本质是国家富强、民族振兴、人民幸福。选项B、C、D均为中国梦在不同阶段或不同领域的体现或目标，并非其本质。"},{"id":"c2-o-s2","type":"single","orig":true,"origNo":2,"q":"“两个一百年”奋斗目标的第一个百年奋斗目标指的是（ ）。","options":["实现中华民族伟大复兴","全面建成小康社会","基本实现社会主义现代化","建成社会主义现代化强国"],"answer":"B","explain":"本题考察“两个一百年”奋斗目标的具体内容。第一个百年奋斗目标是在中国共产党成立100年时（2021年）全面建成小康社会。选项A是近代以来最伟大的梦想，选项C和D是第二个百年奋斗目标的不同阶段。"},{"id":"c2-o-s3","type":"single","orig":true,"origNo":3,"q":"中国式现代化是人口规模巨大的现代化。我国14亿多人口整体迈进现代化社会，其规模超过现有发达国家人口的总和，这决定了我国现代化道路的（ ）。","options":["独特性与艰巨性","先进性与引领性","普遍性与规律性","开放性与包容性"],"answer":"A","explain":"本题考察中国式现代化“人口规模巨大”这一特征带来的影响。巨大的规模决定了我国现代化不能简单套用他国模式，必须独立自主、艰巨探索，因此具有独特性与艰巨性。"},{"id":"c2-o-s4","type":"single","orig":true,"origNo":4,"q":"中国式现代化是全体人民共同富裕的现代化。这是中国式现代化区别于西方现代化的（ ）。","options":["根本标志","重要前提","物质基础","制度保障"],"answer":"A","explain":"本题考察中国式现代化的本质特征。西方现代化以资本为中心，导致贫富两极分化；而中国式现代化以人民为中心，追求全体人民共同富裕，这是二者最本质的区别。"},{"id":"c2-o-s5","type":"single","orig":true,"origNo":5,"q":"推进中国式现代化，必须牢牢把握的重大原则中，居于首位的是（ ）。","options":["坚持中国特色社会主义","坚持和加强党的全面领导","坚持以人民为中心的发展思想","坚持深化改革开放"],"answer":"B","explain":"本题考察推进中国式现代化重大原则的排序。坚持和加强党的全面领导是中国特色社会主义最本质的特征和最大优势，是确保现代化正确方向的根本保证，因此居于首位。"},{"id":"c2-o-s6","type":"single","orig":true,"origNo":6,"q":"全面建成小康社会，实现了中华民族千百年来的（ ）。","options":["大同梦","小康梦","强国梦","复兴梦"],"answer":"B","explain":"本题考察全面建成小康社会的历史意义。“小康”是中华民族自古以来追求的理想社会状态，全面建成小康社会标志着这一千年梦想变为现实。"},{"id":"c2-o-s7","type":"single","orig":true,"origNo":7,"q":"中国梦归根到底是（ ）的梦，必须紧紧依靠人民来实现。","options":["国家","民族","人民","个人"],"answer":"C","explain":"本题考察中国梦的主体。习近平总书记指出，中国梦归根到底是人民的梦，必须不断为人民造福，也必须紧紧依靠人民来实现。"},{"id":"c2-o-s8","type":"single","orig":true,"origNo":8,"q":"中国式现代化是物质文明和精神文明（ ）的现代化。","options":["先后发展","协调发展","重点发展","交替发展"],"answer":"B","explain":"本题考察中国式现代化的特征。物质富足、精神富有是社会主义现代化的根本要求，二者必须协调发展，不能“一手硬、一手软”。"},{"id":"c2-o-s9","type":"single","orig":true,"origNo":9,"q":"中国式现代化是人与自然和谐共生的现代化，这体现了（ ）的理念。","options":["人类中心主义","生态中心主义","绿水青山就是金山银山","先污染后治理"],"answer":"C","explain":"本题考察中国式现代化“人与自然和谐共生”特征所体现的发展理念。“绿水青山就是金山银山”是这一特征的核心要义，强调经济发展与生态保护相协调。"},{"id":"c2-o-s10","type":"single","orig":true,"origNo":10,"q":"中国式现代化是走和平发展道路的现代化，这决定了中国式现代化（ ）。","options":["依附于现有国际体系","通过殖民扩张实现","主要依靠自身力量实现发展","追求全球霸权"],"answer":"C","explain":"本题考察中国式现代化“走和平发展道路”的内涵。中国式现代化摒弃了西方通过战争、殖民、掠夺实现现代化的老路，强调通过自身努力和和平方式实现发展。"},{"id":"c2-o-s11","type":"single","orig":true,"origNo":11,"q":"“中国梦是国家的、民族的，也是每一个中国人的。”这句话最能体现（ ）。","options":["国家梦与个人梦的辩证统一","个人利益高于国家利益","国家梦与个人梦互不相干","个人梦的实现依赖于国家梦的实现，反之则不成立"],"answer":"A","explain":"本题考察中国梦与个人梦的关系。国家好、民族好，大家才会好；同时，每个人的梦想汇集起来，才能成就国家梦。二者是相互依存、相互促进的辩证统一关系。"},{"id":"c2-o-s12","type":"single","orig":true,"origNo":12,"q":"某大学生毕业后选择到西部偏远山区支教，他说：“虽然条件艰苦，但能帮助那里的孩子看到更广阔的世界，这就是我的中国梦。”这体现了个人理想与社会理想的关系是（ ）。","options":["社会理想是实现个人理想的基础","个人理想与社会理想完全一致","个人理想要以社会理想为指引，并在社会实践中实现","社会理想可以取代个人理想"],"answer":"C","explain":"本题通过案例考察个人理想与社会理想的关系。该大学生的选择将个人的人生追求与国家教育事业发展、民族素质提升相结合，体现了以社会理想为指引，在奉献社会中实现个人价值。"},{"id":"c2-o-s13","type":"single","orig":true,"origNo":13,"q":"全面建成小康社会后，我国开启了（ ）的新征程。","options":["基本实现社会主义现代化","全面建成社会主义现代化强国","全面建设社会主义现代化国家","实现中华民族伟大复兴"],"answer":"C","explain":"本题考察“两个一百年”奋斗目标的历史衔接。全面建成小康社会后，我国进入“全面建设社会主义现代化国家”的新发展阶段，目标是到2035年基本实现社会主义现代化，到本世纪中叶建成社会主义现代化强国。"},{"id":"c2-o-s14","type":"single","orig":true,"origNo":14,"q":"从“全面建成小康社会”到“全面建设社会主义现代化国家”，这一转变的核心内涵是（ ）。","options":["从解决“有没有”转向解决“好不好”","从追求经济增长转向追求全面进步","从国内发展转向国际竞争","从政府主导转向市场主导"],"answer":"A","explain":"本题考察两个发展阶段核心任务的变化。全面建成小康社会主要解决“有没有”的问题，而全面建设社会主义现代化国家则聚焦于解决“好不好”的问题，追求高质量发展和高品质生活。"},{"id":"c2-o-s15","type":"single","orig":true,"origNo":15,"q":"中国式现代化坚持“以人民为中心”，而西方现代化以“资本为中心”。这两种发展逻辑的根本区别在于（ ）。","options":["发展速度的快慢","发展成果的分配方式","对生态环境的态度","对国际秩序的影响"],"answer":"B","explain":"本题考察两种现代化模式的本质区别。以人民为中心，意味着发展成果由人民共享，追求共同富裕；以资本为中心，则导致资本收益最大化，造成贫富差距。因此，根本区别在于发展成果的分配方式。"},{"id":"c2-o-s16","type":"single","orig":true,"origNo":16,"q":"推进中国式现代化，需要正确处理一系列重大关系。其中，“活力与秩序”的关系要求我们（ ）。","options":["为了秩序而牺牲活力","为了活力而放弃秩序","在保持社会秩序稳定的前提下，激发社会创造活力","先发展活力，再建立秩序"],"answer":"C","explain":"本题考察“活力与秩序”这一对关系的处理原则。中国式现代化追求既充满活力又安定有序，二者是辩证统一的。必须在稳定的秩序中激发活力，以活力促进更高水平的稳定。"},{"id":"c2-o-s17","type":"single","orig":true,"origNo":17,"q":"中国式现代化的本质要求中，排在首位的是（ ）。","options":["坚持中国共产党领导","实现高质量发展","发展全过程人民民主","丰富人民精神世界"],"answer":"A","explain":"本题考察中国式现代化本质要求的排序。坚持中国共产党领导是中国式现代化的最本质特征和最大优势，是其他一切要求得以实现的政治保证。"},{"id":"c2-o-s18","type":"single","orig":true,"origNo":18,"q":"“共同富裕不是少数人的富裕，也不是整齐划一的平均主义。”这句话强调的是（ ）。","options":["共同富裕要消除一切差距","共同富裕是全体人民的富裕，但允许有合理差距","共同富裕就是同步富裕、同时富裕","共同富裕主要依靠政府救济"],"answer":"B","explain":"本题考察对共同富裕科学内涵的理解。共同富裕是全体人民的普遍富裕，但不是同等富裕、同步富裕，更不是搞平均主义。它承认合理合法的收入差距，注重机会公平和过程公平。"},{"id":"c2-o-s19","type":"single","orig":true,"origNo":19,"q":"某企业在发展过程中，主动投资数亿元用于污水处理和厂区绿化，实现了经济效益与环境效益的双赢。这体现了中国式现代化（ ）的特征。","options":["人口规模巨大","全体人民共同富裕","人与自然和谐共生","走和平发展道路"],"answer":"C","explain":"本题通过企业案例考察中国式现代化特征。企业主动进行环保投入，追求绿色低碳发展，正是“人与自然和谐共生”现代化理念在企业层面的具体实践。"},{"id":"c2-o-s20","type":"single","orig":true,"origNo":20,"q":"中国提出“一带一路”倡议，致力于构建人类命运共同体，这体现了中国式现代化（ ）的特征。","options":["人口规模巨大","全体人民共同富裕","物质文明和精神文明相协调","走和平发展道路"],"answer":"D","explain":"本题考察中国式现代化“走和平发展道路”特征的国际体现。“一带一路”倡议坚持共商共建共享原则，推动各国合作共赢，是中国坚持和平发展、促进共同发展的生动实践。"},{"id":"c2-o-s21","type":"single","orig":true,"origNo":21,"q":"有观点认为，现代化就是“西方化”，中国要想实现现代化，必须全盘复制西方模式。运用中国式现代化的理论，以下驳斥最有力的是（ ）。","options":["西方现代化模式已经过时，不具有参考价值","中国传统文化与西方文化存在根本冲突，无法融合","现代化道路具有多样性，各国国情不同，应探索符合自身特点的现代化道路","中国人口规模巨大，无法复制西方高消费、高排放的现代化模式"],"answer":"C","explain":"本题考察对现代化道路多样性的理解。中国式现代化的成功实践表明，现代化不是单选题，历史条件的多样性决定了各国现代化道路的多样性。中国式现代化打破了“现代化=西方化”的迷思，提供了新的选择。选项D虽然正确，但仅是其中一个方面的原因，不够全面；选项C从理论上进行了根本性的驳斥。"},{"id":"c2-o-s22","type":"single","orig":true,"origNo":22,"q":"实现中华民族伟大复兴，必须坚持“四个自信”。其中，中国式现代化道路的成功实践，最直接地增强了我们的（ ）。","options":["道路自信","理论自信","制度自信","文化自信"],"answer":"A","explain":"本题考察“四个自信”与中国式现代化的关系。中国式现代化本身就是一条全新的现代化道路，其成功证明了这条道路的正确性，因此最直接地增强了我们的道路自信。"},{"id":"c2-o-s23","type":"single","orig":true,"origNo":23,"q":"中国式现代化是“并联式”的发展过程，工业化、信息化、城镇化、农业现代化叠加发展；而西方现代化是“串联式”的过程，是依次发展的。这一区别决定了中国式现代化（ ）。","options":["发展速度必然慢于西方","面临的任务更加复杂艰巨，机遇与挑战并存","可以完全避免西方现代化过程中出现的问题","必须放弃农业现代化，优先发展信息化"],"answer":"B","explain":"本题考察中国式现代化发展过程的特殊性。“并联式”发展意味着在较短时间内要完成西方几百年完成的多个任务，任务叠加，时间压缩，因此更加复杂艰巨。但同时，也可以利用后发优势，实现跨越式发展，机遇与挑战并存。"},{"id":"c2-o-s24","type":"single","orig":true,"origNo":24,"q":"推进中国式现代化，需要正确处理顶层设计与实践探索的关系。这要求我们（ ）。","options":["只依靠中央的顶层设计，基层只需执行","鼓励各地大胆试、大胆闯，无需统一规划","既要加强宏观思考和战略谋划，也要鼓励基层大胆探索、先行先试","顶层设计一旦制定，就不能再根据实践进行调整"],"answer":"C","explain":"本题考察“顶层设计与实践探索”这一对关系的处理。二者是辩证统一的。顶层设计为实践探索提供方向指引，实践探索为顶层设计提供经验支撑，并推动其不断完善。选项A和B各执一端，选项D否认了发展的动态性。"},{"id":"c2-o-s25","type":"single","orig":true,"origNo":25,"q":"中国式现代化创造了人类文明新形态。这一“新”最根本的体现是（ ）。","options":["实现了对资本主义文明的彻底否定","坚持和发展了社会主义文明，并吸收了人类一切优秀文明成果","完全继承了中华传统文明","建立了一套全新的、取代所有其他文明的国际规则"],"answer":"B","explain":"本题考察对人类文明新形态“新”在何处的理解。中国式现代化开创的人类文明新形态，不是对资本主义文明的简单否定，也不是对传统文明的照搬，而是坚持和发展了社会主义文明，并吸收了包括资本主义文明成果在内的人类一切优秀文明成果，实现了综合创新。"},{"id":"c2-o-s26","type":"single","orig":true,"origNo":26,"q":"某学者指出：“中国式现代化既要‘物的全面丰富’，也要‘人的全面发展’。”这一论断体现了（ ）。","options":["物质文明和精神文明相协调的现代化","人口规模巨大的现代化","全体人民共同富裕的现代化","人与自然和谐共生的现代化"],"answer":"A","explain":"本题考察对“物的全面丰富”与“人的全面发展”关系的理解。“物的全面丰富”指的是物质文明的高度发达，“人的全面发展”指的是精神文明的提升和人的素质的全面提高。二者并重，正是“物质文明和精神文明相协调”这一特征的深刻体现。"},{"id":"c2-o-s27","type":"single","orig":true,"origNo":27,"q":"在推进中国式现代化的过程中，必须坚持问题导向。当前，发展不平衡不充分问题仍然突出。要解决这一问题，最根本的途径是（ ）。","options":["加快城镇化进程","实施乡村振兴战略","坚持以推动高质量发展为主题","加大政府转移支付力度"],"answer":"C","explain":"本题考察解决发展不平衡不充分问题的根本途径。发展不平衡不充分是发展质量不高的表现。因此，解决这一问题的根本在于坚持高质量发展，通过转变发展方式、优化经济结构、转换增长动力，实现更高质量、更有效率、更加公平、更可持续、更为安全的发展。"},{"id":"c2-o-s28","type":"single","orig":true,"origNo":28,"q":"“中国式现代化，是中国共产党领导的社会主义现代化。”这句话强调了（ ）。","options":["中国式现代化的领导力量和根本性质","中国式现代化的实现路径","中国式现代化的国际影响","中国式现代化的历史任务"],"answer":"A","explain":"本题考察对中国式现代化定义的理解。这句话明确指出了中国式现代化的两个核心要素：领导力量是中国共产党，根本性质是社会主义现代化。这是理解中国式现代化一切特征和要求的逻辑起点。"},{"id":"c2-o-s29","type":"single","orig":true,"origNo":29,"q":"与中国式现代化相比，西方现代化过程中出现了严重的贫富分化、社会撕裂、生态危机等问题。这启示我们，中国式现代化要（ ）。","options":["完全避免与西方接触，独立发展","汲取西方现代化的教训，发挥后发优势，实现更高质量的发展","优先发展经济，再集中解决社会问题","否定市场经济，完全由政府配置资源"],"answer":"B","explain":"本题考察中国式现代化对西方现代化的扬弃。中国式现代化不是闭门造车，而是在开放中学习借鉴，同时深刻反思西方现代化的弊端，力求避免重蹈覆辙，走出一条更可持续、更公平、更和平的新路。"},{"id":"c2-o-s30","type":"single","orig":true,"origNo":30,"q":"实现中华民族伟大复兴的中国梦，必须进行伟大斗争、建设伟大工程、推进伟大事业。其中，起决定性作用的是（ ）。","options":["伟大斗争","伟大工程","伟大事业","伟大梦想"],"answer":"B","explain":"本题考察“四个伟大”之间的关系。伟大梦想是目标，伟大斗争是手段，伟大事业是路径，伟大工程是保证。其中，党的建设新的伟大工程起决定性作用，因为党是最高政治领导力量，办好中国的事情关键在党。"},{"id":"c2-o-m1","type":"multi","orig":true,"origNo":1,"q":"关于中华民族伟大复兴的中国梦，以下表述正确的有（ ）。","options":["中国梦的本质是国家富强、民族振兴、人民幸福","中国梦是国家的梦、民族的梦，也是每一个中国人的梦","实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量","中国梦是虚无缥缈的宏大叙事，与个人生活没有直接关系"],"answer":"ABC","explain":"中国梦归根到底是人民的梦，必须紧紧依靠人民来实现，与个人梦想紧密相连。选项D否认了个人与国家的联系，表述错误。"},{"id":"c2-o-m2","type":"multi","orig":true,"origNo":2,"q":"全面建成小康社会是中华民族伟大复兴征程上的一个重要里程碑。其重大意义体现在（ ）。","options":["实现了第一个百年奋斗目标","为开启全面建设社会主义现代化国家新征程奠定了坚实基础","标志着我国已经进入发达国家行列","是中国共产党和中国人民团结奋斗赢得的历史性胜利"],"answer":"ABD","explain":"全面建成小康社会是中华民族发展史上的一个里程碑，但我国仍处于并将长期处于社会主义初级阶段，仍是世界最大发展中国家，选项C表述不准确。"},{"id":"c2-o-m3","type":"multi","orig":true,"origNo":3,"q":"中国式现代化是人口规模巨大的现代化。这一特征决定了（ ）。","options":["我国现代化的发展途径和推进方式必然具有自身的特点","必须始终保持历史耐心，坚持稳中求进、循序渐进","可以简单套用其他国家现代化的经验模式","需要付出更加艰巨的努力，任务极其艰巨繁重"],"answer":"ABD","explain":"人口规模巨大是我国的基本国情，这决定了我们的现代化不能照搬他国模式，必须独立自主、因地制宜。"},{"id":"c2-o-m4","type":"multi","orig":true,"origNo":4,"q":"中国式现代化的本质要求包括（ ）。","options":["坚持中国共产党领导","实现全体人民共同富裕","促进人与自然和谐共生","走西方资本主义现代化的老路"],"answer":"ABC","explain":"中国式现代化是中国共产党领导的社会主义现代化，其本质要求明确区别于资本主义现代化，选项D错误。"},{"id":"c2-o-m5","type":"multi","orig":true,"origNo":5,"q":"推进中国式现代化需要牢牢把握的重大原则包括（ ）。","options":["坚持和加强党的全面领导","坚持中国特色社会主义道路","坚持以人民为中心的发展思想","坚持深化改革开放"],"answer":"ABCD","explain":"以上四项均为推进中国式现代化必须牢牢把握的重大原则，此外还包括坚持发扬斗争精神。"},{"id":"c2-o-m6","type":"multi","orig":true,"origNo":6,"q":"中国式现代化是走和平发展道路的现代化。这体现了（ ）。","options":["中华民族爱好和平的文化传统","中国共产党致力于构建人类命运共同体","中国式现代化不是通过殖民扩张实现的","中国将放弃维护自身国家利益的权利"],"answer":"ABC","explain":"走和平发展道路，是中国基于自身国情和文化传统的必然选择，但绝不意味着放弃正当权益，更不能牺牲国家核心利益。"},{"id":"c2-o-m7","type":"multi","orig":true,"origNo":7,"q":"关于个人梦想与中国梦的关系，理解正确的有（ ）。","options":["中国梦为个人梦想的实现提供了广阔舞台","个人梦想的实现是国家富强、民族振兴的基础","只有把个人理想融入国家和民族的事业中，才能最终成就一番事业","个人梦想与中国梦是完全对立的"],"answer":"ABC","explain":"个人梦想与国家梦想是辩证统一的。国家好，民族好，大家才会好；同时，每个人的奋斗汇聚起来就是实现中国梦的磅礴力量。"},{"id":"c2-o-m8","type":"multi","orig":true,"origNo":8,"q":"全面建成小康社会后，我国开启了全面建设社会主义现代化国家的新征程。根据“两步走”战略安排，到2035年的目标是（ ）。","options":["基本实现社会主义现代化","全面实现中华民族伟大复兴","进入创新型国家前列","基本实现新型工业化、信息化、城镇化、农业现代化"],"answer":"ACD","explain":"到2035年，我国的目标是基本实现社会主义现代化，而全面实现中华民族伟大复兴是到本世纪中叶的目标。选项C和D是2035年目标的具体描述。"},{"id":"c2-o-m9","type":"multi","orig":true,"origNo":9,"q":"中国式现代化是全体人民共同富裕的现代化。实现共同富裕，需要（ ）。","options":["坚持按劳分配为主体、多种分配方式并存","在做大“蛋糕”的同时分好“蛋糕”","平均主义，同步富裕","着力解决地区差距、城乡差距、收入差距问题"],"answer":"ABD","explain":"共同富裕不是少数人的富裕，也不是整齐划一的平均主义，更不是同步富裕、同等富裕，而是通过共同努力、共同奋斗，逐步实现全体人民的富裕。"},{"id":"c2-o-m10","type":"multi","orig":true,"origNo":10,"q":"推进中国式现代化需要正确处理一系列重大关系，其中包括（ ）。","options":["顶层设计与实践探索的关系","战略与策略的关系","守正与创新的关系","效率与公平的关系"],"answer":"ABCD","explain":"以上四项均为推进中国式现代化需要正确处理的重大关系。此外还包括活力与秩序、自立自强与对外开放的关系。"},{"id":"c2-o-m11","type":"multi","orig":true,"origNo":11,"q":"中国式现代化创造了人类文明新形态。这一新形态体现在（ ）。","options":["物质文明、政治文明、精神文明、社会文明、生态文明协调发展","打破了“现代化=西方化”的迷思","为发展中国家实现现代化提供了全新选择","是放之四海而皆准的现代化标准模式"],"answer":"ABC","explain":"中国式现代化是根植于中国国情的，具有鲜明的中国特色，它证明了现代化道路的多样性，但并非要求其他国家完全照搬。"},{"id":"c2-o-m12","type":"multi","orig":true,"origNo":12,"q":"青年学生要在中国式现代化建设中挺膺担当，需要做到（ ）。","options":["树立远大理想，将个人前途与国家命运紧密结合","练就过硬本领，掌握科学文化知识和专业技能","只关注个人学业，不关心国家大事","勇于创新创造，在科技攻关、乡村振兴等领域贡献力量"],"answer":"ABD","explain":"新时代青年应将个人发展融入国家发展大局，既要仰望星空，又要脚踏实地。"},{"id":"c2-o-m13","type":"multi","orig":true,"origNo":13,"q":"在推进中国式现代化的过程中，强调“敢于斗争、善于斗争”。这是因为（ ）。","options":["实现伟大梦想必然会遇到各种困难和挑战","发扬斗争精神是克服前进道路上风险考验的必然要求","斗争是目的，为了斗争而斗争","要在原则问题上寸步不让，在策略问题上灵活机动"],"answer":"ABD","explain":"斗争是手段而非目的，我们的斗争是为了解决矛盾、推动发展、实现目标。"},{"id":"c2-o-m14","type":"multi","orig":true,"origNo":14,"q":"中国式现代化与西方现代化的本质区别在于（ ）。","options":["是否坚持中国共产党的领导","是否以人民为中心","是否实现全体人民共同富裕","是否以资本为中心"],"answer":"ABC","explain":"西方现代化以资本为中心，追求少数人的富裕，而中国式现代化坚持党的领导，以人民为中心，追求共同富裕，这是本质区别。"},{"id":"c2-o-m15","type":"multi","orig":true,"origNo":15,"q":"从“小康社会”到“中国式现代化”，中国共产党带领人民不断探索发展道路。这一历程深刻体现了（ ）。","options":["马克思主义基本原理同中国具体实际相结合","中国特色社会主义道路的连续性和阶段性统一","发展目标从解决温饱到追求全面高质量发展的跃升","对社会主义建设规律认识的不断深化"],"answer":"ABCD","explain":"这一历程是理论与实践良性互动的结果，体现了党对发展规律的深刻把握，以及战略目标与时俱进的特点。"},{"id":"c2-o-m16","type":"multi","orig":true,"origNo":16,"q":"在推进中国式现代化进程中，必须坚持“绿水青山就是金山银山”的理念。这要求我们（ ）。","options":["坚定不移走生产发展、生活富裕、生态良好的文明发展道路","把生态效益放在首位，可以暂时牺牲经济效益","加快发展方式绿色转型，推动产业结构优化升级","坚持山水林田湖草沙一体化保护和系统治理"],"answer":"ACD","explain":"强调生态保护并不意味着放弃经济发展，而是要追求高质量发展，实现生态效益、经济效益、社会效益的统一。"},{"id":"c2-o-m17","type":"multi","orig":true,"origNo":17,"q":"中国式现代化强调“物质富足、精神富有”。这意味着（ ）。","options":["物质文明和精神文明要两手抓，两手都要硬","在满足人民物质需求的同时，要丰富人民精神世界","要弘扬中华优秀传统文化，培育和践行社会主义核心价值观","物质文明发展起来后，精神文明自然会提升"],"answer":"ABC","explain":"物质文明和精神文明协调发展是现代化的内在要求，精神文明不会随物质丰富而自发提升，需要主动建设。"},{"id":"c2-o-m18","type":"multi","orig":true,"origNo":18,"q":"分析“中国式现代化是走和平发展道路的现代化”与“构建人类命运共同体”之间的内在联系，以下理解正确的有（ ）。","options":["和平发展是构建人类命运共同体的实践路径","构建人类命运共同体是和平发展道路的目标指向","两者都体现了中国对全球治理体系变革的责任担当","两者都否定了国家间的竞争和冲突"],"answer":"ABC","explain":"和平发展与构建人类命运共同体相辅相成，但并非否定国家间的正常竞争，而是倡导合作共赢的新型国际关系。"},{"id":"c2-o-m19","type":"multi","orig":true,"origNo":19,"q":"如何理解“中国式现代化创造了人类文明新形态”？以下分析正确的有（ ）。","options":["它打破了西方现代化模式的唯一性，证明了现代化道路的多样性","它坚持人民至上，超越了西方以资本为中心的发展逻辑","它坚持人与自然和谐共生，超越了西方先污染后治理的老路","它坚持和平发展，超越了西方通过殖民扩张实现现代化的旧路"],"answer":"ABCD","explain":"中国式现代化的成功实践，从价值取向、发展方式、国际关系等多个维度实现了对西方现代化模式的超越，为人类探索更好的社会制度提供了中国方案。"},{"id":"c2-o-m20","type":"multi","orig":true,"origNo":20,"q":"结合“两步走”战略安排，分析当前青年一代在实现第二个百年奋斗目标中的作用。以下表述准确的有（ ）。","options":["青年一代的人生黄金期与实现第二个百年奋斗目标的历史进程高度契合","青年是全面建成社会主义现代化强国的见证者、参与者和贡献者","青年只需专注于个人发展，国家发展是成年人的事","青年要勇担时代重任，将青春奋斗融入党和人民的事业"],"answer":"ABD","explain":"当代青年生逢其时，重任在肩，既是实现中华民族伟大复兴的亲历者和见证者，更是主要的建设者和奋斗者。"},{"id":"c2-a-s1","type":"single","orig":false,"origNo":null,"q":"中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的（ ）。","options":["中国特色","普遍特征","先进经验","发展模式"],"answer":"A","explain":"中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色，这是其基本定性。"},{"id":"c2-a-s2","type":"single","orig":false,"origNo":null,"q":"全面建设社会主义现代化国家的首要任务是（ ）。","options":["高质量发展","科技自立自强","全面深化改革","促进共同富裕"],"answer":"A","explain":"党的二十大报告明确指出，高质量发展是全面建设社会主义现代化国家的首要任务。发展是党执政兴国的第一要务。"},{"id":"c2-a-s3","type":"single","orig":false,"origNo":null,"q":"按照“两步走”战略安排，到本世纪中叶，我国要（ ）。","options":["基本实现社会主义现代化","建成富强民主文明和谐美丽的社会主义现代化强国","进入创新型国家前列","实现共同富裕"],"answer":"B","explain":"“两步走”战略安排：到2035年基本实现社会主义现代化，到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。"},{"id":"c2-a-s4","type":"single","orig":false,"origNo":null,"q":"中国式现代化坚持“并联式”发展，工业化、信息化、城镇化、农业现代化叠加推进。这种发展方式体现的我国现代化特征是（ ）。","options":["人口规模巨大","全体人民共同富裕","物质文明和精神文明相协调","走和平发展道路"],"answer":"A","explain":"人口规模巨大决定了我国现代化不能按部就班、串联推进，只能发挥后发优势并联式推进，四化同步、叠加发展。"},{"id":"c2-a-s5","type":"single","orig":false,"origNo":null,"q":"实现中华民族伟大复兴的中国梦，必须走中国道路、弘扬中国精神、凝聚中国力量。其中，“中国精神”是指（ ）。","options":["以爱国主义为核心的民族精神和以改革创新为核心的时代精神","艰苦奋斗精神和勤俭节约精神","集体主义精神和奉献精神","革命英雄主义和乐观主义精神"],"answer":"A","explain":"中国精神是以爱国主义为核心的民族精神和以改革创新为核心的时代精神，是实现中国梦的精神力量。"},{"id":"c2-a-s6","type":"single","orig":false,"origNo":null,"q":"推进中国式现代化需要正确处理自立自强与对外开放的关系，这要求我们（ ）。","options":["关起门来搞建设","把发展立足点放在国内，依托我国超大规模市场优势，同时坚持对外开放","完全依赖外部市场和资源","放弃自主创新，全面引进技术"],"answer":"B","explain":"自立自强与对外开放是辩证统一的。要把发展的立足点放在国内，依靠自身力量，同时坚定不移扩大对外开放，在开放中提升自主发展能力。"},{"id":"c2-a-s7","type":"single","orig":false,"origNo":null,"q":"中国式现代化创造了人类文明新形态，其核心要义在于（ ）。","options":["坚持和发展社会主义文明，推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展","照搬西方文明","回归传统文明","建立全球统一文明标准"],"answer":"A","explain":"人类文明新形态是五大文明协调发展的社会主义文明形态，是对人类文明发展道路的拓展和贡献。"},{"id":"c2-a-s8","type":"single","orig":false,"origNo":null,"q":"我国现代化与西方现代化的一大区别在于发展过程：中国式现代化是（ ）的过程。","options":["串联式","并联式","跳跃式","循环式"],"answer":"B","explain":"西方现代化是工业化、城镇化、农业现代化、信息化顺序发展的“串联式”过程；中国式现代化是工业化、信息化、城镇化、农业现代化叠加发展的“并联式”过程。"},{"id":"c2-a-s9","type":"single","orig":false,"origNo":null,"q":"中国式现代化坚持“共同富裕”的价值追求，这要求（ ）。","options":["同步富裕、同等富裕","消除一切收入差距","在做大“蛋糕”的同时分好“蛋糕”，逐步实现全体人民共同富裕","主要依靠财政转移支付实现平均分配"],"answer":"C","explain":"共同富裕是全体人民的富裕，不是平均主义，要通过高质量发展把“蛋糕”做大做好，并通过合理的制度安排把“蛋糕”切好分好。"},{"id":"c2-a-s10","type":"single","orig":false,"origNo":null,"q":"新时代新征程中国共产党的中心任务是（ ）。","options":["全面建成小康社会","团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴","实现中华民族伟大复兴的中国梦","构建人类命运共同体"],"answer":"B","explain":"党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"id":"c2-a-m1","type":"multi","orig":false,"origNo":null,"q":"中国式现代化的五个特色包括（ ）。","options":["人口规模巨大的现代化","全体人民共同富裕的现代化","物质文明和精神文明相协调的现代化","人与自然和谐共生的现代化、走和平发展道路的现代化"],"answer":"ABCD","explain":"中国式现代化五个特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。"},{"id":"c2-a-m2","type":"multi","orig":false,"origNo":null,"q":"中国式现代化的本质要求包括（ ）。","options":["坚持中国共产党领导，坚持中国特色社会主义","实现高质量发展，发展全过程人民民主","丰富人民精神世界，实现全体人民共同富裕","促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态"],"answer":"ABCD","explain":"中国式现代化本质要求共九条，涵盖领导力量、发展道路、经济、政治、文化、社会、生态、国际关系和文明形态九个方面。"},{"id":"c2-a-m3","type":"multi","orig":false,"origNo":null,"q":"推进中国式现代化需要正确处理的一系列重大关系包括（ ）。","options":["顶层设计与实践探索、战略与策略","守正与创新、效率与公平","活力与秩序、自立自强与对外开放","改革发展与稳定"],"answer":"ABC","explain":"推进中国式现代化需要正确处理六对重大关系：顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放。D项“改革发展稳定”属于全面深化改革要处理的关系。"},{"id":"c2-a-m4","type":"multi","orig":false,"origNo":null,"q":"实现中华民族伟大复兴的中国梦，必须（ ）。","options":["走中国道路","弘扬中国精神","凝聚中国力量","坚持和平演变"],"answer":"ABC","explain":"实现中国梦必须走中国道路（中国特色社会主义道路）、弘扬中国精神（民族精神和时代精神）、凝聚中国力量（全国各族人民大团结的力量）。"},{"id":"c2-a-m5","type":"multi","orig":false,"origNo":null,"q":"新时代“两步走”战略安排中，到2035年基本实现社会主义现代化的目标包括（ ）。","options":["经济实力、科技实力、综合国力大幅跃升","进入创新型国家前列","基本实现新型工业化、信息化、城镇化、农业现代化","建成社会主义现代化强国"],"answer":"ABC","explain":"到2035年基本实现社会主义现代化的目标包括经济实力科技实力综合国力大幅跃升、进入创新型国家前列、基本实现新型工业化信息化城镇化农业现代化等；建成社会主义现代化强国是本世纪中叶目标。"},{"id":"c2-a-m6","type":"multi","orig":false,"origNo":null,"q":"“四个伟大”指（ ）。","options":["伟大斗争","伟大工程","伟大事业","伟大梦想"],"answer":"ABCD","explain":"“四个伟大”即伟大斗争、伟大工程、伟大事业、伟大梦想，其中起决定性作用的是党的建设新的伟大工程。"},{"id":"c2-a-f1","type":"fill","orig":false,"origNo":null,"q":"中国梦的本质是____、民族振兴、____。","options":[],"answer":["国家富强；人民幸福"],"explain":"中国梦的本质是国家富强、民族振兴、人民幸福。"},{"id":"c2-a-f2","type":"fill","orig":false,"origNo":null,"q":"中国式现代化是中国共产党领导的____，既有各国现代化的共同特征，更有基于自己国情的____。","options":[],"answer":["社会主义现代化；中国特色"],"explain":"这是中国式现代化的基本定义。"},{"id":"c2-a-f3","type":"fill","orig":false,"origNo":null,"q":"中国式现代化是人口规模____的现代化、全体人民____的现代化、物质文明和精神文明____的现代化、人与自然____的现代化、走____道路的现代化。","options":[],"answer":["巨大；共同富裕；相协调；和谐共生；和平发展"],"explain":"中国式现代化的五个特色。"},{"id":"c2-a-f4","type":"fill","orig":false,"origNo":null,"q":"全面建设社会主义现代化国家的首要任务是____。","options":[],"answer":["高质量发展"],"explain":"高质量发展是全面建设社会主义现代化国家的首要任务。"},{"id":"c2-a-f5","type":"fill","orig":false,"origNo":null,"q":"按照“两步走”战略安排，到____年基本实现社会主义现代化，到本世纪中叶建成____的社会主义现代化强国。","options":[],"answer":["2035；富强民主文明和谐美丽"],"explain":"新时代“两步走”战略安排。"},{"id":"c2-a-f6","type":"fill","orig":false,"origNo":null,"q":"中国式现代化的本质要求中，排在首位的是____。","options":[],"answer":["坚持中国共产党领导"],"explain":"坚持中国共产党领导是中国式现代化最本质的特征和最大优势。"},{"id":"c2-a-f7","type":"fill","orig":false,"origNo":null,"q":"推进中国式现代化需要正确处理____与实践探索、战略与策略、守正与创新、效率与公平、____、自立自强与对外开放等重大关系。","options":[],"answer":["顶层设计；活力与秩序"],"explain":"六对重大关系。"},{"id":"c2-a-f8","type":"fill","orig":false,"origNo":null,"q":"中国式现代化创造了____新形态。","options":[],"answer":["人类文明"],"explain":"中国式现代化创造人类文明新形态，为人类实现现代化提供了新的选择。"}]},{"id":"c3","title":"第三章 习近平党建思想","note":"原题来源：第三章习近平党建思想练习题.docx（单选19+多选15）；补充题依据：《习近平新时代中国特色社会主义思想概论》2023年版教材要点、党的二十大报告及习近平党建思想相关文献。","questions":[{"id":"c3-o-s1","type":"single","orig":true,"origNo":1,"q":"习近平党建思想形成的时代背景是（ ）","options":["改革开放初期","中国特色社会主义进入新时代","新中国成立初期","社会主义革命和建设时期"],"answer":"B","explain":"习近平党建思想是在中国特色社会主义进入新时代这一新的历史方位下，围绕“建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党”这一重大时代课题形成的。"},{"id":"c3-o-s2","type":"single","orig":true,"origNo":2,"q":"习近平党建思想的核心要义中，强调党的建设的根本原则是（ ）","options":["坚持和加强党的全面领导","坚持党要管党、全面从严治党","坚持以人民为中心","坚持思想建党、理论强党"],"answer":"A","explain":"坚持和加强党的全面领导是党的建设的根本原则，是中国特色社会主义事业取得胜利的根本保证。"},{"id":"c3-o-s3","type":"single","orig":true,"origNo":3,"q":"习近平党建思想中，新时代党的建设的总要求是（ ）","options":["全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中","以党的政治建设为统领，以坚定理想信念宗旨为根基","不断提高党的建设质量","以上都是"],"answer":"D","explain":"新时代党的建设总要求是一个有机整体，涵盖了政治、思想、组织、作风、纪律、制度等各方面，核心是提高党的建设质量。"},{"id":"c3-o-s4","type":"single","orig":true,"origNo":4,"q":"习近平指出，党的政治建设是党的根本性建设，决定党的建设方向和效果。这体现了（ ）","options":["政治建设在党的建设中的统领地位","思想建设的基础性作用","组织建设的保障作用","纪律建设的约束作用"],"answer":"A","explain":"习近平强调政治建设是党的根本性建设，意味着政治建设在党的建设中处于统领地位，决定其他建设的方向。"},{"id":"c3-o-s5","type":"single","orig":true,"origNo":5,"q":"习近平党建思想的理论渊源不包括（ ）","options":["马克思列宁主义建党学说","毛泽东思想建党理论","西方政党制度理论","中华优秀传统文化中的治国理政智慧"],"answer":"C","explain":"习近平党建思想主要来源于马克思主义建党学说、中国共产党历代领导集体的党建思想以及中华优秀传统文化，西方政党制度理论并非其理论渊源。"},{"id":"c3-o-s6","type":"single","orig":true,"origNo":6,"q":"习近平强调，全面从严治党首先要从（ ）上看。","options":["思想","政治","组织","作风"],"answer":"B","explain":"全面从严治党首先要从政治上看，不断提高政治判断力、政治领悟力、政治执行力，这是党的政治建设的核心要求。"},{"id":"c3-o-s7","type":"single","orig":true,"origNo":7,"q":"习近平党建思想中，“不忘初心、牢记使命”主题教育活动的根本任务是（ ）","options":["深入学习贯彻习近平新时代中国特色社会主义思想","锤炼忠诚干净担当的政治品格","团结带领全国各族人民为实现伟大梦想共同奋斗","以上都是"],"answer":"D","explain":"“不忘初心、牢记使命”主题教育的根本任务是深入学习贯彻习近平新时代中国特色社会主义思想，锤炼忠诚干净担当的政治品格，团结带领全国各族人民为实现伟大梦想共同奋斗。"},{"id":"c3-o-s8","type":"single","orig":true,"origNo":8,"q":"习近平指出，党的（ ）是党的基础性建设，是保持党的先进性和纯洁性的根本性工程。","options":["政治建设","思想建设","组织建设","作风建设"],"answer":"B","explain":"思想建设是党的基础性建设，坚定理想信念是思想建设的首要任务，是保持党的先进性和纯洁性的根本性工程。"},{"id":"c3-o-s9","type":"single","orig":true,"origNo":9,"q":"习近平强调，作风建设永远在路上。党的作风建设的核心问题是（ ）","options":["保持党同人民群众的血肉联系","反对形式主义、官僚主义","坚持艰苦奋斗","严格执行中央八项规定"],"answer":"A","explain":"作风建设的核心问题是保持党同人民群众的血肉联系，这是党的性质和宗旨的体现。"},{"id":"c3-o-s10","type":"single","orig":true,"origNo":10,"q":"习近平党建思想中，党的纪律建设的首要纪律是（ ）","options":["廉洁纪律","组织纪律","政治纪律","群众纪律"],"answer":"C","explain":"政治纪律是党最重要、最根本、最关键的纪律，是维护党的团结统一、完成党的任务的保证。"},{"id":"c3-o-s11","type":"single","orig":true,"origNo":11,"q":"习近平指出，要把（ ）作为党的建设的永恒课题和全体党员、干部的终身课题。","options":["不忘初心、牢记使命","全面从严治党","党的政治建设","党的思想建设"],"answer":"A","explain":"习近平强调，“不忘初心、牢记使命”是加强党的建设的永恒课题，也是全体党员、干部的终身课题。"},{"id":"c3-o-s12","type":"single","orig":true,"origNo":12,"q":"习近平党建思想中，新时代党的建设总目标是把党建设成为（ ）","options":["始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党","世界第一大政党","社会主义现代化强国","中国特色社会主义事业的领导核心"],"answer":"A","explain":"新时代党的建设总目标是建设始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。"},{"id":"c3-o-s13","type":"single","orig":true,"origNo":13,"q":"习近平强调，党的（ ）是党的根本性建设，决定党的建设方向和效果。","options":["政治建设","组织建设","作风建设","纪律建设"],"answer":"A","explain":"政治建设是党的根本性建设，决定党的建设方向和效果，这是习近平党建思想的重要论断。"},{"id":"c3-o-s14","type":"single","orig":true,"origNo":14,"q":"习近平指出，全面从严治党，关键是要抓住（ ）这个“关键少数”。","options":["领导干部","党员","基层干部","青年党员"],"answer":"A","explain":"全面从严治党，关键是要抓住领导干部这个“关键少数”，发挥其示范带头作用。"},{"id":"c3-o-s15","type":"single","orig":true,"origNo":15,"q":"习近平党建思想中，党的（ ）是党长期执政的根本大法。","options":["党章","宪法","党内法规","党的纪律"],"answer":"A","explain":"党章是党的总章程，是党的根本大法，是全党必须遵循的总规矩。"},{"id":"c3-o-s16","type":"single","orig":true,"origNo":16,"q":"习近平强调，要把（ ）作为党的思想建设的首要任务。","options":["坚定理想信念","学习马克思主义理论","践行社会主义核心价值观","弘扬爱国主义精神"],"answer":"A","explain":"坚定理想信念是党的思想建设的首要任务，是共产党人精神上的“钙”。"},{"id":"c3-o-s17","type":"single","orig":true,"origNo":17,"q":"习近平党建思想中，党的（ ）是党最根本、最重要的纪律。","options":["政治纪律","组织纪律","廉洁纪律","工作纪律"],"answer":"A","explain":"政治纪律是党最根本、最重要的纪律，遵守党的政治纪律是遵守党的全部纪律的基础。"},{"id":"c3-o-s18","type":"single","orig":true,"origNo":18,"q":"习近平党建思想强调，要持之以恒正风肃纪，重点强化（ ）","options":["政治纪律和组织纪律","廉洁纪律和群众纪律","工作纪律和生活纪律","以上都是"],"answer":"A","explain":"习近平强调，要重点强化政治纪律和组织纪律，带动廉洁纪律、群众纪律、工作纪律、生活纪律严起来。"},{"id":"c3-o-s19","type":"single","orig":true,"origNo":19,"q":"习近平党建思想中，新时代党的组织路线强调要着力培养（ ）的高素质干部队伍。","options":["忠诚干净担当","德才兼备","以德为先","以上都是"],"answer":"A","explain":"新时代党的组织路线强调要着力培养忠诚干净担当的高素质干部队伍，这是干部队伍建设的核心要求。"},{"id":"c3-o-m1","type":"multi","orig":true,"origNo":1,"q":"习近平党建思想产生的时代背景包括（ ）","options":["世界百年未有之大变局加速演进","中国特色社会主义进入新时代","党面临的“四大考验”“四种危险”长期存在","中华民族伟大复兴进入关键时期"],"answer":"ABCD","explain":"习近平党建思想是在世界大变局、新时代、风险考验、复兴关键期等多重背景下形成的，具有鲜明的时代特征。"},{"id":"c3-o-m2","type":"multi","orig":true,"origNo":2,"q":"习近平党建思想的理论渊源包括（ ）","options":["马克思列宁主义建党学说","毛泽东思想建党理论","中国特色社会主义理论体系中的党建思想","中华优秀传统文化中的治国理政智慧"],"answer":"ABCD","explain":"习近平党建思想继承和发展了马克思主义建党学说，吸收了历代领导集体的党建思想，并汲取了中华优秀传统文化的智慧。"},{"id":"c3-o-m3","type":"multi","orig":true,"origNo":3,"q":"新时代党的建设总要求中，党的建设的总体布局包括（ ）","options":["政治建设","思想建设、组织建设、作风建设、纪律建设","把制度建设贯穿其中","深入推进反腐败斗争"],"answer":"ABCD","explain":"新时代党的建设总体布局是“5+2”布局，即政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争。"},{"id":"c3-o-m4","type":"multi","orig":true,"origNo":4,"q":"习近平党建思想中，党的政治建设的基本内容包括（ ）","options":["坚持和加强党的全面领导","保证全党服从中央，维护党中央权威和集中统一领导","严肃党内政治生活","发展积极健康的党内政治文化"],"answer":"ABCD","explain":"党的政治建设涵盖领导核心、组织原则、政治生活、政治文化等多个方面，是党的根本性建设。"},{"id":"c3-o-m5","type":"multi","orig":true,"origNo":5,"q":"习近平强调，全面从严治党要（ ）","options":["真管真严","敢管敢严","长管长严","时管时严"],"answer":"ABC","explain":"全面从严治党强调“真管真严、敢管敢严、长管长严”，体现的是常态化、长效化，而非时断时续。"},{"id":"c3-o-m6","type":"multi","orig":true,"origNo":6,"q":"新时代党的组织路线强调的重点内容包括（ ）","options":["以组织体系建设为重点","着力培养忠诚干净担当的高素质干部队伍","着力集聚爱国奉献的各方面优秀人才","坚持德才兼备、以德为先、任人唯贤"],"answer":"ABCD","explain":"新时代党的组织路线涵盖了组织体系建设、干部队伍建设、人才队伍建设以及选人用人原则。"},{"id":"c3-o-m7","type":"multi","orig":true,"origNo":7,"q":"习近平党建思想中，党的作风建设的主要内容包括（ ）","options":["保持党同人民群众的血肉联系","坚决反对形式主义、官僚主义、享乐主义和奢靡之风","严格执行中央八项规定精神","弘扬艰苦奋斗、勤俭节约的优良作风"],"answer":"ABCD","explain":"作风建设围绕联系群众、反对“四风”、落实八项规定、弘扬优良作风等方面展开。"},{"id":"c3-o-m8","type":"multi","orig":true,"origNo":8,"q":"习近平党建思想中，推进反腐败斗争的基本要求包括（ ）","options":["坚持无禁区、全覆盖、零容忍","坚持重遏制、强高压、长震慑","一体推进不敢腐、不能腐、不想腐","深化标本兼治，加强反腐败国际合作"],"answer":"ABCD","explain":"反腐败斗争强调“三不”一体推进，坚持“无禁区、全覆盖、零容忍”和“重遏制、强高压、长震慑”。"},{"id":"c3-o-m9","type":"multi","orig":true,"origNo":9,"q":"习近平党建思想中，坚持和加强党的全面领导的具体体现包括（ ）","options":["党对一切工作的领导","完善坚持党的领导的体制机制","提高党科学执政、民主执政、依法执政水平","确保党始终总揽全局、协调各方"],"answer":"ABCD","explain":"党的全面领导体现在领导范围、体制机制、执政方式以及领导核心作用等多个方面。"},{"id":"c3-o-m10","type":"multi","orig":true,"origNo":10,"q":"习近平党建思想强调，全党要增强“四个意识”，具体包括（ ）","options":["政治意识","大局意识","核心意识","看齐意识"],"answer":"ABCD","explain":"“四个意识”是政治意识、大局意识、核心意识、看齐意识，是维护党中央权威和集中统一领导的重要要求。"},{"id":"c3-o-m11","type":"multi","orig":true,"origNo":11,"q":"习近平党建思想强调，要建设（ ）的马克思主义执政党。","options":["始终走在时代前列","人民衷心拥护","勇于自我革命","经得起各种风浪考验、朝气蓬勃"],"answer":"ABCD","explain":"新时代党的建设总目标明确要建设“始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃”的马克思主义执政党。"},{"id":"c3-o-m12","type":"multi","orig":true,"origNo":12,"q":"习近平党建思想中，党内政治生活的基本规范包括（ ）","options":["实事求是","理论联系实际","密切联系群众","批评和自我批评、民主集中制"],"answer":"ABCD","explain":"党内政治生活的基本规范包括实事求是、理论联系实际、密切联系群众、批评和自我批评、民主集中制等。"},{"id":"c3-o-m13","type":"multi","orig":true,"origNo":13,"q":"习近平党建思想中，新时代党的组织体系建设的要求包括（ ）","options":["党中央是大脑和中枢","党的地方组织是中间环节","党的基层组织是战斗堡垒","确保党的组织体系严密高效"],"answer":"ABCD","explain":"党的组织体系建设强调中央、地方、基层各司其职，形成上下贯通、执行有力的严密体系。"},{"id":"c3-o-m14","type":"multi","orig":true,"origNo":14,"q":"习近平党建思想强调，要培养（ ）的高素质干部队伍。","options":["忠诚","干净","担当","创新"],"answer":"ABC","explain":"高素质干部队伍的核心要求是忠诚干净担当，“创新”是工作要求而非核心素质标准。"},{"id":"c3-o-m15","type":"multi","orig":true,"origNo":15,"q":"习近平党建思想中，党的群众路线的基本内容包括（ ）","options":["一切为了群众","一切依靠群众","从群众中来","到群众中去"],"answer":"ABCD","explain":"党的群众路线包括“一切为了群众，一切依靠群众，从群众中来，到群众中去”四个方面。"},{"id":"c3-a-s1","type":"single","orig":false,"origNo":null,"q":"毛泽东同志当年在延安窑洞给出跳出治乱兴衰历史周期率的第一个答案是（ ），经过不懈努力，党找到了第二个答案——（ ）。","options":["让人民来监督政府；自我革命","民主集中制；全面从严治党","批评和自我批评；党的建设","群众路线；自我净化"],"answer":"A","explain":"毛泽东同志给出跳出历史周期率的第一个答案是“让人民来监督政府”；党的二十大报告指出，党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。"},{"id":"c3-a-s2","type":"single","orig":false,"origNo":null,"q":"新时代党的建设总体布局是“5+2”布局，其中居于统领地位的是（ ）。","options":["政治建设","思想建设","制度建设","纪律建设"],"answer":"A","explain":"“5+2”布局即政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争。其中政治建设是统领，是党的根本性建设。"},{"id":"c3-a-s3","type":"single","orig":false,"origNo":null,"q":"全面从严治党，基础在全面，关键在严，要害在治。其中“严”主要体现在（ ）。","options":["真管真严、敢管敢严、长管长严","严惩极少数腐败分子","严把党员发展入口关","严格党的纪律处分"],"answer":"A","explain":"全面从严治党的“严”体现为真管真严、敢管敢严、长管长严，贯穿管党治党的全过程各方面。"},{"id":"c3-a-s4","type":"single","orig":false,"origNo":null,"q":"党的二十大报告强调，全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在（ ）。","options":["党","人民","科技","制度"],"answer":"A","explain":"党的二十大报告指出，全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。必须时刻保持解决大党独有难题的清醒和坚定。"},{"id":"c3-a-s5","type":"single","orig":false,"origNo":null,"q":"党面临的“四大考验”是指（ ）。","options":["执政考验、改革开放考验、市场经济考验、外部环境考验","政治考验、经济考验、文化考验、社会考验","思想考验、组织考验、作风考验、纪律考验","国内考验、国际考验、历史考验、现实考验"],"answer":"A","explain":"“四大考验”即执政考验、改革开放考验、市场经济考验、外部环境考验，是党在新时代面临的长期性考验。"},{"id":"c3-a-s6","type":"single","orig":false,"origNo":null,"q":"党面临的“四种危险”是指（ ）。","options":["精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险","政治动摇危险、思想滑坡危险、组织涣散危险、作风漂浮危险","信仰危机危险、本领恐慌危险、官僚主义危险、享乐主义危险","纪律松弛危险、制度失效危险、监督缺位危险、腐败蔓延危险"],"answer":"A","explain":"“四种危险”即精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险，是党必须时刻防范的重大风险。"},{"id":"c3-a-s7","type":"single","orig":false,"origNo":null,"q":"党的二十大报告强调，必须持之以恒推进全面从严治党，深入推进新时代党的建设新的伟大工程，以党的自我革命（ ）。","options":["引领社会革命","推动经济发展","带动国家治理","促进改革开放"],"answer":"A","explain":"以党的自我革命引领社会革命，是新时代党的建设的重要要求，体现了党勇于自我革命的鲜明品格。"},{"id":"c3-a-s8","type":"single","orig":false,"origNo":null,"q":"党的自我革命制度规范体系中，“三不腐”一体推进是指（ ）。","options":["不敢腐、不能腐、不想腐","不敢腐、不愿腐、不能腐","不能腐、不想腐、不必腐","不敢腐、不必腐、不愿腐"],"answer":"A","explain":"一体推进不敢腐、不能腐、不想腐，是反腐败斗争的基本方针和重要方略。"},{"id":"c3-a-s9","type":"single","orig":false,"origNo":null,"q":"“三个务必”中，体现党永葆先进性和纯洁性要求的是（ ）。","options":["务必不忘初心、牢记使命","务必谦虚谨慎、艰苦奋斗","务必敢于斗争、善于斗争","务必实事求是、与时俱进"],"answer":"A","explain":"“三个务必”即务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。务必不忘初心、牢记使命体现党永葆先进性和纯洁性的根本要求。"},{"id":"c3-a-s10","type":"single","orig":false,"origNo":null,"q":"全面从严治党是党永葆生机活力、走好新的赶考之路的（ ）。","options":["必由之路","根本目的","首要任务","基础工程"],"answer":"A","explain":"五个“必由之路”之一：全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。"},{"id":"c3-a-m1","type":"multi","orig":false,"origNo":null,"q":"党的二十大报告提出的“三个务必”包括（ ）。","options":["务必不忘初心、牢记使命","务必谦虚谨慎、艰苦奋斗","务必敢于斗争、善于斗争","务必自力更生、艰苦奋斗"],"answer":"ABC","explain":"“三个务必”即务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争。D项“自力更生、艰苦奋斗”不是“三个务必”的表述。"},{"id":"c3-a-m2","type":"multi","orig":false,"origNo":null,"q":"党在新时代面临的“四大考验”和“四种危险”包括（ ）。","options":["执政考验、改革开放考验、市场经济考验、外部环境考验","精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险","经济风险、政治风险、社会风险、生态风险","政治动摇、思想滑坡、组织涣散、纪律松弛"],"answer":"AB","explain":"“四大考验”即执政、改革开放、市场经济、外部环境考验；“四种危险”即精神懈怠、能力不足、脱离群众、消极腐败危险。C、D项均不属于标准表述。"},{"id":"c3-a-m3","type":"multi","orig":false,"origNo":null,"q":"新时代党的建设总要求强调，要（ ）。","options":["坚持和加强党的全面领导","坚持党要管党、全面从严治党","以党的政治建设为统领，以坚定理想信念宗旨为根基，不断提高党的建设质量","把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党"],"answer":"ABCD","explain":"新时代党的建设总要求涵盖根本方针、工作主线、总体布局、总目标等内容，四个选项共同构成其完整表述。"},{"id":"c3-a-m4","type":"multi","orig":false,"origNo":null,"q":"坚持和加强党的全面领导，要求全党做到（ ）。","options":["增强“四个意识”、坚定“四个自信”","做到“两个维护”","完善坚持党的领导的体制机制","提高党科学执政、民主执政、依法执政水平"],"answer":"ABCD","explain":"坚持和加强党的全面领导体现在思想自觉、政治自觉、体制机制和执政方式等多个层面。"},{"id":"c3-a-m5","type":"multi","orig":false,"origNo":null,"q":"关于党的自我革命，下列说法正确的有（ ）。","options":["自我革命是跳出治乱兴衰历史周期率的第二个答案","全面从严治党永远在路上，党的自我革命永远在路上","以党的自我革命引领社会革命","自我革命确保党永远不变质、不变色、不变味"],"answer":"ABCD","explain":"自我革命是党跳出历史周期率的第二个答案；全面从严治党永远在路上、自我革命永远在路上；以自我革命引领社会革命，确保党不变质、不变色、不变味。"},{"id":"c3-a-f1","type":"fill","orig":false,"origNo":null,"q":"党找到了跳出治乱兴衰历史周期率的第二个答案——____，确保党永远不变质、不变色、不变味。","options":[],"answer":["自我革命"],"explain":"自我革命是跳出历史周期率的第二个答案，第一个答案是毛泽东同志提出的“让人民来监督政府”。"},{"id":"c3-a-f2","type":"fill","orig":false,"origNo":null,"q":"“三个务必”是务必____、牢记使命，务必谦虚谨慎、____，务必敢于斗争、善于斗争。","options":[],"answer":["不忘初心；艰苦奋斗"],"explain":"党的二十大报告提出“三个务必”。"},{"id":"c3-a-f3","type":"fill","orig":false,"origNo":null,"q":"党面临的“四大考验”是执政考验、____考验、市场经济考验、____考验。","options":[],"answer":["改革开放；外部环境"],"explain":"“四大考验”即执政、改革开放、市场经济、外部环境考验。"},{"id":"c3-a-f4","type":"fill","orig":false,"origNo":null,"q":"党面临的“四种危险”是____危险、能力不足危险、____危险、消极腐败危险。","options":[],"answer":["精神懈怠；脱离群众"],"explain":"“四种危险”即精神懈怠、能力不足、脱离群众、消极腐败危险。"},{"id":"c3-a-f5","type":"fill","orig":false,"origNo":null,"q":"新时代党的建设总体布局是“5+2”布局：____建设、思想建设、组织建设、____建设、纪律建设，把____建设贯穿其中，深入推进____斗争。","options":[],"answer":["政治；作风；制度；反腐败"],"explain":"“5+2”布局：政治、思想、组织、作风、纪律建设+制度建设贯穿其中+反腐败斗争。"},{"id":"c3-a-f6","type":"fill","orig":false,"origNo":null,"q":"____建设是党的根本性建设，决定党的建设方向和效果；____建设是党的基础性建设。","options":[],"answer":["政治；思想"],"explain":"政治建设是根本性建设，思想建设是基础性建设。"},{"id":"c3-a-f7","type":"fill","orig":false,"origNo":null,"q":"全面从严治党，核心是____，基础在全面，关键在严，要害在治。","options":[],"answer":["加强党的领导"],"explain":"全面从严治党的核心是加强党的领导。"},{"id":"c3-a-f8","type":"fill","orig":false,"origNo":null,"q":"一体推进____、不能腐、____，是反腐败斗争的基本方针。","options":[],"answer":["不敢腐；不想腐"],"explain":"一体推进不敢腐、不能腐、不想腐。"}]},{"id":"c4","title":"第四章 坚持以人民为中心","note":"原题来源：第四章练习题.docx（单选30+多选20，答案与解析取自原文件）；补充依据：《习近平新时代中国特色社会主义思想概论》2023年版教材第四章。","questions":[{"id":"c4-o-s1","type":"single","orig":true,"origNo":1,"q":"人民是历史的创造者，是决定党和国家前途命运的（ ）。","options":["根本力量","重要力量","领导力量","辅助力量"],"answer":"A","explain":"本题考查人民的历史地位。马克思主义认为，人民是历史的创造者，是决定党和国家前途命运的根本力量。"},{"id":"c4-o-s2","type":"single","orig":true,"origNo":2,"q":"中国共产党的根本政治立场是（ ）。","options":["阶级立场","人民立场","国家立场","民族立场"],"answer":"B","explain":"本题考查党的根本立场。人民立场是中国共产党的根本政治立场，是马克思主义政党区别于其他政党的显著标志。"},{"id":"c4-o-s3","type":"single","orig":true,"origNo":3,"q":"“以人民为中心”的发展思想，其核心是（ ）。","options":["经济发展","社会和谐","人民利益","生态保护"],"answer":"C","explain":"本题考查“以人民为中心”的核心要义。以人民为中心，就是要坚持人民主体地位，把人民利益摆在至高无上的地位。"},{"id":"c4-o-s4","type":"single","orig":true,"origNo":4,"q":"检验一个政党、一个政权性质的试金石是（ ）。","options":["经济发展速度","国际地位高低","为什么人服务","军队力量强弱"],"answer":"C","explain":"本题考查政党的性质判断标准。为什么人的问题，是检验一个政党、一个政权性质的试金石。"},{"id":"c4-o-s5","type":"single","orig":true,"origNo":5,"q":"坚持人民主体地位，必须坚持（ ）这一根本政治制度。","options":["中国共产党领导的多党合作和政治协商制度","民族区域自治制度","人民代表大会制度","基层群众自治制度"],"answer":"C","explain":"本题考查根本政治制度。人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。"},{"id":"c4-o-s6","type":"single","orig":true,"origNo":6,"q":"党的一切工作必须以（ ）为最高标准。","options":["经济发展","社会稳定","最广大人民根本利益","国际影响力"],"answer":"C","explain":"本题考查党的工作的最高标准。党的一切工作，必须以最广大人民根本利益为最高标准。"},{"id":"c4-o-s7","type":"single","orig":true,"origNo":7,"q":"群众路线是党的（ ）。","options":["根本工作路线","基本领导方法","根本组织原则","重要指导思想"],"answer":"A","explain":"本题考查群众路线的地位。群众路线是我们党的生命线和根本工作路线。"},{"id":"c4-o-s8","type":"single","orig":true,"origNo":8,"q":"“一切为了群众，一切依靠群众，从群众中来，到群众中去”是党的（ ）。","options":["思想路线","政治路线","组织路线","群众路线"],"answer":"D","explain":"本题考查群众路线的内涵表述。这是群众路线的经典表述。"},{"id":"c4-o-s9","type":"single","orig":true,"origNo":9,"q":"共同富裕是社会主义的（ ）。","options":["根本原则","本质要求","最终目标","重要特征"],"answer":"B","explain":"本题考查共同富裕的地位。共同富裕是中国特色社会主义的本质要求。"},{"id":"c4-o-s10","type":"single","orig":true,"origNo":10,"q":"人民对（ ）的向往，就是我们的奋斗目标。","options":["美好生活","物质丰富","社会公平","政治民主"],"answer":"A","explain":"本题考查党的奋斗目标。这句话是习近平总书记对全党提出的要求。"},{"id":"c4-o-s11","type":"single","orig":true,"origNo":11,"q":"发展为了人民，这是马克思主义政治经济学的（ ）。","options":["根本立场","研究方法","理论基石","政策导向"],"answer":"A","explain":"本题考查发展为了人民的理论定位。它体现了马克思主义政治经济学的根本立场。"},{"id":"c4-o-s12","type":"single","orig":true,"origNo":12,"q":"衡量发展成效的最终标准是（ ）。","options":["GDP增长速度","财政收入规模","人民生活改善程度","科技创新数量"],"answer":"C","explain":"本题考查发展的最终目的。发展成效最终要看人民是否得到了实惠、人民生活是否得到了改善。"},{"id":"c4-o-s13","type":"single","orig":true,"origNo":13,"q":"“以人民为中心”的发展思想，要求我们在发展中保障和改善民生，这体现了（ ）。","options":["发展的目的与动力的统一","发展的速度与效益的统一","发展的内需与外需的统一","发展的宏观与微观的统一"],"answer":"A","explain":"本题考查对发展思想深层逻辑的理解。以人民为中心，既明确了发展“为了谁”（目的），也回答了发展“依靠谁”（动力），是目的与动力的统一。"},{"id":"c4-o-s14","type":"single","orig":true,"origNo":14,"q":"在脱贫攻坚战中，我们坚持“精准扶贫、精准脱贫”方略，这体现了群众路线中的（ ）。","options":["一切为了群众","一切依靠群众","从群众中来，到群众中去","以上都是"],"answer":"C","explain":"本题考查群众路线在实践中的运用。“精准扶贫”要求深入群众调查致贫原因（从群众中来），再制定有针对性的帮扶措施（到群众中去），是群众路线工作方法的生动体现。"},{"id":"c4-o-s15","type":"single","orig":true,"origNo":15,"q":"“人民是阅卷人”这一表述，深刻揭示了（ ）。","options":["党与人民是领导与被领导的关系","人民是党和国家一切工作的最终评判者","人民是历史的创造者","党要接受人民的监督"],"answer":"B","explain":"本题考查人民作为评判者的地位。“人民是阅卷人”形象地说明，党的工作成效最终要由人民来评判。"},{"id":"c4-o-s16","type":"single","orig":true,"origNo":16,"q":"坚持共享发展，首先要解决（ ）问题。","options":["公平正义","效率优先","经济增长","社会和谐"],"answer":"A","explain":"本题考查共享发展的前提。共享发展强调发展成果由人民共享，其前提是解决好公平正义问题。"},{"id":"c4-o-s17","type":"single","orig":true,"origNo":17,"q":"在新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和（ ）的发展之间的矛盾。","options":["不平衡不充分","不协调不可持续","低水平低质量","不全面不均衡"],"answer":"A","explain":"本题考查新时代我国社会主要矛盾的准确表述。党的十九大报告明确指出，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"id":"c4-o-s18","type":"single","orig":true,"origNo":18,"q":"坚持以人民为中心的发展思想，要求我们在处理发展问题时，首先要回答的问题是（ ）。","options":["如何实现经济快速增长","发展为了谁、依靠谁","如何提高国际竞争力","怎样实现技术自主创新"],"answer":"B","explain":"本题考查以人民为中心的核心要义。坚持以人民为中心，首先必须明确“发展为了谁、发展依靠谁、发展成果由谁共享”这一根本问题。选项A、C、D分别侧重于经济速度、国际竞争和科技创新，均不是第四章所强调的“以人民为中心”的首要问题。"},{"id":"c4-o-s19","type":"single","orig":true,"origNo":19,"q":"“我将无我，不负人民”体现了中国共产党人（ ）。","options":["全心全意为人民服务的宗旨","艰苦奋斗的优良作风","实事求是的思想路线","批评与自我批评的品格"],"answer":"A","explain":"本题考查对习近平总书记重要论述的理解。“我将无我，不负人民”深刻体现了共产党人全心全意为人民服务的根本宗旨和无私奉献的精神境界。"},{"id":"c4-o-s20","type":"single","orig":true,"origNo":20,"q":"保障和改善民生，必须坚持的基本原则是（ ）。","options":["效率优先、兼顾公平","尽力而为、量力而行","全面覆盖、平均分配","政府主导、市场辅助"],"answer":"B","explain":"本题考查保障和改善民生的基本原则。在民生工作中，既要积极作为、尽力解决好群众急难愁盼问题，又要尊重客观规律、量力而行，确保民生改善可持续。选项A是分配领域的早期提法，选项C“平均分配”不符合共同富裕的科学内涵，选项D表述不够全面准确。"},{"id":"c4-o-s21","type":"single","orig":true,"origNo":21,"q":"建设（ ）是坚持以人民为中心的发展思想在国家安全领域的生动体现。","options":["平安中国","法治中国","健康中国","美丽中国"],"answer":"A","explain":"本题考查平安中国建设。平安是人民幸福安康的基本要求，建设平安中国是坚持以人民为中心、维护人民根本利益的重要举措。"},{"id":"c4-o-s22","type":"single","orig":true,"origNo":22,"q":"“人民至上、生命至上”的理念，在抗击新冠疫情中得到了充分体现，这反映了（ ）。","options":["中国共产党的领导是中国特色社会主义最本质的特征","以人民为中心的价值追求","社会主义制度的优越性","以上都是"],"answer":"D","explain":"本题考查综合理解。“人民至上、生命至上”理念的践行，体现了党的领导、以人民为中心和制度优势的有机统一。"},{"id":"c4-o-s23","type":"single","orig":true,"origNo":23,"q":"坚持人民主体地位，必须发展（ ）民主。","options":["全过程人民","选举","协商","基层"],"answer":"A","explain":"本题考查全过程人民民主。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。"},{"id":"c4-o-s24","type":"single","orig":true,"origNo":24,"q":"走好新时代群众路线，要求党员干部要（ ）。","options":["深入基层、深入群众","坐在办公室听汇报","依靠网络了解民意","召开大会传达精神"],"answer":"A","explain":"本题考查新时代群众路线的基本要求。走好群众路线，关键在于深入基层、深入群众，了解真实情况，解决实际问题。"},{"id":"c4-o-s25","type":"single","orig":true,"origNo":25,"q":"习近平总书记指出：“江山就是人民，人民就是江山。”这一论断深刻揭示了（ ）。","options":["党与人民生死与共、休戚与共的血肉联系","国家政权与人民利益的一致性","党的执政基础在人民","以上都是"],"answer":"D","explain":"本题考查对“江山就是人民，人民就是江山”的全面理解。这一论断深刻阐明了党与人民的命运共同体关系，揭示了国家政权的本质和党的执政根基。"},{"id":"c4-o-s26","type":"single","orig":true,"origNo":26,"q":"从“脱贫攻坚”到“乡村振兴”，党始终把（ ）作为工作的重中之重。","options":["解决“三农”问题","城市发展","工业现代化","科技创新"],"answer":"A","explain":"本题考查党对“三农”工作的重视。从脱贫攻坚到乡村振兴，体现了党始终把解决好“三农”问题作为全党工作重中之重的一贯方针。"},{"id":"c4-o-s27","type":"single","orig":true,"origNo":27,"q":"坚持以人民为中心的发展思想，要求我们在推动高质量发展中（ ）。","options":["更加注重共同富裕","更加注重效率优先","更加注重资本扩张","更加注重规模扩大"],"answer":"A","explain":"本题考查高质量发展与以人民为中心的关系。高质量发展是能够更好满足人民日益增长的美好生活需要的发展，必须更加注重共同富裕。"},{"id":"c4-o-s28","type":"single","orig":true,"origNo":28,"q":"在推进共同富裕的过程中，要正确处理（ ）的关系。","options":["效率和公平","发展和安全","政府和市场","城市和乡村"],"answer":"A","explain":"本题考查共同富裕中的辩证关系。推进共同富裕，既要通过高质量发展提高效率，又要通过制度安排促进公平，实现效率和公平的有机统一。"},{"id":"c4-o-s29","type":"single","orig":true,"origNo":29,"q":"新时代坚持以人民为中心，必须把（ ）作为根本目的。","options":["促进人的全面发展","实现经济增长","维护社会稳定","增强国际竞争力"],"answer":"A","explain":"本题考查以人民为中心的终极目标。以人民为中心，最终是要促进人的全面发展、全体人民共同富裕，这是社会主义的本质要求。"},{"id":"c4-o-s30","type":"single","orig":true,"origNo":30,"q":"从“物质文化需要”到“美好生活需要”，这一表述的变化反映了（ ）。","options":["我国经济社会发展水平的显著提高","人民需求层次的不断提升","党对人民需求认识的深化","以上都是"],"answer":"D","explain":"本题考查对社会主要矛盾变化的理解。从“物质文化需要”到“美好生活需要”，既反映了发展成就，也体现了人民需求从低层次向高层次的跃升，更彰显了党与时俱进地把握人民需求。"},{"id":"c4-o-m1","type":"multi","orig":true,"origNo":1,"q":"坚持以人民为中心的发展思想，必须坚持（ ）。","options":["人民主体地位","人民利益至上","人民当家作主","人民共享发展成果"],"answer":"ABCD","explain":"本题考查以人民为中心的基本要求。这四个选项分别从主体地位、利益导向、政治权利和发展成果四个维度体现了以人民为中心的内涵。"},{"id":"c4-o-m2","type":"multi","orig":true,"origNo":2,"q":"群众路线的基本内容包括（ ）。","options":["一切为了群众","一切依靠群众","从群众中来","到群众中去"],"answer":"ABCD","explain":"本题考查群众路线的完整表述。这是群众路线的经典概括，四者缺一不可。"},{"id":"c4-o-m3","type":"multi","orig":true,"origNo":3,"q":"党的十九大报告指出，我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断。下列属于“没有改变”的内容有（ ）。","options":["我国仍处于并将长期处于社会主义初级阶段","我国是世界最大发展中国家的国际地位","我国社会主义民主政治的发展方向","我国经济总量位居世界第二的现状"],"answer":"AB","explain":"本题考查党的十九大报告关于“两个没有变”的表述。我国社会主要矛盾
